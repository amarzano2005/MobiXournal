[[task]]
id = "desktop-dial-zoom-and-width"
title = "Desktop: the dial zooms at the cursor and sizes the pen"
description = "The dial **zooms at the cursor**; the shipped delivery route is the tablet's own wheel, with the radial controller kept as the second one (corrected after the live pass). *Radial controller:* `dialZoomFactor` = `exp(0.002 × degrees)` clamped to 0.5–2 per event (one full turn ≈ 2×, one degree ≈ 0.2 %), applied by `DesktopShellState.dialZoom` through `zoomBy` around the page centre and dropping a fitted tab to free zoom, like every other manual zoom; the dial's button is `dialFit`, back to the tab's automatic fit (`AUTO`). Every event is posted to the window's event queue before it touches state, because Windows raises it on its own thread. *What the machine actually does:* the dial sends `WM_MOUSEWHEEL` (delta ±120) from the tablet's own HID device, so this route never fires here; `desktop-dial-wheel-zoom` is the one that ships the behaviour (`TabletWheel` names the device, the notch takes the zoom path at the cursor, the mouse's wheel keeps scrolling). **Not shipped, and deliberately so:** the stroke-width control, the diameter-ring preview and the `tablet.dial=zoom|width` setting — the width half is recorded as its own task. `TabletDialTest` covers the GUID byte order, the exponential and its symmetry, both shell commands, and a dial with nothing open."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-23
