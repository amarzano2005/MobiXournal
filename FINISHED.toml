[[task]]
id = "export-standalone-audio-as-m4a"
title = "Export standalone audio as M4A/AAC instead of Ogg/Opus"
description = """
A recording made in a .mobix is Ogg/Opus, and the standalone export (AudioStandaloneExporter, driven by saveStandaloneAudio) copied it byte for byte into Music/MobiXournal, so the file reached the user as .ogg. Uploaders that do not know Ogg/Opus refuse it: an AI assistant answers that the file was not processed by its audio component and injects the bytes as raw text. A .xopp-side export is the opposite problem - a WAV lecture is hundreds of megabytes. Fix: add audio/AudioTranscoder.kt (MediaExtractor + MediaCodec decode -> AAC at 48 kbps mono -> MediaMuxer MP4) writing <same timestamp>.m4a, and have AudioStandaloneExporter export that file with MIME audio/mp4 and its .m4a name; a recording already in M4A is copied as it is and a failed transcode exports the original bytes and media type rather than losing the recording. Run the export off the main thread from MainActivityAudio.toggleRecording (lifecycleScope + Dispatchers.IO) since re-encoding a lecture takes longer than a tap. Pin the pure decisions in a JVM test (exportedFileName, container/MIME, mimeTypeFor fallbacks). Docs: the standalone-export bullets of docs/audio-inking-sync.md, the audio bullet of README.md, the Settings -> Storage subtitle, and this entry. Verify: unit tests + assembleDebug; the transcode itself needs a device and stays unverified on a host without adb.

Landed: the standalone export is now `.m4a` whatever the app recorded. `audio/AudioTranscoder.kt` decodes the source with MediaExtractor + MediaCodec, re-encodes mono AAC at 48 kbps (the encoder every Android device must provide) and muxes it into MP4 at `<timestamp>.m4a` in the cache; `AudioStandaloneExporter.portableCopy` hands that file to MediaStore with MIME `audio/mp4`, copies an already-M4A recording untouched, and falls back to the original bytes plus `mimeTypeFor` when the transcode fails, so an export can never lose a recording. The cache copy is deleted once the media store has it. `MainActivityAudio.toggleRecording` runs the export on `Dispatchers.IO` and reports the format in the toast, and the Settings -> Storage subtitle names `.m4a`.
VERIFIED: 1527 unit tests / 0 failures including DocsGuardTest and SourceStructureTest, `assembleDebug` green (JDK 21 on the Windows desktop host). New `AudioTranscoderTest` (4 tests) pins the export name (`….ogg` -> `….m4a`), the container/MIME pair and the fallback media types.
CAVEAT: the transcode itself needs MediaCodec, so it is not exercised by a JVM test and `emulator_debug` was off for this task; recording a minute in a `.mobix` and checking that Music/MobiXournal receives a playable `.m4a` stays the device pass that settles it. Also note: the desktop distributable could not be regenerated - `:desktop:compileKotlin` fails on the uncommitted `desktop/…/GlassEdge.kt` (unresolved `dp`) that is another in-flight change, untouched here."""
status = "finished"
level = "task"
category = "bug"
created = 2026-10-22
completed = 2026-10-22
tags = ["audio"]

