[[task]]
id = "make-the-pen-sensitivity-controls-bite-desktop-slider-ranges-one-width-expression-disabled-with-reason-when-pressure-is-off-pressure-readout-in-diagnostics"
title = "Make the pen sensitivity controls bite: desktop slider ranges, one width expression, disabled-with-reason when pressure is off, pressure readout in diagnostics"
description = "The minimum-pressure and pressure-multiplier controls could be moved with no visible effect. Fixes: (1) PressureCurve now owns the whole width expression (widthPt) which widthForPressure calls, so the settings' effect on a drawn width is unit-tested; (2) the slider ranges are desktop Xournal++'s own (minimumPressure 0.01-1, multiplier 0.5-4) instead of the narrower 0.5/2.5 ceiling; (3) both controls are disabled with the reason while Pressure sensitivity is off, as the desktop greys the same frame, instead of silently doing nothing; (4) Pen diagnostics prints the raw pressure per event plus a PEN sens/mult/min/base -> width line logged whenever settings reach the surface, so a value that never arrives is visible. Tests: PressureCurveTest (width chain, ranges, pressure-off), PenInputLogTest (pressure line + dedupe key), SettingsSanitizeTest. Docs: README + architecture."
