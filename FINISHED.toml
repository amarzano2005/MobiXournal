id = "desktop-dirty-rect-pacing-for-scrolling-and-zooming"
title = "Desktop: dirty-rect pacing for scrolling and zooming"
description = "PagePicture no longer keys its recording on the viewport: the page is recorded once at DOCUMENT SCALE and every frame replays it under the canvas's own matrix - translate(viewport offset x density) then scale(zoom) - so a scroll is a translate and a zoom is a scale, both replays. Scaling a picture is not resampling (the commands are vectors, Skia rasterises them at the device scale), and PagePictureTest now measures the replay against the direct paint at 1.6x and 0.75x with a scroll applied (worst channel difference within its tolerance) and pins that a scroll and a zoom each leave records at one. A new --probe-scroll mode pans udiff.xopp at 200% and then pinches it while --diagnose times every paint: 3.6-4.3 ms mean / 6.8-22.2 ms worst before, 0.0-0.2 ms mean / 0.2 ms worst after, same host and window. Both runs show one ~390 ms gap at the scroll-to-zoom transition, recorded in docs/desktop-tablet.md as not caused by this change. :desktop:test, :mobix-core:test, :app:testDebugUnitTest (1558) and the guards green; packaged desktop app regenerated and smoke-launched on udiff.xopp with no exception."
