[[task]]
id = "let-the-vertical-space-block-cross-the-line"
title = "Let the vertical-space block cross the line"
description = "The grab line no longer stops the block: clampShift is gone and dragShift is now only the ruling snap, so the shift is the pointer's travel in either direction and pulling up carries the block above the line it was grabbed at (and, pulled far enough, off the top of the sheet, where it stays and can be dragged back down - the same recoverable state the desktop leaves). The old clamp made closing a gap below an element impossible without first inserting space elsewhere. What did NOT change is which elements move: the block is still decided once, at grab time, from the line's original position, so a block sliding upward past the elements above it does not recruit them (pinned by theBlockIsDecidedAtGrabTimeAndNoElementJoinsItMidDrag). Tests updated rather than weakened: removingSpaceStopsAtTheGrabLine is replaced by pullingUpCarriesTheBlockAcrossTheGrabLine (-80 pt on a stroke at 139.5 lands at 59.5, i.e. above the line at 100) and ElementBoundsTest's clampShift assertion - whose real subject is that ElementBounds inflation is shared by the selection and the grab line - now pins the shared inflation through the new semantics (a line at 85 counts the fat stroke in, a line at 95 does not). VerticalSpaceOpsTest additionally pins that snapping applies to a pull-up too. README.md + docs/architecture.md updated in the same change. NOT verified on a device (no emulator/tablet attached here): the feel of the crossing drag rests on the tested arithmetic plus a green build."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-09
completed = 2026-10-09
