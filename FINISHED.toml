[[task]]
id = "desktop-pdf-import-page-builder"
title = "Desktop: build the pages of an imported PDF"
description = "Shipped as `desktop/src/main/java/com/mobixournal/desktop/DesktopPdfImport.kt`: `open(file)` loads a PDF and refuses an unreadable or empty one with a sentence (`PdfImportRefused`, naming the file and what to do), `pageCount(file)` answers the card's readout, `pages(pdf, reference, pageNoOffset = 0)` builds one `Page` per PDF page — `width`/`height` from the media box in points, swapped for a quarter-turned page so the sheet follows the rotation — with `Background.Pdf(filename = reference` on the first page only, `domain = ABSOLUTE_DOMAIN` on that same page, and `pageno` running from the offset on every page, plus one empty layer to draw on; `document(pdf, reference)` is the whole-document form and `retarget(pages, joined)` re-points the single reference after a merge. The shape is the tablet's `render/PdfImport` exactly, but the two numbers that importer asked a `Bitmap` cache for come from the desktop's own PDFBox, so nothing of Android enters. Verified by `desktop/src/test/java/com/mobixournal/desktop/DesktopPdfImportTest.kt` (five cases over PDFs the test builds itself): page count, sheet size, reference on page 0 only, `pageno` 0..2 and an offset run 5..7 with no reference, a rotated page's turned sheet, that `PageBackdrop.sourcePdf` resolves the absolute reference with no document folder, and that a text file is refused by name. Docs: `docs/pdf.md` (the import paragraph now says the tablet invokes `PdfImport` from `MainActivity` and the PC from its own import), `docs/desktop-workstation.md`. No APK built (`rebuild = false`); no emulator."
