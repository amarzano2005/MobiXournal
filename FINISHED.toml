[[task]]
id = "desktop-pen-lag-behind-the-nib"
title = "Desktop: the pen's ink must not lag behind the nib"
description = "Measured before changing, and then batched the packet path. `--probe-ink` (`desktop/InkProbe.kt`) paints with the editor's own `PageCanvas`, feeds the real `PenPacketStroke`, and writes `ink-probe.csv` with each sample's packet time against the `nanoTime` of the frame that first drew it; a blank A4 page measured median 12.9 ms / p95 17.9 ms / max 20.2 ms (719 samples) and `udiff.xopp`'s dense page median 17.7 ms / p95 29.4 ms / max 47.6 ms (718 samples). Those are synthetic 400 Hz packets on a host with no tablet and a 60 Hz-class display, so they measure the canvas, not a driver; the 144 Hz/6.9 ms target belongs to the owner's PC pass. `PenPacketStroke` now buffers the moves and `flush()`es them once per frame from `PageCanvas`'s `withFrameNanos` ticker — the tip-down stays immediate so the mouse path stands aside, and a lift or silence flushes the tail before committing — removing 400 snapshot writes/invalidations a second while the line stays sample-for-sample identical; `PenPacketStrokeTest` pins the batch rule (buffered moves, order, widths, one commit). Head-at-raw (step 3) was not taken: the numbers show the frame interval and the full-sheet repaint dominate, and the filter is not the cost — recorded with the reasoning in the new `docs/desktop-tablet.md` spoke (registered in `docs/architecture.md`), with the tablet/dial measurements moved out of `docs/desktop-workstation.md` to keep every spoke under budget; `README.md` now states the measured latency. `:desktop:test` and `DocsGuardTest` green, `:desktop:createDistributable` refreshed. The live Huion pass at 144 Hz is still the owner's to run."
