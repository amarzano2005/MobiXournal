[[task]]
id = "play-object-finger-pans-pen-picks"
title = "Let a finger pan and zoom the Play-object page while the pen picks the stroke"
description = """
In the Play-object tool (audioPlayMode) beginPointer calls audioTap for every pointer and returns, so with finger drawing off (fingerDraws = false, the palm-safe default for stylus users) a finger could not scroll the page at all: the tap landed on a stroke and replayed it instead of panning. The finger-draw gate every other tool honours (InputClassifier returns PAN for a FINGER when !fingerDraws) was bypassed by that short-circuit. Fix: add InputClassifier.playModePans(kind, settings) (a pure rule, JVM-testable) and in beginPointer start beginScroll for that pointer instead of audioTap, so one finger pans, two pinch, and only the stylus/eraser tip picks the stroke to replay; with finger drawing on nothing changes. Docs: docs/audio.md (*Replay*) and the audio bullet of README.md.

Landed (commit bc54ffa): `InputClassifier.playModePans` is the pure rule (a FINGER pans only when `fingerDraws` is false; a stylus, eraser tip or mouse still picks the stroke), and `beginPointer`'s play-object short-circuit now calls `beginScroll` for such a pointer, so one finger pans and a second one pinches through the normal scroll gesture. `InputClassifierTest` gained two tests (finger off pans, pen still picks; finger draw on keeps finger taps).
VERIFIED: 1529 unit tests / 0 failures (DocsGuardTest and SourceStructureTest included) and `assembleDebug` green. NOT VERIFIED on a device: the emulator flag was off for this task, so how the pan feels against a live play-object tap is the user's tablet pass."""
