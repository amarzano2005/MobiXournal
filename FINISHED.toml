[[task]]
id = "extract-the-mobix-streaming-api-into-mobix-core"
title = "Design and extract the .mobix streaming API into mobix-core (scope)"
description = "Delivered rather than broken into children: `format/mobix` (engine included, 30 files) now lives in `mobix-core/src/main/java/com/mobixournal/format/mobix`, and the boundary was drawn instead of publishing everything. Public contract (KDoc'd, documented in docs/mobix-streaming-api.md): MobixEntrySource + MobixPagedReader + PageSource (open, count, inflate page N, window, evict), MobixAssetSource/MobixAssetSink (content-addressed payloads, streamed), MobixPageCodec/MobixElementCodec (page and element <-> JSON), MobixContainer/MobixManifest/MobixCanvasFile/MobixPart/MobixDocument, MobixSavePlan, MobixIncrementalSave + stats, MobixPageReuse, MobixMergeEngine/MobixMergeSide/MobixMergeResult, MobixConflictDetector/SyncConflictInfo. Kept internal on purpose: MobixZip and its RawEntry/Index (the raw-copy channel is reached through saveOver, via an internal RawEntrySource), the per-family codecs (table/plot/shape/circuit) and MobixJson, the bridge digest internals, and the test instrumentation now in testFixtures (SyntheticNotebook, CountingEntrySource). The app's io/render/audio consumers were left on that surface unchanged apart from four suites that had been reaching internals (they now use MobixElementCodec or the counting fixture). Proof from outside the module: desktop/src/test/.../DesktopMobixOpenTest opens a 40-page notebook through the contract alone. Docs: new spoke docs/mobix-streaming-api.md (registered in architecture.md, linked from mobix-format.md and desktop-workstation.md); codebase.md moved the engine block into mobix-core. :app:testDebugUnitTest and :desktop:test green; desktop-open-mobix-and-zipped-xopp is unblocked."
