[[task]]
id = "size-an-infinite-canvas-to-its-pane-and-bound-the-strip"
title = "Birth a strip canvas at the pane's size, and bound its fixed axis"
description = "A board opened on a sheet whose size came from the paper (A4), so on a 2400 px screen the \"infinite\" sheet was a narrow band with grey down both sides and there was nowhere to say how wide it should be. Two things, both about the one axis a strip does not run on. (1) Birth: the blank document a strip is born on takes its locked side from the pane's own extent in pt (px at 100%, the sheet's scale) - width for INFINITE_VERTICAL, height for INFINITE_HORIZONTAL - and the same rule applies when a document is CONVERTED into a strip (applyCanvasModeToDocument -> boundToPane), which is the case the user hit: a page list turned into an infinite canvas kept its A4 width. The running axis keeps the default paper (it carries no size of the sheet and is read only by an export, as its cut length) and a 2D board covers the canvas by construction, so neither takes a screen side. (2) The bound: CanvasGeometry.fixedExtentPt / fixedExtentIsWidth / withFixedExtent (only the locked axis moves; a 2D board is returned unchanged rather than having one invented), the page-format dialog offers it as Fixed width / Fixed height in millimetres with its own enable gate (a never-saved document only) and applies it live, DrawingSurfaceView.setBoardFixedExtent writes it through the page window so a cell mid-stroke keeps its ink, and BoardViewport.contentExtent is the extent a strip's scroll is clamped to - a bound narrower than the pane pins the view at the paper's edge, one wider than the pane is pannable across. The extent is reported to the chrome on every canvas adoption (onCanvasExtentChanged carries null for a page list and a 2D board), which is what makes the dialog able to offer the field at all. Found on the way and fixed separately (commit de6efc3): a one-finger pan clamped both axes to the page stack's extent, which pinned a strip's running axis home and made a 2D board unpannable sideways. Docs: docs/infinite-canvas.md (*The bound on the non-infinite axis*), docs/chrome.md, README.md; ui/ToolbarPagesPopup.kt was split (the page-format dialog now lives in ui/PageFormatDialog.kt) to stay under the file and function budgets. VERIFIED ON THE EMULATOR (Pixel_Tablet AVD, com.mobixournal.v2, 2560x1600): a new tab born as INFINITE_VERTICAL opens with the grid running to every edge of the canvas at 100% - no grey band - and the sheet continues as it is scrolled (4 swipes took the tile badge from 1, 0 to 1, 8, with the ink drawn before the scroll still in place); the page-format dialog on a strip shows Fixed width 210 (mm, its A4 width) and typing 858 grew the sheet to the pane while the field was still being typed, with Set keeping it; a horizontal pan on that strip no longer resets the vertical position (badge 1, 8 before and after), and an INFINITE_2D tab pans diagonally (1, 0 -> 2, 1); logcat clean, no ANR. NOT OBSERVED: the conversion of a page list into a strip through the dialog (the whole session's tabs were boards, and the dialog's own chip-then-Set-then-'This document' flow was not scripted successfully), so that path rests on boundToPane being pinned by BlankBoardBindingTest rather than on a device; and the bound field's disabled state on a saved document, which no device fixture exercised."
