[[task]]
id = "desktop-living-slots-ask-and-circuit-families"
title = "Desktop: living slots ask their values first, and circuits are three palettes"
description = "Living slots now ask before they insert, as the tablet does. Lifting a Plot or Table drag writes nothing: DesktopShellState.placeOrAsk opens a PendingPlacement (box + the family's answers) and the right-hand lane becomes the question — the graph dialog's own fields for a plot (f(x), x from/to, critical points, derivative, summary, shaded integral with its bounds) and the table's grid and header — with Place committing one element through the shared placeLivingElement (one edit, one undo step, left selected) and Cancel/Esc leaving the page byte-identical with no undo step. A domain that does not open, or a blank formula, disables Place instead of accepting it. The question is bound to the tab it was asked on, so it cannot place one document's box on another's sheet. Circuit is now the tablet's THREE palettes, one slot each: CircuitFamily in mobix-core holds PASSIVE (K), ACTIVE (Shift+K) and LOGIC (Alt+K) with the tablet's exact members, picker rows and faces; each slot opens only its own family's rows (CircuitKindPicker draws CircuitInk of each part) and arms its own part, so a part is placed by the press that follows the pick. DesktopTool gained CIRCUIT_ACTIVE/CIRCUIT_LOGIC, toolForKey learned Alt so the logic shortcuts reach it, and the glyphs are each family's first part. The inspector's options caught up with the tablet's: the plot section gained critical points/derivative/summary and the shaded integral (recomputed through PlotElementFactory.applyPlotEdit, so the analysis cache is never stale), the circuit section gained Rotate 90°/Straighten and a four-way label side, and the table section gained per-cell text through TableElementFactory.updateCell. A new app-side CircuitPaletteDriftTest reads the tablet's SECONDARY_TOOL_GROUPS and fails the build if the window's three families, their order or their palette rows drift from it. Tests: DesktopLivingSlotsTest (plot asks and only Place writes, with the typed formula and range; a cancelled table quest