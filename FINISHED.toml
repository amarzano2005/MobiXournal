[[task]]
id = "desktop-hold-to-perfect-a-stroke"
title = "Desktop: hold the pen still and the stroke perfects itself"
description = "The window now perfects a stroke the way the slate does. The rule both shells share is mobile-free: ShapeDwell in mobix-core holds the 300 ms and the 3 pt slop, restAnchor/resting (the geometric stillness test, for a stream that repeats while the pen rests) and figureFor (the recogniser's answer, ungated, because who may snap is the caller's clock). The tablet's SHAPE_DWELL_MS/SHAPE_DWELL_SLOP_PT constants were folded into it, so one number defines the dwell for both. On the desktop the rest is the silence: a Wintab pen held still sends nothing, so PageInkGesture.dwellCheck stamps the newest sample with System.nanoTime and is called from the canvas's silent 200 ms timer, from PenPacketStroke.flush, and once more before a lift or a finish — a rest followed by a lift is recognised even if no timer ticked. The preview is the very draft list the sheet paints, so the figure the hand sees is the figure the lift writes: a closed polygon drawn with the pen on a plain line becomes a ParametricShapeElement (ParametricShapes.elementFor, four draggable corners for a rectangle), a line/arrow/arc commits as the cleaned stroke, and a highlighter or a dashed line keeps its ink. The figure is carried to the commit rather than re-derived from its clean points (four corners plus the closing repeat is a round set for the circle fit — the trap the tablet hit), and a sample arriving while a figure is previewed restores the hand's own samples, so carrying on drawing gives the ink back. Tests: ShapeDwellTest (7) pins the rule — a drawn square is a rectangle, a held square has rested, a line is a line and not a polygon, a letter-sized C is nothing, 4 pt re-arms, tremor inside the slop is stillness, the slop is a distance; DesktopDwellTest (3) drives PageInkGesture for the preview and the grew-after-snap restore, and pushes real Compose pointers through an ImageComposeScene for the rest-then-lift case (a real 380 ms hold, one element, one undo step). Docs: shape-perfection-engine.md (the shared rule and the two clocks, the window in Live), desktop-workstation.md (the dwell in the drawing bullet) and README's desktop paragraph. :mobix-core:test and :app:testDebugUnitTest green; :desktop:test green apart from the pre-existing Windows failure in DesktopPdfImportCommandsTest ('a plain xopp names the PDF beside it' expects a relative name and gets an absolute temp path), which this change does not touch. Distributable regenerated."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-24
completed = 2026-10-29
tags = ["desktop"]

[[task]]
id = "desktop-audio-replay"
title = "Desktop: audio recording, playback and karaoke replay (scope)"
description = "Broken into nine atomic tasks, no code written. desktop-audio-shared-seam moves the plain-Kotlin audio facts out of the app (Stroke.withAudio, documentAudioFiles, audioFileName and Playhead/ClipClock) into mobix-core, so the window stamps and seeks with the tablet's own rules. desktop-audio-opus-via-concentus records the codec decision: WAV through javax.sound.sampled, Opus through io.github.jaredmdobson:concentus 1.0.2 (pure Java, so the MSI carries no native library) plus our own Ogg framing in mobix-core, and an .m4a recorded by a tablet reported in one sentence rather than faked. desktop-audio-wav-recorder captures 44.1 kHz mono through TargetDataLine, with the audio.inputDevice/audio.outputDevice keys desktop-settings-audio names, a sentence when the microphone will not open and a vanished-device fallback that says so. desktop-audio-record-slot-and-status adds the RECORD slot (a new ToolGlyphs.RECORD mark, not ink) and the status bar's dot, elapsed time and level. desktop-audio-sidecars-and-bundling gives the format both halves: sidecars pushed beside a .xopp through the audioFiles parameter DocumentEncoder.write already takes, assets/aud_ bundled into a .mobix and adopted on open under the name the stroke carries, and one English report for a recording this machine does not have. desktop-audio-stamp-strokes stamps fn/ts at the single commit funnel from bytes written, never wall time, and pins the dtMs timeline a point-precise tap needs. desktop-audio-playback-and-transport plays a clip through the shared Playhead behind a glass transport with a scrubber, and records that the dial does not scrub (tablet.dial stays zoom|width, one meaning at a time). desktop-audio-tap-and-y-key gives the window the Play object tap on Y, picking through SelectionTester.pickTopmost and seeking point-precisely. desktop-karaoke-replay moves the pure karaoke directive into mobix-core and paints the page directly while a clip sounds, dimmed ahead of the playhead and as a visible prefix at it. Deliberately not done here: any code at all, the Settings Audio page (desktop-settings-audio stays blocked until the recorder lands) and a third meaning for the dial."
