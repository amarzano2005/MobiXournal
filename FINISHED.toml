[[task]]
id = "desktop-pdf-import-saves-the-bytes-with-the-document"
title = "Desktop: a save carries the PDF an import brought"
description = "Shipped the half that keeps the PDF in the file. `DesktopDocument.pdfSource()` (`DocumentLoader.kt`, beside `saveShapeFor`) answers the file behind the document's first `Background.Pdf` when the bytes are a file of their own — an absolute path that exists, or a path beside the document — and null when the archive already carries them (`bundledAsset`) or the reference is `attach`, so a repack never writes a second entry. `DesktopSaves.stage`/`save` gained `pdf: File? = document.pdfSource()` and pass it to `DocumentEncoder.write(pdf = …)`, which is the seam that was always there: a `.mobix` bundles the bytes, a zipped `.xopp` attaches them (`bg.pdf`), a plain gzip `.xopp` keeps the path, made relative to the target by the encoder when the two share a folder. `DesktopTab.saveBack` and `DesktopShellState.saveAs` needed no change beyond that default; the recovery snapshot still writes without it. Verified in `DesktopPdfImportCommandsTest`: import two pages, save as `.mobix`, the archive holds a `.pdf` entry and the reopened document paints its own page from its own bytes (`backdrop.sourcePdf` opens a 2-page PDF with no folder to help it); save as a zipped `.xopp` and the package holds `bg.pdf`; save as a plain `.xopp` beside the PDF and the reference is the file's bare name. Docs: `docs/desktop-workstation.md` (a save carries the PDF with the document), `docs/pdf.md`."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-28
completed = 2026-10-28
