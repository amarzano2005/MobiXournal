[[task]]
id = "desktop-tablet-dial-spike"
title = "Desktop: measure what the tablet's rotary dial sends"
description = "The dial produced **no pointer and no key**, and Win32 has no dial pointer type, so the recorded decision was WinRT: the dial is a wheel device, bound to the window by `IRadialControllerInterop::CreateForWindow`, rotation arriving as `RotationChanged` with `RotationDeltaInDegrees`. (The probe's first shapes logged pointers, scroll rows and keys, so its `WM_MOUSEWHEEL` notches went unrecorded; the raw-message logger added afterwards caught them as `wheel msg=0x20a delta=120 extra=-`, and `desktop-dial-wheel-zoom` is the task that routed them.) `desktop/TabletDial.kt` implements it by COM vtable slot, with the slots and the interop GUIDs quoted from the SDK headers in its constants. Measured on the machine, in order: no apartment (`0x800401F0`), then `S_OK` for the factory, the window binding, 1° rotation resolution, the menu item's creation, append and selection, and finally **both event registrations `S_OK`**. Three handler shapes were tried and rejected on the way, each recorded at the slot it fixed: a four-slot vtable (`Invalid memory access` on `GetIids`), a handler claiming `INoMarshal` (`CO_E_NOT_SUPPORTED` from both registrations) and one claiming `IdentityUnmarshal` (COM entered slot 6, which holds `Invoke`). The working shape is seven slots (`IInspectable` + `Invoke`), `IMarshal` answered by a free-threaded marshaler, and a `QueryInterface` whitelist whose two delegate IIDs were read out of the probe (`8FE73AC9…` rotation, `D09D9FCC…` button)."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-23
completed = 2026-10-23
tags = ["desktop"]

[[task]]
id = "desktop-tablet-input-backend"
title = "Desktop: put the tablet's own input behind one seam"
description = "`desktop/TabletInk.kt` reads the pen's own stream: it subclasses the window procedure (`SetWindowLongPtrW`/`CallWindowProcW`, every message passed on so AWT is unchanged), parses `POINTER_PEN_INFO` through `GetPointerPenInfo` (pressure 0–1024 → 0–1, tiltX/tiltY → tilt and azimuth in radians, rotation, `PEN_FLAG_ERASER`), counts only `POINTER_FLAG_INCONTACT` samples and keeps the newest contact fresh for 120 ms by `System.nanoTime` (never comparing AWT's clock with `GetTickCount`). `DesktopTablet.kt` is the seam. `PageCanvasInput.PageInkGesture` folds that contact into the Compose pointer it already receives, so **one contact is one sample**: pressure and tilt replace the mouse's `1.0`, an eraser-end pen reclassifies the pointer as `ERASER_TIP`, and an axis the device does not declare stays null (the tool's width, never zero). `TabletInkTest` pins the 120-byte structure layout, the unit conversions and the freshness rule."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-23
completed = 2026-10-23
tags = ["desktop"]

[[task]]
