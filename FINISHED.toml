[[task]]
id = "desktop-glass-chrome-parity-with-mobile-scope"
title = "Desktop glass chrome parity with mobile (scope)"
description = "The material is shared in colour but not in treatment. Both shells read mobix-core's DesignTokens for the desk, the glass fill and the hairline, and DesktopThemeTest forbids a local colour in the desktop chrome — but the *drawing* of the glass lives only in the app: ui/theme/FloatingGlass.kt owns the floating rim (a 1 dp stroke shaded by a vertical gradient, 0.12 alpha at the top and 0.04 at the bottom, plus a feathered inner ring at 1.5x the width and 0.35x the alpha), the 20 dp corner, the soft shadow, and the liquid-glass spring (0.82 scale, damping 0.74 / stiffness 550, 110 ms fade in, 230 ms held exit, 170 ms fade out). The desktop has the colours and the panel radius, and no rim and no spring: its popovers are a flat fill with a padding, its flyouts a flat hairline border, its picker panel a plain box — which is exactly the difference a person notices putting the tablet and the PC side by side. Break down: (1) move the rim's numbers into DesignTokens so both shells draw the same edge; (2) a desktop Modifier that draws that rim and feather, applied to every floating surface the window puts over the page, verified headlessly by pixels; (3) the same spring language for the desktop's floating surfaces, with the numbers shared; (4) one headless side-by-side render (mobile material and desktop material, same panel) so parity is looked at, not asserted from memory. Constraint: mobix-core takes no Compose dependency, so anything that draws stays per shell and only the numbers and the specification are shared until a Compose module exists (docs/desktop-workstation.md, the target layout)."
