[[task]]
id = "decide-how-a-living-entity-is-drawn"
title = "Decide how a living entity is drawn before it can be edited"
description = "What a living entity looks like on screen. The four families are modelled, codec-ed, preserved through a .xopp round trip and compiled to ink by the export compilers (render/SynthesisTable.kt, SynthesisPlot.kt, SynthesisShape.kt, SynthesisCircuit.kt), but nothing draws them: ElementRenderer handles text, images and texImage only, and PdfVectorPainter deliberately draws nothing for a TableElement, PlotElement, ParametricShapeElement or CircuitElement (its comment says the drawing arrives with the element editor). So a .mobix holding a table opens, saves back and exports as a blank page, which docs/architecture.md already lists as still to come (the drawing and editing of the living entities themselves). Investigate and then add the task-level children: whether an entity is drawn at all before it has an editor, and if so that the one drawing definition is the synthesis compilers, shared by the canvas, the PDF painter and the SVG/PNG page writers so screen and export can never disagree; which of the four families gets an editor first and what each editor edits; and how a drawn entity is selected, moved and resized, given ElementBounds already answers for all four. Produce tasks, not code."
