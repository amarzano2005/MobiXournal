description = "finish-the-pen-telemetry-payoff. The app captures stylus tilt (MotionEvent.AXIS_TILT) and azimuth (AXIS_ORIENTATION) in render/DrawingSurfaceStrokes.kt addSamples (around line 354) and stores both on StrokePoint, but nothing can tell whether a given pen reports them at all: the on-canvas Pen diagnostics panel prints pressure only, so the one hardware question this feature raises is unanswerable. Extend the motion line. render/PenInputLog.kt PenEventText.motionLine and motionKey gain two optional readings, printed as t= and a= in degrees (converted at this boundary, ROOT locale, two decimals - the stored values stay in the radians the platform reports) and both go into the dedupe key for the same reason pressure is already there. render/DrawingSurfacePenDebug.kt tracePenMotion reads event.getAxisValue(MotionEvent.AXIS_TILT, index) and event.getAxisValue(MotionEvent.AXIS_ORIENTATION, index) and takes support from event.device?.getMotionRange(axis), so a tablet that declares no tilt axis prints t=- rather than t=0.00 (the range lookup is also the guard: getAxisValue throws for an axis the device does not declare). Verify with PenInputLogTest over the formatting, the no-axis case and the dedupe key, and on the tablet with a pen: open Pen diagnostics, tilt the pen, watch t= move. The Pen diagnostics paragraph in docs/stylus.md lands in the same commit."
