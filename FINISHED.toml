[[task]]
id = "match-the-desktop-s-vertical-space-tool"
title = "Match the desktop's vertical-space tool"
description = "Checked against Xournal's own manual, which states the desktop rule for this tool: all the items which lie entirely between the cursor position and the end of the page are moved, the amount snaps to the grid, and dragging past the page edge re-homes the block. Two parts were already implemented here and are now pinned rather than assumed: an element moves only when its ink box top is at or below the grabbed line (VerticalSpaceOpsTest.straddlingElementStaysPutRatherThanBeingTorn) and pulling up is clamped so nothing crosses the line it was grabbed at. What was missing was SNAPPING: a new dragShift snaps the amount inserted to the page's ruling when Snap to grid is on (Snapping.spacingY -> Snapping.snap, a whole number of ruled lines), matching desktop 1.1.2's 'Added snapping for vertical space'; a plain sheet (spacing 0) leaves the drag continuous, so nothing changes for users who never turned snapping on. The layer scope is a DELIBERATE difference from the desktop, documented as such: every layer of the page moves together, whereas desktop reflows only the current layer - a note written on one layer must not be left behind by space opened on another. The cross-page re-homing the manual also describes was offered and explicitly NOT chosen, so it stays unimplemented. Tests: VerticalSpaceOpsTest (snap of the amount, snapped shift, the whole-below rule surviving snapping). README.md + docs/architecture.md updated in the same change."
