[[task]]
id = "desktop-pdf-pages-render-reorder-delete"
title = "Desktop: every PDF page renders, and PDF pages reorder and delete"
description = "Every page of a PDF-backed document now renders, and the page list can reorder and delete sheets without losing the PDF. Root cause: a document carries its reference on one page and every other pdf page a pageno alone, and PageBackdrop read each background on its own, so pages 2..N drew bare paper and the exporter's preserved-vector arm found no source either. New pure PdfPageReferences (carriesSource/of/resolve/keep) answers which page carries the reference, what a bare page resolves to, and what a delete must hand over; PageBackdrop gained a pdfReference supplier that DesktopDocument installs in init, so the canvas, the page list's thumbnails and both exporters resolve through one rule; DesktopDocument.pdfBackground/pdfSource look for the carrier anywhere in the list rather than on page one; renderPageBitmap/thumbnail finally pass the backdrop, so a page row shows its PDF page; and the backdrop cache evicts its oldest sheet instead of clearing twelve at a time. Page list: DesktopPages.movePage (PageOps.move, one undo step, view follows), removePageAt with PdfPageReferences.keep, Move page up/down rows in the Pages menu (PageMenuMetrics rows 6 -> 8), a per-row close glyph in the sidebar (muted and inert on a one-page document), and DesktopShellState.movePage/removePageAt for the workspace. DesktopPdfPageListTest covers seven cases - every imported page draws, the export keeps every source page's extractable text, a reference carried off the first page, deleting the carrier keeps the reference and the numbering, an ordinary delete leaves it alone, reorder keeps it, and a thumbnail carries the PDF page (pixel-checked) - and all seven were proven red with the supplier removed. DesktopPagesTest updated for the eight rows. Docs: docs/pdf.md (the inheritance and what a delete/reorder does), docs/desktop-workstation.md (the new bullet, plus two stale claims fixed: Import PDF and page insertion/reorder no longer listed as absent), README. Full :desktop:test 607 tests with 3 failures that reproduce on a clean HEAD on this Windows host (DesktopMenuTest x2 and 'a plain xopp names the PDF beside it'); the new and touched suites are green."
status = "finished"
level = "task"
category = "bug"
created = 2026-10-28
