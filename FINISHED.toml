id = "draw-the-selection-on-the-ink-and-resize-out-of-proportion"
title = "Draw the selection on the ink and resize out of proportion"
description = "Two selection fixes. (1) The dashed marquee is now drawn exactly on the selected elements' ink box: SELECT_PAD_PX went from 6 to 0, so the outline no longer overhangs the element it claims to hold (ease of grabbing comes from HANDLE_HIT_PX / MOVE_GRAB_PAD, not from an inflated rectangle). (2) Resize is no longer uniform-only: the outline carries eight handles - the four corners resize proportionally as before (SelectionOps.scale, both factors the pointer's distance ratio), and the four edge midpoints stretch a single axis (new ResizeAxis in SelectionResize.kt (pure, no Android types), with the pure axisScaleFactor measuring travel from the opposite edge's midpoint, applied by the new SelectionOps.scaleXY). A per-axis stretch scales stroke widths and text sizes by the geometric mean sqrt(sx*sy) - of two axes neither is right for a scalar, and the mean keeps the ink in proportion to the box. Grabbing the right-edge handle does not fight the rotate knob: the knob is 40 px out and is hit-tested first from that arm. Tests: SelectionTest (scaleXY geometry, anchor pinning, sqrt width, per-axis boxes, identity) and the new SelectionResizeTest (ratio, anchor as fixed point, no-travel, drag starting on the anchor, clamp both ways). One expectation of mine was wrong on the first run (a y value I had written as scaled when the point of the test is that it is not); fixed the expectation, not the assertion. README.md + docs/architecture.md updated in the same change. NOT verified on a device: the feel of the edge handles rests on the tested arithmetic plus a green build."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-09
