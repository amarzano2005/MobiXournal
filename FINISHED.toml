[[task]]
id = "desktop-dirty-state-close-confirmation-and-crash-safety"
title = "Desktop: dirty state, close confirmation and crash safety"
description = "Desktop: dirty state, close confirmation and crash safety, as shipped. (1) A tab is dirty when its per-tab EditHistory leaves the save point: EditHistory now names every state (stateId, with id stacks in step with the undo/redo snapshots) and DesktopTab records the id the file matches on open, on a successful save-back and on a Save As - so an undo back to it makes the tab clean again, while a new edit gets a fresh id even when the bytes match. (2) The strip draws it as one 6 dp accent dot after the label, absent when clean; it is a status readout, so the five interactive states stay on the close glyph beside it (docs/interface-contract.md section 6). Ctrl+S is unavailable while the file already holds the document; Save As deliberately stays available, because a clean document can still be written elsewhere. (3) Closing a dirty tab (its x, Ctrl+W) or the window (its X) is a question - Save / Discard / Cancel in the floating glass over the page, naming the document - and the X goes through requestExit, so it cannot bypass it; several dirty tabs are asked about one at a time and the window closes only when none is left. A failed save clears the question but keeps the tab open and dirty with the reason on screen; Esc is Cancel. (4) While a tab is dirty the shell debounces (3 s of quiet edits, a LaunchedEffect on editRevision cancelled by the next edit) a self-contained .mobix snapshot into %APPDATA%/MobiXournal/recovery, keyed by a digest of the tab's normalised path with a two-line .origin sidecar (label, path); a start adopts it as a '... (recovered)' tab that is dirty, keeps the origin as its file and its container (a recovered .xopp writes a .xopp) and the snapshot as its repack source (DesktopDocument.pageSource, so a save rebuilds from the recovered pages instead of copying the file's older ones over them). Saving, discarding or closing deletes the snapshot. Docs: docs/desktop-workstation.md (Unsaved edits), docs/data-path.md (tabs and the restart cache), docs/ui-modernization.md (shortcut table and the question), docs/interface-contract.md (the readout rule). Tests: DesktopLifecycleTest (save point through edit/save/undo/redo, a dirty close reporting the question instead of closing, Save from the dialog, the X asking per dirty tab, a snapshot adopted by the next shell and deleted by its save, the accent dot in strip pixels, the settled dialog rendered over the page) and EditHistoryTest (state identity); DesktopStatus.kt, DesktopClosing.kt, CloseDialog.kt and PanelButton.kt were split out to keep DesktopShell.kt under the 700-line ratchet and its composable under 100 lines. README's user-facing paragraph is written but sits uncommitted with that file's other in-flight edits."
