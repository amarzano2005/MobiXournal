[[task]]
id = "supply-a-deferred-payload-on-a-save-that-has-no-source"
title = "Supply a deferred payload on a .mobix save that has no source"
description = "Found while landing carry-the-audio-recording-inside-the-document, and it is not about audio: a .mobix opened page by page adopts a page's bundled picture, PDF or recording when that page is read (io/BundledPageAssets.kt), so a page nothing has drawn yet has no local copy. MobixDocument.of() builds the document to write from the model with NO payloads, and io/DocumentIo.encode supplies bytes only from the app's stores (backgroundBytesOf, the audio lookup) - so a save with no source to repack over (Save As to another name, or a first save of a document whose staged copy is gone) writes a page that names assets/... while the entry is not in the archive: the picture or the recording is silently gone from the new file. A save that lands back on the URI it was opened from is safe, because MobixIncrementalSave copies an unchanged entry verbatim. Fix it from the archive the document still has: DocumentIo keeps each open .mobix's staged copy by document id (MobixSource, and the reader in pagedOpens), so on a source-less MOBIX write it can read the assets/ entries the document still references - Background.bundledAsset and Stroke.bundledAudio are the references, both in the model - and carry their bytes into the encode/MobixDocument.of payloads instead of dropping them. Verify with a JVM test: open a .mobix with a bundled picture and a bundled recording on pages nobody reads, save it to a SECOND file (no source match), and reopen it - both payloads are still there and their pages still name them; and a page neither side can supply is reported rather than silently blank (see report-a-mobix-page-whose-background-is-missing)."
