id = "desktop-inspector-lane"
title = "Desktop: the inspector as a right-hand lane, not a dialog"
description = "The inspector is a right-hand lane, not a dialog: a 300 dp column reserved beside the canvas (InspectorPanel.kt, controls in InspectorControls.kt) so no band or glass ever lies over the sheet. It shows ONLY while an element is being edited - the pencil on the selection bar, a double-click, or a placement's answer - and closes with its selection, with Esc, its close glyph or Done, so it never sits there as a panel nobody asked for. A header names the element (its family glyph and livingSummary: the formula and range, the grid, the sides, the part and value, the flavour and source) rather than only its family, the cards are grouped by concern, and one footer carries the actions; a focused field's Esc cancels the field rather than the whole element. Tests: DesktopInspectorLaneTest (the lane is closed until there is something to edit, opens while an element is edited and closes with it, the header names the element, the graph preview draws the equation before it is placed, a plot carries every equation the card was given, a placement hands the window to the selection tool, the lane closes when the selection leaves the element, the editor adds and removes equations, the editor previews the graph it is editing). Docs: docs/desktop-workstation.md, docs/selection.md, README."
