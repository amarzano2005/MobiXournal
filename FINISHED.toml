[[task]]
id = "make-the-palette-yours-favourites-empty-custom-slot-and-new-colours"
title = "Make the palette yours: favourites, empty custom slot and new colours"
description = "A batch of colour changes. (1) Factory favourites are the stated ones: pen black-red-green (DEFAULT_PEN_FAVORITES) and highlighter yellow-green-blue (DEFAULT_HIGHLIGHTER_FAVORITES), pinned by SettingsSanitizeTest. (2) The custom slot (the pencil swatch) starts EMPTY: AppSettings.customColor is now nullable and defaults to null, so a fresh install no longer claims a violet nobody picked; an empty slot is stored as an absent pref key (SettingsStore removes it, so empty and black stay distinguishable) and as an explicit null in the JSON backup (AppSettingsBackup writes null, and an explicit null on import clears the slot instead of falling back to the local colour). The slot is drawn as an unfilled ring with the pencil, and a tap on an empty slot opens the editor rather than picking nothing; CustomColorEditor opens on DEFAULT_CUSTOM_COLOR, the placeholder the picker starts from. (3) The picker can reuse a colour that already exists: CustomColorPickerDialog gained an optional palette and an Existing colours row (scrolling, so the dialog does not grow with the palette), which loads a swatch into the HSV/hex editor without committing it. (4) New colours can be made from the canvas: the Colour & size pop-up's swatch row ends in an add-colour swatch (onAdd in ColorPaletteRows, addPenColor in EditorRegions appending opaque, de-duplicated, capped at MAX_PEN_COLORS - the same write Settings > Colors makes, then selecting the new colour), and the compact row now scrolls horizontally instead of wrapping so adding colours cannot change the pop-up's height. Tests: SettingsSanitizeTest (empty slot, set slot survives, factory favourites order), AppSettingsBackupTest (null round-trips, explicit null clears, absent key leaves the local value), ColorSizeRailSlotTest updated to the new ternas. README.md + docs/architecture.md updated in the same change. NOT verified on a device (no emulator/tablet attached here)."
