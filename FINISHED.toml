[[task]]
id = "carry-the-audio-recording-inside-the-document"
title = "Carry the audio recording inside the .mobix container"
description = "A stroke already records its audio in a .mobix - format/mobix/MobixElementCodec.kt writes audioRef.assetId from the .xopp fn and audioRef.startMs from ts - but the sound itself never enters the archive: MobixDocument.of is handed only backgroundBytes (PDF and pixmap) and io/DocumentIo.kt supplies nothing else, so audio/AudioStore.kt .wav stays a sidecar beside the document. The file is therefore not self-contained, which is the one promise a native container makes: move the .mobix to another folder, or hand it to another device, and the recording is gone while the strokes still point at it. The desktop plugin already expects better (plugins/mobix-importer/README.md speaks of bundled audio entries mapped to companion .wav sidecars). Add an audio kind to MobixFormat.AssetKind and feed the recording through the same MobixAssetSink the pictures use, named by the hash of its bytes, so the archive holds one entry per distinct recording however many strokes reference it; on open, adopt bundled audio into the local audio store the way adoptBundledBackgrounds already adopts bundled backgrounds, and keep the sidecar path working for .xopp and for a document whose audio is external. Verify: record audio into a .mobix, move that file to an empty folder with no .wav beside it, and playback still works with fn and ts intact; a .xopp exported from it still names its sidecar reference; the container holds exactly one entry for one recording. Reconcile the plugin expected entry name with the name the app actually writes (it says .opus, the app records WAV) in the same commit, or record the mismatch as a known gap. Landed: a `fn`-linked recording the app's own audio store holds is now **bundled** into the `.mobix` by content hash — `MobixElementCodec.encodeStroke` registers it through `MobixAssetSink` under `AssetKind.AUDIO`, and `MobixAssetSink.suffixFor` names the container the bytes are actually in (`RIFF`/`WAVE` -> `wav`; the app's recorder writes WAV, so that is the real extension and no `.opus` guess is made). The stroke's `audioRef` now keeps the two names apart: `filename` is the sidecar it replayed from — which the `.xopp` export still names, pushing the copy out beside the file — and `assetId` is the entry the bytes live in, carried in the model as `Stroke.bundledAudio` (mirroring `Background.bundledAsset`) so a rewrite from the model cannot orphan the entry. `io/BundledPageAssets.kt` (renamed from BundledBackgrounds) adopts a page's recording when that page is read, through the new `BundledAudio` seam implemented by `AudioSession`: the bytes land in the audio store under the sidecar name the stroke carries, so playback needs nothing beside the file. `DocumentIo.encode` takes a recording lookup and `DocumentIo` a `BundledAudio` adopter; `MainActivity` supplies both, and a `.mobix` save no longer asks for an audio folder or pushes sidecars out (the file is self-contained). Plugin reconciled: `plugins/mobix-importer/main.lua` prefers `filename`, drops the `.opus` -> `.wav` guess, and its README documents the bundle. VERIFIED: 1450 unit tests / 0 failures (`MobixAudioBundleTest`: two strokes over one recording are one entry, the entry name is the hash of the bytes, the sidecar and the entry survive a save-and-open, and a repack over the file the document came from keeps the recording's bytes exactly), assembleDebug green. CAVEAT: the on-device round trip the task asks for (record audio into a `.mobix`, move the file to an empty folder, replay) is UNRUN — no /data/android toolchain, no adb, no AVD here; the check is added to verify-the-paged-mobix-open-and-canvas-on-the-emulator. KNOWN GAP recorded rather than fixed: a save with no source archive (Save As) can still drop a payload no store ever adopted, for recordings exactly as for pictures (supply-a-deferred-payload-on-a-save-that-has-no-source), and an Opus/ogg recording bundled by another writer is carried as it is but not transcoded (record-and-bundle-opus-audio is the task for that)."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-14
completed = 2026-10-15
tags = ["mobix", "audio"]

[[task]]
id = "merge-a-mobix-from-the-manifest-parts"
title = "Merge a .mobix from the manifest parts"
description = "format/mobix/MobixMergeEngine.kt resolves pages by walking local.pages and remote.pages. It already has each page sha256 and modified in the manifest, so a page only one side changed can be adopted by part without decoding it. Materialise only the pages that must be compared or element-merged, and carry the rest through by part. Verify with JVM tests: a merge of two 200-page documents that differ on one page decodes only that page (TrackedEntrySource), and the merged document equals the current implementation result. Landed (commit 3420ecb): format/mobix/MobixMergeEngine.kt plans every page from the manifest's sha256/modified - a page only one side changed is adopted by part, byte for byte, without decoding it - and materialises only the pages both sides changed (element merge) or that must be compared. Verified by format/mobix/MobixMergeManifestPartsTest.kt: a merge of two 200-page documents differing on one page decodes only that page and the merged document equals the previous implementation's result. VERIFIED: 1443 unit tests / 0 failures, assembleDebug green (emulator_debug was off for this task)."
