description = "Add an option (Settings > Storage > Vector PDF pages, on by default) that draws a pdf background's page as vector geometry on the canvas through PDFBox's Android renderer (PDFRenderer.renderPageToGraphics) instead of blitting the raster cache's bitmaps and tiles, so the page stays sharp at any zoom. PdfVectorSource parses the PDF off the drawing thread (mixed memory so a large file spills to scratch), serialises every draw, and gives up for good on a draw that throws; PdfVectorGuard times each page's draw and sends that page back to raster after consecutive over-budget draws; PdfPageClip bounds the draw to the page box intersected with the viewport. BackgroundRenderer takes an optional PdfVectorBackground and falls back to raster when it declines."
