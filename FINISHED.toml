[[task]]
id = "desktop-colour-and-width-palette"
title = "Desktop: colour and stroke-width palette (scope)"
description = "Investigated and broken into four children (orders 931-934); no code. What the code says: on the tablet the palette is data, not a widget. AppSettings.penColors is List<Int> (ARGB), seeded from PEN_COLORS in ui/ToolbarColorPopup.kt (the eight desktop Xournal++ hexes in the published order), capped by MAX_PEN_COLORS = 24 and normalised by sanitized() to opaque, de-duplicated and never empty (it falls back to the factory list); the editable custom slot is customColor: Int? where null means empty and is stored as an absent key, so empty and black stay distinguishable; the widths are penWidths = DEFAULT_PEN_WIDTHS (0.85f, 1.5f, 2.6f) clamped by PEN_WIDTH_MIN/MAX with the S/M/L labels in ui/ToolbarSizePopup.kt; and the shortcuts are tables - toolShortcutKeys and colorShortcutKeys (colour ARGB to key) - resolved by EditorRegions.onKeyPressed in the order toggles, then colour, then tool. The picker UI (ui/ColorPalette.kt's ColorPaletteState and ColorPaletteRows, ui/ColorPicker.kt's CustomColorPickerDialog) is Compose but lives in the app module and reads AppSettings directly, so desktop cannot reuse it as it stands: what moves to mobix-core is the rules and the factory values (PenPalette), and the picker is rebuilt in the desktop's own glass. Where the desktop surfaces them, per docs/ui-modernization.md section 2's Option B drawing and section 3's table: a colour capsule at the end of the rail (and at the right end of the ribbon) with a palette flyout - swatches in one scrolling row, then the editable custom slot, then the add-colour swatch - and a size slot with an S/M/L flyout, keys 1/2/3 for the three favourites, Alt+1..3 to remap them, and ]/[ to step the width. The right-hand inspector (desktop-inspector-and-export) and the Settings window (desktop-settings-and-status-ui) will read that same DesktopInk/palette state later; they must not own a second copy. None of it waits for the KMP split: this is chrome plus a plain model, so the four children can land before desktop-kmp-module-split. The children: move-the-ink-palette-and-width-rules-into-mobix-core (931, the shared PenPalette with the app delegating to it), desktop-colour-and-size-slots-with-their-flyouts (932, DesktopInk, the two slots in both placements, the flyouts and their persistence), desktop-colour-and-stroke-width-shortcuts (933, 1/2/3, Alt+1..3, ]/[ and their tables) and desktop-custom-colour-picker (934, the HSV/hex glass panel and its #RRGGBB round-trip)."
