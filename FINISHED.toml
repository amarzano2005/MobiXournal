# FINISHED — completed-work archive for MobiXournal.
#
# Append-only, newest first (see AGENTS.md -> documentation map). Tasks land
# here when `scripts/todo.sh done <id>` moves them out of TODO.toml.
#
# `release` separates shipped work from work pending the next version:
#   absent        -> pending; belongs to the next release's changelog
#   "X.Y.Z"       -> shipped in that version
# `scripts/todo.sh release --version X.Y.Z` stamps the pending set and drafts
# docs/releases/vX.Y.Z.md; `list --finished --unreleased` shows the pending set.

schema_version = 1

[meta]
title = "Finished"
kind = "finished"
purpose = "The archive of completed work for this project."
documentation_map = "AGENTS.md"
order = "newest first"
latest_release = "1.2.0"

[meta.rules]
finish_work = "Tasks arrive here via `todo.py done <id>`; newest first, append-only."
growth = "This file only grows; nothing is removed from it."
release = "A task's `release` stamp is the version it shipped in; a task without one is pending the next version. `todo.sh release --version X.Y.Z` stamps the pending set and drafts docs/releases/vX.Y.Z.md, which is what keeps the per-version changelog correct."

[[task]]
id = "quick-colour-dots-light-up-as-the-dot-not-the-cell"
title = "Quick-colour dots light up as the dot, not the cell"
description = "A tap's ripple and a hovering stylus' state layer on the rail slot's three favourite colours were clipped by the bare tap cell, which is wider than it is tall (three cells share one rail slot's height), so selecting a colour lit a grey box around a round dot. The cell is now clipped to DotCellShape (ColorSizeRailSlot.kt, internal): a TRUE circle centred in the rectangle, unlike CircleShape which inscribes an oval in a non-square node, applied before the clickable so the indication is drawn inside it while the cell keeps its rectangle as the touch target (a clip does not shrink hit-testing). Verified on the Pixel_Tablet AVD with a before/after against the same probe points: with the clip removed the cell's left and right flanks go #1E1F25 -> #313238 (the box), with it they stay #1E1F25 while the point inside the circle is tinted (the dot's halo). New DotCellShapeTest pins the shape (wide cell -> circle as wide as the cell is tall and centred, tall cell capped by width, square cell untouched, and not what CircleShape draws). README.md and docs/architecture.md updated in the same change. 1002 unit tests 0 failures + assembleDebug green."
