# FINISHED — completed-work archive for MobiXournal.
#
# Append-only, newest first (see AGENTS.md -> documentation map). Tasks land
# here when `scripts/todo.sh done <id>` moves them out of TODO.toml.
#
# `release` separates shipped work from work pending the next version:
#   absent        -> pending; belongs to the next release's changelog
#   "X.Y.Z"       -> shipped in that version
# `scripts/todo.sh release --version X.Y.Z` stamps the pending set and drafts
# docs/releases/vX.Y.Z.md; `list --finished --unreleased` shows the pending set.

schema_version = 1

[meta]
title = "Finished"
kind = "finished"
purpose = "The archive of completed work for this project."
documentation_map = "AGENTS.md"
order = "newest first"
latest_release = "1.3.0"

[meta.rules]
finish_work = "Tasks arrive here via `todo.py done <id>`; newest first, append-only."
growth = "This file only grows; nothing is removed from it."
release = "A task's `release` stamp is the version it shipped in; a task without one is pending the next version. `todo.sh release --version X.Y.Z` stamps the pending set and drafts docs/releases/vX.Y.Z.md, which is what keeps the per-version changelog correct."

[[task]]
id = "merge-a-mobix-from-the-manifest-parts"
title = "Merge a .mobix from the manifest parts"
description = "format/mobix/MobixMergeEngine.kt resolves pages by walking local.pages and remote.pages. It already has each page sha256 and modified in the manifest, so a page only one side changed can be adopted by part without decoding it. Materialise only the pages that must be compared or element-merged, and carry the rest through by part. Verify with JVM tests: a merge of two 200-page documents that differ on one page decodes only that page (TrackedEntrySource), and the merged document equals the current implementation result. Landed (commit 3420ecb): format/mobix/MobixMergeEngine.kt plans every page from the manifest's sha256/modified - a page only one side changed is adopted by part, byte for byte, without decoding it - and materialises only the pages both sides changed (element merge) or that must be compared. Verified by format/mobix/MobixMergeManifestPartsTest.kt: a merge of two 200-page documents differing on one page decodes only that page and the merged document equals the previous implementation's result. VERIFIED: 1443 unit tests / 0 failures, assembleDebug green (emulator_debug was off for this task)."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-14
completed = 2026-10-15
tags = ["mobix", "perf"]

[[task]]
id = "export-and-search-a-mobix-through-the-page-source"
title = "Export and search a .mobix through the page source"
description = "render/XoppSynthesis.kt (the .xopp export) and render/DocumentSearch.kt (find) walk every page of a document. Route both through the PageSource: the export materialises one page at a time and releases it, and search iterates the same way, so neither holds all 200 pages. Verify with JVM tests: an export of a 200-page document produces the same .xopp as before and a search finds a text hit on page 150; both keep the working set bounded (TrackedEntrySource counts only the pages touched). Landed (commit 24dfdea): render/XoppSynthesis.kt and render/DocumentSearch.kt walk the document through PageSource.of(document.pages) a page at a time, releasing each page before the next, and audio/WavAudioSynthesizer.kt (which walks the same pages for the karaoke strip) goes through the source too. Verified by render/PageSourceWalkTest.kt: a 200-page .mobix exports to the same .xopp as before and a text hit on page 150 is found, with a TrackedEntrySource proving only the pages touched were inflated; docs/data-path.md updated in the same commit. VERIFIED: 1443 unit tests / 0 failures, assembleDebug green (emulator_debug was off for this task)."
