[[task]]
id = "desktop-pdf-import"
title = "Desktop: importing a PDF as annotatable pages (scope)"
description = "Scope closed as four atomic tasks, no code. It established what the window has and lacks for importing a PDF, and what each missing piece really costs. Findings: (1) page building is pure Kotlin — `render/PdfImport.pagesFor` asks a `PdfPageCache` for a page count and page sizes and nothing else Android-shaped, so the desktop twin is a reader over its own `org.apache.pdfbox`; (2) the desktop already paints a PDF background through `PageBackdrop` (bundled entry, ZIP package extraction, absolute path, path beside the document), so an imported PDF shows with no renderer work; (3) `DocumentEncoder.write(pdf = ...)` already bundles a PDF into a `.mobix` (`background/background.pdf`) and attaches it into a zipped `.xopp` (`bg.pdf`, `domain=\"attach\"`), and the window simply never passes it — a desktop save carries a PDF only from the archive it repacks over; (4) joining a second PDF is the tablet's `PdfMerger` on pdfbox-android, which cannot run on the JVM, so the desktop needs a twin over `org.apache.pdfbox`; (5) page structure and undo are ready (`DesktopPages` drives `PageOps`, `DesktopTab.history` records `DesktopDocument.Snapshot`), so appended pages are one undo step without waiting for `desktop-page-management-and-search`. Decisions recorded for the children to implement and document: REPLACE opens the imported PDF as a **new tab** rather than discarding the open document; APPEND adds to the active tab as one undo step and drops a lone untouched blank sheet; the command is a hamburger-menu chip beside *Export PDF* with no shortcut key (the *Export pages as SVG* precedent); the single-PDF rule of `docs/pdf.md` holds, so a second PDF is joined into the first. Ownership: this scope, not `desktop-images-and-import`, owns the PDF half of content import. Children added: desktop-pdf-import-page-builder (the JVM page builder plus its tests), desktop-pdf-import-command-and-modes (the menu chip, the REPLACE/APPEND card, the state commands), desktop-pdf-import-merges-a-second-pdf (the JVM merger and the pageNoOffset arithmetic), desktop-pdf-import-saves-the-bytes-with-the-document (passing `pdf` through the save so a `.mobix` or a package carries it). No source file was changed by this task."
