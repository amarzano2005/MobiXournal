title = "Desktop colour and size slots with their flyouts"
description = "Done. desktop/ now has the two ink slots and their glass flyouts. DesktopInk.kt is a plain-Kotlin value (colour ARGB, width pt, nullable custom) with opaque/clamped transitions, and PaletteCodec is the settings spelling (comma-separated eight-digit hex, decoded through PenPalette.sanitised). ToolStrips.kt gained a hairline divider and the two slots at the tail of BOTH placements - the rail under the fifteen tools, the ribbon after them - drawn from one ToolStripState (selection, ink, palette) so the two strips cannot show different inks. ColourFlyouts.kt draws the colour capsule (with a ring so a black ink is visible on the dark strip) and the size dot, each opening a Popup in the floating material: the palette as one horizontally scrolling row with the picked swatch in the active slot, and the S/M/L flyout with a dot per width. DesktopSettings persists palette.colours, ink.colour and ink.width; DesktopShellState holds ink and palette as snapshot state and pickColour/pickWidth write the file. The editable custom slot, the add-colour swatch and the HSV/hex panel stay with desktop-custom-colour-picker, which now owns wiring them into this flyout - nothing dead ships here. Verified: ColourFlyoutTest (8 tests) - fresh defaults, repair of a hand-edited file (transparent promoted, duplicates collapsed, junk dropped, width clamped), colour and width surviving a reload, the shell writing through, the codec round-tripping every ARGB including negative ints, and a render proving the capsule is the ink colour and the L dot has more ink pixels than the S dot. ToolStripsTest and DesktopThemeTest updated for the new signatures and the new chrome files. :desktop:test 85 tests, 0 failures; :app:testDebugUnitTest 1530 and :mobix-core:test 244 unchanged and green; guards green. Renders: desktop/build/desktop-render/{ink-slots-s,ink-slots-l,tools-rail,tools-ribbon,tools-shell-*}.png. Gaps: the flyouts are Popups opened by a click, so their contents are not covered headlessly (same limitation as the placement chooser), and no human has looked at the window on the monitor."
