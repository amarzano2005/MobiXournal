[[task]]
id = "settings-side-menu-and-search"
title = "Settings: side menu and search"
description = "The settings screen is now shaped like a tablet's system settings, with two shapes over one set of areas. At 600dp wide or more (SETTINGS_TWO_PANE_MIN_WIDTH) the four SettingsAreas are a permanent side menu (SettingsSidebar.kt: the search field, then one row per area carrying a tonal pill and an icon - TouchApp/Brush/Tune/Info, declared beside the list that draws it) with the selected area's sections in the pane beside it; an opened section takes that pane and the bar's back arrow returns to the list. Narrower than that the menu is dropped for the pushed index -> area -> section, since a permanent list on a phone would leave the controls a strip to live in. Back pops one step of whichever shape is on screen (section -> results -> area -> out of settings), so the system back button keeps mirroring the title-bar arrow. Search (SettingsSearch.kt, pure) matches a section's title, summary or its new keyword aliases - the words people actually type instead of the app's labels (momentum, wallpaper, cache, left-handed, expresskey, trapezoid) - filters live from either shape, labels each result with the area it lives in via areaOf, and opens it directly. SettingsSearchTest pins the everyday queries, requires every section to carry aliases and to answer to its own title, and requires every section to belong to an area; SettingsAreaTest still pins that the areas cover every section exactly once and no area owns a single child. README.md + docs/architecture.md updated in the same change. NOT verified on a device (no emulator/tablet attached here): the two-pane breakpoint and the search-as-you-type behaviour rest on the green unit tests and build."
