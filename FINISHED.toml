[[task]]
id = "record-and-bundle-opus-audio"
title = "Record and bundle Opus audio instead of WAV"
description = """
A .mobix now bundles the recording it references (carry-the-audio-recording-inside-the-document), but in the container the app's recorder produces: 16-bit mono WAV, so an hour of notes is about 300 MB, where the format's own spoke says Opus at 32-64 kbps mono would be about 15 MB (docs/audio-inking-sync.md, Bundled compressed audio). audio/OpusAudioRecorder.kt and audio/OpusAssetBundler.kt already exist with unit tests and no caller in app/src/main. Wire the recorder in behind AudioSession.startRecording (keeping the WAV path as the fallback when the encoder is unavailable), bundle through OpusAssetBundler-style content addressing so the entry becomes assets/aud_<sha256>.ogg, and let the player decode it (android.media.MediaPlayer takes an .ogg file the same way). Keep the .xopp side of the contract honest: a .xopp names a sidecar the desktop can play, so an exported document still needs a WAV beside it - either transcode on export with android.media.MediaCodec, or report the gap the way WavAudioSynthesizer's silence framing does today (which is a stub, not a conversion). Verify with a JVM test that one recording is one entry and that an opened document adopts it under its sidecar name, plus the on-device pass: record a minute of speech and compare the saved .mobix's size against the WAV build.

Landed (commit 5076db6): a recording's codec is now the document's own format. A `.mobix` captures **Ogg/Opus** through `audio/OpusAudioRecorder.kt` (AudioRecord 48 kHz mono -> MediaCodec `audio/opus` at 32 kbps -> the platform Ogg muxer, which needs API 29), a `.xopp` keeps the WAV sidecar desktop Xournal++ plays, and a `.mobix` on a device with neither the muxer nor the encoder falls back to WAV. `audioFileName` takes the container's extension, `MobixAssetSink.suffixFor` already sniffs `OggS`, so the sidecar is `2026-...ogg` and the bundled entry `assets/aud_<sha256>.ogg`; `AssetKind.AUDIO`'s default suffix follows, and `AudioStore.createChild` creates the SAF document with the type that matches the name. The player needs no change: MediaPlayer decodes an `.ogg` like a `.wav`. On the `.xopp` side nothing transcodes, so `WavAudioSynthesizer`'s silence-framed companion WAV and the rename of a compressed recording's `fn` to a `.wav` nobody writes are gone, together with `OpusAssetBundler` (a second, unused content-addressing layer that named Ogg bytes `.opus`); the export pushes the recording under the name the stroke really carries and the editor reports the gap ("N recording(s) here are compressed — desktop Xournal++ plays WAV only"). VERIFIED: 1543 unit tests / 0 failures and `assembleDebug` green (`scripts/host-build.sh`); `BundledAudioAdoptionTest` (new) proves one Ogg recording is one `assets/aud_<sha256>.ogg` entry and that reading the page that names it adopts it under the `.ogg` sidecar name, `AudioAnnotationTest` pins the name, `OpusAudioRecorderTest` kept the host-without-hardware test the deleted bundler test held. CAVEAT: the on-device size comparison (a minute of speech, `.mobix` against the WAV build) could not run here — no adb, no AVD — and is added as step (7) of `verify-the-paged-mobix-open-and-canvas-on-the-emulator`."""
