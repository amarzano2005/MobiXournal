[[task]]
id = "desktop-text-slot-and-in-place-field"
title = "Desktop: the Text slot places a box and edits it in place"
description = "The Text slot (X) types on the sheet instead of drawing: a press places a TextElement through a pure placement rule (one line high at the ink's size, a third of the page wide, the ink's colour, left aligned) and opens an in-place field over the box, drawn in the window's own glass with the caret where the press landed. Enter breaks the line, Esc or a click elsewhere commits the box as ONE undo step, and an empty box removes the element and records nothing; nothing is written while typing, so the page and its undo history stay as they were until the commit. The field owns the keyboard while it is up - the shell's key handler no longer steals Space (pan), B/H/V (tools) or Delete - and the box is the same TextElement the tablet writes, carried by the shared painter rather than a second text renderer. Tests: DesktopTextAuthoringTest pins the placement arithmetic, DesktopTextSceneTest drives a real scene (press, type, Enter commits one edit and one undo, Esc leaves the box, an empty box leaves no element) and a shell test proves the shortcuts stand aside. Docs: docs/drawing-tools.md owns the box and keys, docs/desktop-workstation.md no longer lists text as something the window does not do, README's desktop paragraph says you can type on the page. :desktop:test and the guard suites green."
