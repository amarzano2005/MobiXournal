[[task]]
id = "desktop-tablet-stroke-from-packets"
title = "Desktop: draw the pen from the tablet's packets, not from the mouse emulation"
description = "The pen's strokes are drawn from the tablet's own packets, which is how Xournal++ draws them and why a light touch no longer disappears. TabletWintab now hands every packet to listening canvases as a PenPacket in the window's client pixels (ScreenToClient, from the system context's screen coordinates) and includes the lift packet, so a stroke has an end that does not depend on Windows' mouse emulation. A new PenPacketStroke turns each packet into an InkPointer in the canvas's own pixels (client minus the canvas origin from onGloballyPositioned) and feeds the same PageInkGesture, so InkPointerRouter still decides what a press means, PressureCurve still sizes the width, the eraser end still rubs out and the lift still commits one edit; a packet off the sheet starts nothing, and a pen resting on the glass (the driver reports changes, so a still pen sends no packets) keeps its stroke for up to 2 s, after which the silence FINISHES it where it stopped - committed, not thrown away - while a tip-down after the silence begins the next stroke instead of stitching onto the old one. PageInkGesture takes the viewport as a provider (a packet can arrive after a zoom) and gained down/move/up overloads taking an InkPointer. The Compose pointer stands aside while the packets own the pen (pageGestures' penActive: it skips a press and drops its own draft), and the two paths keep SEPARATE drafts (PageCanvas holds the pointer's, PenPacketStrokes the pen's) - sharing one list let the emulation's release wipe the samples of the stroke the tablet was still drawing, which is a quick light contact losing its ink. One contact is one stroke and never two, and the mouse keeps its own path. PenPacketStrokeTest proves it headless: a tip-down ramping to a full press produces one tapered stroke, one undo step and a released pen with no pointer press anywhere in the test, an off-canvas packet starts nothing, a still pen keeps its stroke and a silence finishes it; PenPacketSceneTest drives a real ImageComposeScene with the emulated mouse pressing, moving past the tap slop and releasing around the same contact and asserts the page still gets exactly one stroke, the packets'. Desktop suite and the guards green; live check on the Huion still owed by the owner."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-24
completed = 2026-10-24
tags = ["desktop"]

[[task]]
id = "desktop-tablet-absent-fallback"
title = "Desktop: say honestly when there is no tablet"
description = "`PenSource` (`mouse` / `Windows Ink`) and `DesktopTablet`'s dial flag reach the status bar as `pen: Windows Ink · dial` (or `pen: mouse`), so the window cannot claim a stream it does not have and the difference between \"the pen draws at one width\" and \"the pen is a mouse as far as this window can tell\" is visible. `TabletInkTest.penLabel` pins the words. Both readers answer null after logging the step that refused them — `ink: window procedure installed`, `dial: no factory …`, `RoInitialize`, `CreateForWindow`, and each event's HRESULT — and the canvas keeps the Compose pointer, the wheel and the keyboard, which is the fallback `docs/desktop-workstation.md` now documents."
