[[task]]
id = "desktop-paint-living-entities-and-page-pictures"
title = "Paint living entities and page pictures in the desktop preview"
description = "Done. The living-entity ink pipeline is now platform-free in mobix-core: LivingInk plus the family compilers (TableInk, PlotInk, ShapeInk, CircuitInk) and what they need (CircuitShapes, ShapeBuilder, ChemShapes, FigureGeometry, FunctionPlot, FunctionAnalysis, AdvancedCurves, MultiFunctionPlotter, InkPrimitives, PlotFrame, TriangularLattice, ElementBounds, TriangleKind/TrapezoidKind, MeasuringText, and a new InkTokens holding the three drawing constants they used to borrow from the Android canvas theme). The app compiler needed no import changes: same package, one module up. Because a living entity compiles to ordinary ink (strokes and text), the desktop draws tables, plots, parametric shapes and circuit components by asking LivingInk for that ink and painting it with the painter it already had - one definition, both shells, no second renderer. An entity with no drawing for it (an unknown circuit symbol) is reported through LivingInk's uncompiled list rather than vanishing. Page pictures are drawn too: PageBackdrop resolves a pixmap or PDF background from the bundle first (a .mobix's assets), then a ZIP package's extraction, then the document's folder, rasterises PDF pages with JVM PDFBox at 2x (desktop-only dependency; the app keeps pdfbox-android) and caches a dozen page-sized bitmaps; the picture is drawn between the paper and the ink so a highlighter still multiplies into it and a missing picture leaves paper instead of failing. Verified by :desktop:test (17 tests), including 7 new ones that assert pixels: a compiled table's grid, a shape's outline, an uncompilable circuit reported, a pixmap's colour as the sheet, a bundled picture winning over a dead reference, a PDF page's grey landing under the ink, and a missing background staying white. Core 236 and app suites green; DocsGuard and SourceStructure green after the moves (the CircuitShapes ceiling moved with the file). Also smoke-ran the window on udiff.xopp with no exception. Docs: desktop-workstation.md, rendering.md, codebase.md, stack.md and README updated."
