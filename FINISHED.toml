[[task]]
id = "wire-the-synthesis-into-the-xopp-export"
title = "Export a .mobix as .xopp through the synthesis"
description = "The compiler exists (render/XoppSynthesis.kt) but nothing calls it. When a .mobix document is saved as .xopp - Save As switching the format, or the export entry in the overflow menu - run XoppSynthesis.synthesize(document) first and hand the result's document to the existing .xopp encoder (io/DocumentIo.encode with SaveFormat.XOPP), reusing the staging files as the .xopp path already does. The SaveFormat stays sticky: the open document is still a .mobix, so the export is a copy on disk and the tab keeps its own format. Surface SynthesisResult.uncompiled to the user after a successful export - the shared preview/print dialogs in ui/ open the exported file, so pass the list alongside the result and show one dialog naming what could not be drawn (an unknown symbol, a formula that would not parse) rather than exporting silently. Document the flow in README.md (how a .mobix is exported for the desktop) and in docs/mobix-format.md, replacing the 'still owed: the editor wiring' sentence in its Status paragraph. Verify with JVM tests: a .mobix holding a table and a plot encodes to bytes through the export that Xopp.open reads back with the same element count, an all-ink .mobix is written byte-identically to the ordinary .xopp path, and an unknown symbol produces one uncompiled entry and a document that still opens."
