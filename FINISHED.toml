[[task]]
id = "snap-to-text-magnetic-highlighter-line-detection"
title = "Snap-to-text magnetic highlighter line detection"
description = "`render/MagneticHighlighter.kt` is a pure algorithm: given the page's positioned word boxes and a highlighter path, it finds the words the path crosses, clusters them into line runs, and returns one flat rectangular band per line, sitting on the line's ascent and descent and spanning the crossed words — or nothing when the drag is steep, crosses several lines steeply, or crosses no text, in which case the stroke stays freehand. It is wired into `commitCurrent` after magnetisation: the bands are appended as ordinary highlighter strokes (same colour, baked alpha, constant width) in one gesture, so one undo removes the whole highlight. `MagneticHighlighterTest` covers a horizontal sweep over one line, multiple lines from one drag, the steep-drag fallback, a drag over no text, and the band geometry. Documented in `docs/pdf.md` and `README.md`. Verified live on the Pixel_Tablet AVD over an imported text PDF: a highlighter drag over the title line became a flat band exactly on the glyphs (descenders included), while a drag above the text stayed freehand."
