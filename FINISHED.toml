[[task]]
id = "keep-the-rail-s-last-button-fully-visible"
title = "Keep the rail's last button fully visible"
description = "Shipped as whole-slot sizing. ToolbarShell measures the height it is given (BoxWithConstraints) and hands the visible slot count to the pure railContentScale (RailSizing.kt): it counts the slots that fit whole at their own size (m slots take m*slot + (m-1)*spacing) and spreads exactly that many over the space, so the slot after them starts at the rail's bottom edge instead of being cut in half by it. The scale is never below 1 - a rail button is never drawn smaller than its own size, which is what keeps it usable at a glance - and capped at RAIL_MAX_SCALE (1.08) so the slot stays inside the rail's inner width; the leftover strip becomes slightly larger buttons rather than a sliver of the next one. What does not fit is one scroll away (the goal was reaching the page settings, not the last figure tool), and a rail that fits entirely is left at scale 1. The scale is published as LocalRailSlotSize (read by tool buttons, pop-up buttons, the one-tap colour slot; the zoom label reads LocalRailSlotScale, its content being text) and applied to the gaps, not the column padding, so the whole-number fit stays exact. Pinned by RailSizingTest (8 cases). README.md + docs/architecture.md updated in the same change. NOT verified on a device: no emulator or tablet was attached to this host, so the fit rests on the tested arithmetic plus a green build, not on a screenshot."
status = "finished"
level = "task"
category = "bug"
created = 2026-10-09
completed = 2026-10-09
