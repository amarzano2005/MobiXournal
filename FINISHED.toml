[[task]]
id = "desktop-apply-a-packet-batch-on-the-frame-it-arrives"
title = "Desktop: apply a packet batch on the frame it arrives"
description = "PageCanvas's packet ticker no longer waits for a frame between the token and the flush. The wait was the ink's second frame: withFrameNanos' continuation is dispatched back to the window's thread after that frame has been drawn, so the samples written after it were painted by the frame that followed. --probe-ink on the owner's PC (3440x1440, display reported at 120 Hz) measured median 12.45 ms / p95 16.82 / max 17.62 on a blank A4 before - two 8.33 ms frames - and 1.48 / 5.22 / 7.82 after; udiff.xopp's dense first page went 1.96 / 5.10 / 7.48. Both now fit inside one 120 Hz frame and inside the 6.9 ms a 144 Hz frame allows, so what remains is the display's own interval and not a frame this code adds. The queue hand-off, the conflated wake token and the 200 ms silence timer are unchanged: one batch still costs one repaint and an idle window still paints nothing. :desktop:test green, guards green. Recorded in docs/desktop-tablet.md (the two-frame table beside the 6.9 ms budget) and README's measured line."
