[[task]]
id = "repack-the-streamed-entries-without-recompressing-them"
title = "Repack the streamed entries without recompressing them"
description = "MobixIncrementalSaver streams an unchanged entry by inflating it from the source and deflating it again, so an incremental save costs what a full one costs in CPU and writes a data descriptor per streamed entry (measured on ten pages with one dirty: output 5088 B against a full write's 4928 B, docs/data-path.md). Copy the source entry's compressed bytes and its crc/size verbatim instead: java.util.zip cannot put a raw deflated entry, so this needs a small zip writer (local header, central directory, EOCD) plus a way to read an entry's raw bytes from the source - the ZipFile-backed MobixEntrySource has to find the data offset itself. Verify with JVM tests: a streamed entry's compressed bytes are byte-identical to the source's, the repacked archive is smaller than or equal to a full write of the same document, and it still opens through MobixDocument.open and MobixPagedReader."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-14
completed = 2026-10-14
tags = ["mobix", "perf"]

