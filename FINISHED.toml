[[task]]
id = "desktop-pdf-import-merges-a-second-pdf"
title = "Desktop: a second imported PDF is joined into the first"
description = "Shipped `desktop/src/main/java/com/mobixournal/desktop/DesktopPdfMerge.kt`: `join(base, added, out)` over the JVM `org.apache.pdfbox.multipdf.PDFMergerUtility` (temp-file memory setting), refusing a destination that equals either source because the merge reads them while it writes — the same guard the tablet's `render/PdfMerger` states — and `joined(base, added)` picking the destination in the window's import scratch folder, named after the base plus a stamp of its own absolute path so two documents that both bring a `chapter.pdf` cannot overwrite each other's joined file. The APPEND path now honours the single-PDF rule of `docs/pdf.md`: when the active document already carries a `Background.Pdf` that resolves to a file (`DesktopDocument.pdfSource`), the arriving PDF is joined after it, the document's one reference is re-pointed at the joined file (`DesktopPdfImport.retarget`, `domain=\"absolute\"`), and the arriving pages are the joined file's **tail** (`pages(joined).drop(basePageCount)`) so every `pageno` still names the page it was made from instead of a second numbering that no page has. A document with no PDF background appends with its own reference, as the tablet does. Verified by `DesktopPdfMergeTest`: two files 2+3 pages become 5 while both sources stay byte-identical, the arriving run carries `pageno` 2,3,4, the reference is re-pointed at the joined file, and a destination equal to a source is refused; plus the state case in `DesktopPdfImportCommandsTest` where two imports land as five pages with one reference and the numbers 0..4. Docs: `docs/desktop-workstation.md` (a second PDF is joined)."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-28
