[[task]]
id = "desktop-the-packet-hand-off-is-a-queue-not-a-monitor"
title = "Desktop: the packet hand-off is a queue, not a monitor"
description = "PenPacketStroke now hands packets across threads with a java.util.concurrent.ConcurrentLinkedQueue: packet() only enqueues (no state, no monitor, no gesture), flush() on the frame ticker drains it and runs the whole state machine through a new private ingest(), and the per-frame sample buffer is drained by drainPending(); every @Synchronized and the volatile on drawing() are gone, so the gesture, the draft and the commit are touched by one thread. This replaces the monitor added in the previous pass, which fixed the null samples but froze the window on the first stroke: the message thread took the lock and then wrote Compose snapshot state while the frame thread waited for the lock inside a frame that already held the snapshot's lock. Tests: PenPacketStrokeTest gained a send() helper (packet then flush, the ticker's order) and a case proving a queued packet with no frame behind it draws and commits nothing, and the batching case now queues eight packets then flushes once; PenPacketStrokeConcurrencyTest keeps the two-thread hammer (no exception, strokes committed) and asserts the shape of the hand-off instead of a modifier (packet() not synchronized, inbox a ConcurrentLinkedQueue). Docs: docs/desktop-tablet.md records all three shapes and why the first two failed on the running window. :desktop:test green, DocsGuardTest green, --probe-ink unchanged (median 13.3 ms blank, 13.6 ms udiff, p95 18.3/19.4), :desktop:createDistributable regenerated and smoke-started (window procedure and Wintab context up at 400 packets/s, no exception on stderr). Deliberately not done: a dedicated packet thread with its own dispatcher (the queue already gives the driver's thread a non-blocking hand-off) and a peak limit on the inbox (it only grows while frames are not being produced)."
status = "finished"
level = "task"
category = "bug"
created = 2026-10-24
completed = 2026-10-24
tags = ["desktop", "bug"]

[[task]]
id = "desktop-the-packet-buffer-is-written-and-drained-on-two-threads"
title = "Desktop: the packet buffer is written and drained on two threads"
description = "PenPacketStroke's four shared entry points (packet, flush, publishHover, finishIfStale) are @Synchronized on the instance and drawing is @Volatile, so the packet buffer, its smoothing state and the gesture are serialised between the window-procedure thread that delivers packets and the frame ticker that drains them; the crash was a null coming out of a concurrently mutated kotlin.collections.ArrayDeque, which passed the call site's cast and was rejected by PageInkGesture.move's parameter check ('parameter specified as non-null is null ... parameter pointer'). Documented in PenPacketStroke's KDoc and docs/desktop-tablet.md (the packet section now says which threads meet and what was measured: about 350000 nulls in half a second of two threads hammering one deque). Regression test PenPacketStrokeConcurrencyTest hammers packet() against flush()/publishHover()/finishIfStale() from a second thread, asserts no exception and that the strokes still commit, and asserts java.lang.reflect.Modifier.isSynchronized on all four methods so removing the lock fails the suite rather than depending on timing. :desktop:test green (three runs of the concurrency case). Deliberately not done: moving the packet work onto one dedicated thread (a dispatcher and a hand-off queue) — the lock is the smaller change with the same guarantee, and the gesture work stays where the snapshot writes already belong. The packaged desktop executable was regenerated once the owner closed the running window (that window held desktop/build/compose/binaries under a file lock) and started clean: the launch log shows the window procedure installed, the Wintab context opened at 400 packets/s with pressure 0..16383, and no exception on stderr."
status = "finished"
level = "task"
category = "bug"
created = 2026-10-24
completed = 2026-10-24
tags = ["desktop", "bug"]

[[task]]
id = "desktop-a-live-stroke-costs-the-same-on-a-dense-page-as-on-a-blank-one"
title = "Desktop: a live stroke costs the same on a dense page as on a blank one"
description = "Desktop/src/main/java/com/mobixournal/desktop/PageRaster.kt caches the page for the viewport in force in a canvas-sized ImageBitmap painted through the same drawPageContent (CanvasDrawScope into Canvas(ImageBitmap)), invalidated only by page identity, viewport, zoom, density, size, backdrop or hidden layers, and reusing the image across scrolls; paintSheet in PageCanvas.kt blits it and then paints only the drafts, so a live frame is O(stroke) instead of O(page). PenPacketStroke gains onHover/publishHover and PenPacket gains near from Wintab's TPS_PROXIMITY, so the ring is moved once per frame by the newest driver reading for a hovering or drawing pen, survives a still pen (the driver reports changes) and is cleared by the driver's proximity-out; PageCanvas keeps the mouse from dragging it back for HOVER_STALE_NANOS. Tests: PageRasterTest (cached frame pixel-identical to the direct paint within 2 channel levels, one rasterisation per still viewport, one more per scroll, a blit per repainted frame) and a PenPacketStrokeTest case for the hovering ring with its staleness and proximity-out rules. Measured with --probe-ink on the Windows 11 laptop: udiff.xopp's dense page went from median 17.7 / p95 29.4 / max 47.6 ms to 13.6 / 19.8 / 29.0 ms, level with the blank A4 sheet (13.5 / 18.3). Deliberately not done: stroke prediction (the remaining cost is the display's frame interval, and extrapolating the head would trade a clean line for less than a millisecond) and dirty-rect pacing for scrolling and zooming, which stays desktop-144hz-render-pacing's. Docs: docs/desktop-tablet.md's measurement and ring paragraphs, README's desktop paragraph. :desktop:test green, DocsGuardTest green, :desktop:createDistributable regenerated; no Android change."
status = "finished"
level = "task"
category = "feature"
