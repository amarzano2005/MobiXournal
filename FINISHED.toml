[[task]]
id = "make-the-mobix-format-doc-say-what-the-code-does"
title = "Make the .mobix format doc say what the code does"
description = "docs/mobix-format.md reads as if the format engines are running today and three of them are not: MobixPagedReader and MobixIncrementalSaver exist with unit tests and are called by no file in app/src/main, so opening a .mobix still inflates the whole document and every save still repacks the whole archive; audio is a sidecar (MobixElementCodec writes the stroke audioRef but the bytes are never bundled, so the file is not self-contained); and render/KaraokeStrokeAnimator.kt has no caller at all, so the per-point timings a .mobix stores are never replayed. The motivation section stays as it is - it argues for the format, and the argument is still right - but the capability table and the Engine optimizations section must say per row what is live, what exists only as a tested library, and what is not built, each not-yet row pointing at the task that will make it live (open-a-mobix-page-by-page-not-whole, repack-only-the-pages-a-save-changed, carry-the-audio-recording-inside-the-document, replay-the-writing-in-time-with-its-recording, finish-the-pen-telemetry-payoff, render-and-edit-an-infinite-canvas-document). Keep the file inside its DocsGuardTest line budget and keep every claim linkable from docs/architecture.md. This lands before the wiring on purpose: the doc is wrong today, and each wiring task flips its own row as it lands."
