[[task]]
id = "desktop-144hz-render-pacing"
title = "Desktop: 144 Hz render pacing and ink latency (scope)"
description = "Investigated and broken into tasks, with the first of them implemented in the same pass. Findings: the window's frame clock reaches ~120 paints/s on this host, so pacing is not capped by the toolkit - what kept a stroke off the 144 Hz budget was the paint itself. The watchdog (--diagnose) now times each paint, which turned the question into a number: direct painting of udiff.xopp costs 3.8 ms mean and up to 10.2 ms, over the 6.9 ms budget, and it is Kotlin cost (LivingInk per entity, text measurement, a Path/taper outline per stroke), not Skia's. Recording the page once into a Skia Picture and replaying it costs 0.1-0.3 ms mean / 1.0 ms worst on the same page, so a live stroke now fits the budget (that work is archived as desktop-record-the-page-as-a-skia-picture-so-a-frame-fits-144-hz). A bitmap cache was tried and rejected on evidence: rasterising into an offscreen software surface cost ~780 ms per rebuild with paints/s=1. Children filed: desktop-dirty-rect-pacing-for-scrolling-and-zooming (scroll and zoom still re-record per frame), desktop-report-the-display-s-refresh-rate-and-the-frame-budget (the window should say which refresh it is on), desktop-predict-the-stroke-head-to-hide-the-frame-s-latency (what is left after the paint is the frame interval). The 6.9 ms result on the owner's 144 Hz monitor is still the owner's live check: this host cannot measure it."
