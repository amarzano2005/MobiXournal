[[task]]
id = "desktop-frames-are-asked-for-by-packets-not-by-a-loop"
title = "Desktop: frames are asked for by packets, not by a loop"
description = "The frame ticker in PageCanvas is event-driven: PenPacketStroke.packet() trySend()s on a conflated Channel and a new suspend awaitPacket() suspends the ticker, which then takes one withFrameNanos and flushes, so one batch of packets costs one frame while an idle window paints nothing; the silence check moved to a 200 ms delay coroutine because absence produces no packet to wait for. The bug was measured, not guessed: the new watchdog DesktopDiagnostics (--diagnose, mobix-diagnose.log, one line per second of painting with paints/s, worst interval, raster rebuilds and both thread names, started from main and fed from paintSheet so it counts every repaint) reported ~120 paints a second on an idle sheet and zero after the change, with rebuilds=1 both times - so the freeze was a saturated message thread, not the cache. Also: the cached sheet is drawn as a Skia Image through the native canvas instead of a Compose ImageBitmap (one quad, no per-frame copy: 9.0 ms -> 5.4 ms per blit at 3400x1400 in software, PageRasterTest still asserts pixel identity); initialDocument ignores -- switches so --diagnose is not opened as a document; InkProbe accepts -Dmobix.probe.size=WxH so latency can be measured at the owner's window size; .gitignore covers ink-probe.csv and mobix-diagnose.log. Verified: :desktop:test green, --probe-ink on udiff.xopp median 12.8 ms / p95 17.9 ms, packaged exe regenerated and started with --diagnose leaving only the watchdog header (no paints at all while idle). Docs: docs/desktop-tablet.md (event-driven frames, the watchdog, the blit)."
status = "finished"
level = "task"
category = "bug"
created = 2026-10-24
