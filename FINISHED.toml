description = "The Standard layout drew the header bottom edge twice, 38dp apart. The document tabs were a slab of their own hung under the bar and held out of the rail lane (SideToolbarModernTotalWidth) so the two would not collide, which left the header ending at y 76dp over the lane (pixel profiles of the installed build at x 3dp and 60dp) and at y 113dp over the page (x 130dp and 1275dp): a step with the chips starting to one side of it, reading as a cut across the header. The tabs are now the top bar second row, inside the same Surface (EditorTopBar), so one rim and one shadow close the whole header and the rows are separated by a hairline drawn inside it (Modifier.topHairline, replacing bottomHairline and the removed TabBand). The chips keep the starting line they had as a band - the rail lane plus their 8dp lead-in (TAB_STRIP_LEAD_IN) - so they still line up with the figures dock own line, and the rail lane now begins below the header whole height (y 114dp), which is what the rail spacing budget pays for: RailSpacing went from 6dp to 4dp so all 15 slots still fit whole (656dp of 658dp available; at 6dp only 14 fitted and the last sat behind a scroll). EditorPaneView no longer takes the tabs: they are the active pane own, as in Compact. Verified on the Pixel_Tablet AVD from the installed APK in both themes - the header bottom hairline is at y 113dp at x 3, 60, 130 and 1275dp, the chip labels and the dock are exactly where they were, and uiautomator shows the rail 15 slots at the 44dp pitch with the last at y 754..774dp inside its lane. 1384 unit tests pass, including the docs and source-structure guards."
