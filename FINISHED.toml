description = "finish-the-pen-telemetry-payoff. render/DrawingSurfaceStrokes.kt addSamples (line 354) reads getAxisValue(AXIS_TILT, pointerIndex).takeIf { it != 0f }, so a pen held upright - the ordinary writing posture, which reports tilt 0 - and a tablet with no tilt axis both store null, and a reader downstream cannot tell a real zero from an unsupported axis. Add a pure, JVM-testable helper (render/StrokeTelemetry.kt) that takes one raw axis reading plus whether the device declares that axis and returns what to store: the reading itself when the axis is declared (0 included), null when it is not. Wire both tilt and azimuth through it, keep the stored units as the platform reports them (radians), and leave a .xopp import carrying null telemetry, exactly as today. Cover it with JVM tests: a declared axis reporting 0 keeps 0, an undeclared axis yields null, a declared non-zero reading passes through unconverted, and a stroke with no telemetry at all stays null. docs/mobix-elements.md states the units of the stored fields, so a reader can interpret what this now records."
