[[task]]
id = "move-the-ink-palette-and-width-rules-into-mobix-core"
title = "Move the ink palette and width rules into mobix-core"
description = "Done. mobix-core/src/main/java/com/mobixournal/design/PenPalette.kt is the one home of the values and the rules, plain Kotlin: BLACK..WHITE and COLORS (the eight Xournal++ hexes in the published order), MAX_COLORS = 24, DEFAULT_WIDTHS = 0.85/1.5/2.6, WIDTH_LABELS = S/M/L, WIDTH_MIN = 0.5, WIDTH_MAX = 15, and the pure rules opaque, add (opaque, de-duplicated, capped), sanitised (the same, falling back to COLORS when empty), clampWidth and widthSlot (nearest slot, a tie going to the lower one). The app now reads it rather than owning a copy: ui/ToolbarColorPopup.kt's XOPP_* names and PEN_COLORS are aliases, PEN_WIDTH_LABELS/MIN/MAX in ui/ToolbarSizePopup.kt delegate, AppSettings.MAX_PEN_COLORS and DEFAULT_PEN_WIDTHS take their values from it, AppSettings.sanitized() calls PenPalette.sanitised/clampWidth, and ColorPaletteState.addColor calls PenPalette.add, so the tablet and the desktop cannot drift. Verified: mobix-core PenPaletteTest (8 tests) pins the hexes and order, the ceiling, de-duplication, opaque promotion, the empty-palette fallback and the width clamp/slot lookup incl. the tie; :mobix-core:test 244 tests, :app:testDebugUnitTest 1530 tests, :desktop:test 77 tests, all green, and the 36 guards green after SourceStructureTest caught AppSettings.kt one line over its 997 ceiling - the KDoc was tightened rather than the ceiling raised. Docs: docs/colours.md opens with PenPalette as the one home, and docs/chrome.md's palette paragraph stops claiming PEN_COLORS lives beside the pop-up."
