id = "carry-the-page-source-into-the-editor"
title = "Carry the page source into the editor"
description = "The page counter, the rail pages button and the page list read document.pages today: DrawingSurfaceView.doc.pages.size flows through onPageCountChanged into the Compose state (ui/EditorRegions.kt), and the pages popup counts the same list. Once a PageSource exists (expose-a-page-source-and-count-pages-from-the-manifest), carry it from the open path to the surface - LoadedFile.Doc, OpenTab/TabSession and DrawingSurfaceView.doc move together, so a .mobix opened from its manifest answers the count and the page names without decoding a page, and a .xopp answers from its in-memory list exactly as now. The canvas keeps reading its document for the pages it draws; only the count, the ids and the page list stop walking them all. Verify on the emulator with a 200-page .mobix: the counter and the pages menu show 200 rows and the right names on open, with no page entry read until one is drawn (TrackedEntrySource), and the journal notes the same for a .xopp. Landed: io/DocumentIo.kt's .mobix branch is a **paged** open (MobixPagedReader + MobixDocument.openPaged), the reader is kept open for as long as the session holds the document (pagedOpens/prunePagedOpens, driven from MainActivity.prunePdfCache), and the reader's own view is what the open document holds (PageSource.asPageList -> LazyPages), so pages.size, the tab counter, the rail pages button and the page list answer from manifest.json without inflating a page. A page's bundled background is adopted when that page is read: io/BundledBackgrounds.kt is a PageSource layer over the reader that is also the render/BackgroundResolver the canvas is handed (DrawingSurfaceView.setBackgroundResolver), keyed by the reference the document keeps; the archive's own PDF is adopted up front and a linked reference is resolved exactly as a .xopp's is. The resolver travels with the tab (OpenTab.backgrounds), because a page adopted later has to be reachable after a tab switch. format/model/DocumentPages.kt (EditedPages/withPage) keeps a one-page edit to one page, so the canvas's edit no longer walks a reader-backed list. VERIFIED: 1443 unit tests / 0 failures - PagedMobixOpenTest (a 200-page .mobix opens with 3 entries inflated: mimetype, manifest, canvas, and zero pages), DocumentPagesTest (one edit inflates one page, the rest stay unread), MobixPagedOpenBenchmarkTest, which now measures the path the app ships through DocumentIo.read (1 ms, 3 entries, against 4 ms / 204 entries for the whole-archive open) - and assembleDebug green. CAVEAT: the emulator pass is UNRUN (this host has no /data/android toolchain, no adb, no AVD) and is carried by verify-the-paged-mobix-open-and-canvas-on-the-emulator. The open no longer reports a page whose bundled background is missing, since the walk that produced that report is the walk it exists to avoid: carried by report-a-mobix-page-whose-background-is-missing."
