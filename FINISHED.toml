# FINISHED — completed-work archive for MobiXournal.
#
# Append-only, newest first (see AGENTS.md -> documentation map). Tasks land
# here when `scripts/todo.sh done <id>` moves them out of TODO.toml.
#
# `release` separates shipped work from work pending the next version:
#   absent        -> pending; belongs to the next release's changelog
#   "X.Y.Z"       -> shipped in that version
# `scripts/todo.sh release --version X.Y.Z` stamps the pending set and drafts
# docs/releases/vX.Y.Z.md; `list --finished --unreleased` shows the pending set.

schema_version = 1

[meta]
title = "Finished"
kind = "finished"
purpose = "The archive of completed work for this project."
documentation_map = "AGENTS.md"
order = "newest first"
latest_release = "1.3.0"

[meta.rules]
finish_work = "Tasks arrive here via `todo.py done <id> --shipped`, which replaces the plan with what actually shipped; newest first, append-only."
growth = "This file only grows; nothing is removed from it."
release = "A task's `release` stamp is the version it shipped in; a task without one is pending the next version. `todo.sh release --version X.Y.Z` stamps the pending set and drafts docs/releases/vX.Y.Z.md, which is what keeps the per-version changelog correct."

[[task]]
id = "audio-per-tab-and-desktop-pill"
title = "Audio belongs to its tab, on both shells"
description = "Audio is per tab on both shells. mobix-core/audio/AudioFiles.kt holds ownsRecording(ownerTab, drawnInTab), asked at the one commit funnel in each shell, so a take only stamps its own tab's ink (AudioOwnershipTest). DesktopAudioSession now names the tab that owns the take and the tab that holds the clip and answers per tab through DesktopTabAudio (DesktopAudioSession.of): the pill, the transport and the karaoke read that tab's state, switching tabs lets the clip go, and closing a tab finishes its take (closeActiveTab / settle). The desktop pill adopts AudioMiniCapsule's meanings — pause holds the take only (no second pause mark beside the play button) and Play also picks the audio tap — and the tool strip no longer offers an audio slot (DESKTOP_TOOLS_WITHOUT_A_SLOT; ToolGroupsTest, DesktopAudioToolTest). On the tablet the take is keyed to recordingTabId: MainActivityAudio stamps and stops only inside that tab, the finished file is filed under it, closing that tab finishes it, and AudioUiState.recordingElsewhere disables the capsule's microphone on any other tab while the shade's Stop still ends the take wherever it runs. Both suites green (:app 1418, :mobix-core 549); :desktop 683 with one pre-existing Windows-only PDF reference failure (DesktopPdfImportCommandsTest, also red on HEAD)."
