[[task]]
id = "desktop-living-handles-on-the-page"
title = "Desktop: handles on the living element itself (vertices, dividers, sliders)"
description = "A living element is edited where it is drawn. LivingGrips.kt holds the pure arithmetic: a parametric figure wears a ring on every corner and a table a ring on each INTERIOR divider (the outer edges stay the selection's own corner squares, so a corner is never ambiguous), gripAt picks the nearest ring inside the handles' own screen-pixel radius divided by zoom and density, and dragGrip writes the gesture's whole offset from the element as it was at grab time. A corner moves through ParametricShapes.snappedVertex/moveVertex - the 0/30/45/90 directions within the tablet's 7 degrees, Shift frees it - and a divider rewrites colWidths/rowHeights, stopping at GRIP_MIN_CELL_PT rather than swallowing its neighbour and never touching cells, left or top. The grip is caught in SelectionGesture before the five box handles, one drag is one edit per frame recomputed from the grab-time element and ONE undo step on lift, Esc restores the page exactly, a drag that changes nothing records nothing, and the outline travels with the ink. SelectionOverlay draws the grips as rings (round where the box's handles are square) and a double-click on the selected element opens the same lane the pencil does (TapTracker: 400 ms, 8 px), threaded from the canvas to the shell's own EDIT command. A plot's interval and a component's outline deliberately have no grips - those values live in the lane. Tests: LivingGripsTest (10 - grips per family, nearest-wins hit test, a family with none, the corner drag, snap on and off, a divider keeping the box and the cells, the minimum-width stop, out-of-range grips writing nothing, the double-click window) and DesktopLivingGripsSceneTest (3 - a divider drag in a real ImageComposeScene is one undo step, a miss moves the element instead of dividing it, and two clicks open the editor). Docs: docs/selection.md, docs/mobix-elements.md, docs/desktop-workstation.md, README. Desktop tests, the app suite (1505, guards included) and the regenerated distributable all green. PageCanvas.kt was split (SheetGestures.kt, SheetLayout made internal) to stay inside the 700-line ratchet, and the desktop-workstation/mobix-elements/ui-modernization docs were trimmed back under 400 lines."
