# FINISHED — completed-work archive for MobiXournal.
#
# Append-only, newest first (see AGENTS.md -> documentation map). Tasks land
# here when `scripts/todo.sh done <id>` moves them out of TODO.toml.
#
# `release` separates shipped work from work pending the next version:
#   absent        -> pending; belongs to the next release's changelog
#   "X.Y.Z"       -> shipped in that version
# `scripts/todo.sh release --version X.Y.Z` stamps the pending set and drafts
# docs/releases/vX.Y.Z.md; `list --finished --unreleased` shows the pending set.

schema_version = 1

[meta]
title = "Finished"
kind = "finished"
purpose = "The archive of completed work for this project."
documentation_map = "AGENTS.md"
order = "newest first"
latest_release = "1.3.0"

[meta.rules]
finish_work = "Tasks arrive here via `todo.py done <id>`; newest first, append-only."
growth = "This file only grows; nothing is removed from it."
release = "A task's `release` stamp is the version it shipped in; a task without one is pending the next version. `todo.sh release --version X.Y.Z` stamps the pending set and drafts docs/releases/vX.Y.Z.md, which is what keeps the per-version changelog correct."

[[task]]
id = "desktop-colour-and-stroke-width-shortcuts"
title = "Desktop colour and stroke-width shortcuts"
description = "Done. The ink has its keys, checked in the order the table documents. DesktopShellState.onKey now asks shellCommand first (Ctrl+1 stays fit width, Ctrl+0 fit page), then inkCommand, then toolForKey, so no ink key can take a letter or a Ctrl combination. inkCommand (Key.One/Two/Three and their numpad twins, Key.RightBracket/LeftBracket) resolves to PickFavourite(i), SetFavourite(i) on Alt, or StepWidth(+-1), and the state methods pickFavourite, setFavourite and stepWidth do the work: favourites are three ARGB values under interface.colourFavourites (defaults to the first three of PenPalette.COLORS, repaired to opaque/de-duplicated/exactly three on read by PaletteCodec.decodeFavourites), the ink colour is written as ink.colour, and a width step walks S - M - L and stops at both ends rather than wrapping (PenPalette.widthSlot + clamp). The strips' pills name the keys: the colour slot shows the favourite digit (or 1 2 3 when the colour is not one) and the size slot shows S/M/L, both through the one StripPill the tools use, so the doc's table and the strip cannot drift. Verified: InkShortcutsTest (9 tests) - the digit/Alt/bracket mapping including numpad and the Ctrl refusals with Ctrl+1 still FIT_WIDTH and B still the pen, picking a favourite, Alt redefining one slot and surviving a reload with the other two untouched, ]/[ stepping and clamping both ways with the last step persisted, a short/duplicated favourites file repaired, the pill's label, and a rail render whose capsule is the picked colour and whose L dot has more ink than the S dot. :desktop:test 94 tests, 0 failures; guards 36 green; app and core suites untouched. Docs: the desktop keyboard tables in docs/ui-modernization.md and README now list the three ink rows. Renders: desktop/build/desktop-render/{ink-keys-s,ink-keys-l}.png. Gap: the pills are Popups on hover, so their text is not read by a test; the keys are proven through inkCommand and the state, not by synthesising a window event."
