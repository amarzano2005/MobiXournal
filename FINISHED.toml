[[task]]
id = "desktop-open-mobix-and-zipped-xopp"
title = "Desktop preview: open .mobix and zipped .xopp"
description = "Done. DocumentLoader no longer guesses by extension: it classifies the leading bytes with FileKind.of and, for a ZIP, reads the archive's own `mimetype` entry to tell a native .mobix from a self-contained .xopp (falling back to content.xml presence), then opens the right path. DesktopDocument now holds a PageSource instead of a Document: a .mobix reports its page count from the manifest and inflates a page only when asked, while a .xopp is materialised as before. The window lists pages in a LazyColumn, so only the pages on screen are read; the header shows \"pagine lette su richiesta\" for a paged document instead of walking it to count strokes, and a page that fails to decode reports itself instead of blanking the window. The reader is closed when another document is opened and when the window closes. Every container the app writes now opens: gzip .xopp, ZIP .xopp (background PDF extracted to a per-open temp file, not painted yet) and .mobix. Unsupported input is refused with what it appeared to be. Verified by :desktop:test (10 tests): the three containers, both misnamed cases (.mobix bytes in a .xopp name and the reverse), a text file and a document-less ZIP refused by name, plus a headless render of a page read from a .mobix (build/desktop-render/mobix-page-1.png) and the existing udiff.xopp render. Also smoke-ran :desktop:run on a 40-page .mobix: the window came up with no exception and was closed after ~2 minutes. docs/desktop-workstation.md, README.md and the Phase 2 plan updated; guards (DocsGuard, SourceStructure) green."
