[[task]]
id = "confine-the-save-identity-adoption-to-the-pages-it-writes"
title = "Adopt a .mobix save's identity only over the pages it writes"
description = "The .mobix save no longer builds a page nothing touched (repack-only-the-pages-a-save-changed), but the editor still handed it a document whose every page had been opened. MainActivityDocuments called DrawingSurfaceView.adoptIdentity() on the UI thread before the snapshot, and that ran Document.withIdentity(), which walks pages.map { ElementId.withIds(page) } over the WHOLE page list. For a paged .mobix that list is the reader-backed one, so a save of a 200-page notebook opened all 200 pages — 199 of them only to be told they already have ids — which is exactly the cost MobixPageReuse was built to avoid; the format layer's measurement (2 ms, 1 page opened) was therefore not what the editor actually paid. LANDED 2026-10-15: the adoption is now the save's own answer, computed once and shared. MobixPageReuse.identified(document) is new and is the single place the choice is made — the pages a save writes identified (Document.withIdentityOn), everything else left as it is, the document's own id adopted either way — and MobixDocument.of now calls it instead of holding that branch alone. DocumentIo.identifyForSave(document, target) answers with the document the editor must adopt: it resolves the archive this save will repack over through the extracted mobixSourceFor (the same lookup encode already did, so the two cannot disagree about which file is the source) and asks MobixPageReuse.of the same question the write will ask. DrawingSurfaceView.adoptIdentity(identified) takes that document instead of adopting over every page itself (and lost a line, the ratchet in SourceStructureTest having pinned that file at its ceiling), and MainActivityDocuments passes io.identifyForSave(view.toDocument(), uri) — snapshot first, adopt the answer, then hand it to the encoder. MEASURED (MobixPageReuseTest.adoptingTheIdentityOfThePagesASaveWritesOpensNoOtherPage, a counting PageSource): identifying what a one-page edit of a two-hundred-page notebook writes opens **no page at all** — the page is in the model already, so not even one is inflated — against **200 page openings** for the whole-document adoption that used to run before every save; the same document, the same ids, no read. Its companion theIdentityASaveWritesIsTheIdentityTheModelKeeps covers what the adoption still has to do: the document's own id, minted into the manifest, must be the model's (a model that did not adopt it would hand out a fresh one next save). VERIFIED: 1463 unit tests / 0 failures — SaveIdentityTest is new and pins the fallback the editor must keep, a document with no archive behind it is identified over every page and an already identified one is handed back as it is — compileDebugKotlin green. rebuild=no and emulator-debug=no for this task, so no APK was built and no device pass was owed. CAVEAT, recorded rather than papered over: identifyForSave's narrowing branch needs the open archive's URI to match the save target, and a JVM test cannot build a content:// URI (Uri.parse is a stub in the mockable android.jar — probed: it returns null, and Uri.EMPTY is null too), so that branch stays an on-device check (verify-the-paged-mobix-open-and-canvas-on-the-emulator), while the format-level answer it delegates to is covered by the tests above. FOUND ON THE WAY, and now written down in docs/data-path.md: the .mobix *decoder* mints an id for an element that carries none (MobixElementCodec's mint parameter), so a page read out of an archive always has element ids — the adoption's real remaining work is the document id and the manifest's page ids, which is why the whole-document walk was pure cost."
status = "finished"
level = "task"
category = "bug"
created = 2026-10-15
completed = 2026-10-15
tags = ["mobix"]

[[task]]
id = "repack-only-the-pages-a-save-changed"
title = "Repack only the .mobix pages a save changed"
description = "PARTLY DONE 2026-10-14. The wiring exists and the win is measured: MobixIncrementalSave plans the diff (a page compared by the sha256 its own manifest records, an asset by the hash in its name, the envelope byte-compared) and DocumentIo remembers each open .mobix staged copy by document id, repacking over it when a save lands back on the same URI, falling back to the whole archive otherwise; MobixZipRewrite copies an unchanged entry's compressed bytes verbatim (java.util.zip cannot put a raw deflated entry, so the container's local headers, central directory and end record are written by hand). Measured on ten pages with one edited: 12 of 14 entries copied verbatim, 4862 B written against 4926 B for a full write, and an untouched page's compressed bytes asserted identical to the source - so the file no longer grows and a background PDF is never inflated or recompressed. Two pieces remain. (1) Skipping the JSON regeneration of a page whose model did not change: today every copied page's JSON is still rebuilt, only to hash it. (2) The emulator round trip that has never been run: open a .mobix, edit, save, close, reopen, confirm the document is intact. It cannot be driven the short way - measured 2026-10-14, handing the app a content:// URI from adb is refused (SecurityException: UID 2000 may not grant another app's content URI), and UriStaging.isWritable accepts only a *persisted* write grant, which only the system picker produces. So the tab must be opened through the Open picker once (the open path persists that grant, which makes the in-place repack reachable on save), or the document must be saved through Save As and reopened. LANDED 2026-10-15 (the whole of piece 1, and it turned out to be about opening pages, not hashing them): a page this save is not going to write is now a page it never opens. format/mobix/MobixPageReuse.kt answers from the shape of the document's page list - a paged .mobix keeps the reader's own list with the edited pages overlaid (PageSource / MobixDocument), so a page an edit did not replace *is* the source's page at that index: it has an entry the manifest names and a sha256 the manifest recorded, and the save copies the one and writes the other without parsing, rebuilding or hashing anything. Identity follows the same rule one step earlier: MobixDocument.of adopts over the pages it will write (MobixSavePlan.written -> Document.withIdentityOn, new in format/model/DocumentIdentity.kt), because a copied page's ids came with the file. format/mobix/MobixSavePlan.kt is the plan the save follows - the entries to write plus the order the whole file goes in, reused pages included - and MobixZip.Index reads the central directory ONCE per file (a read per copied entry made the save quadratic: the benchmark caught ~half a second for a two-hundred-page notebook before that fix). MobixPageParts.kt holds the per-page part naming the reader and the save now share. Nothing that decides what to write is a flag: a part is compared by the sha256 its own manifest records, an asset by the hash in its name, the envelope byte for byte, and a copied page by the shape of the list it is in. MEASURED (new MobixIncrementalSaveBenchmarkTest, report in app/build/reports/mobix-incremental-save.txt, and quoted in docs/data-path.md and docs/mobix-format.md): one edited page of a 200-page notebook takes 2 ms and opens ONE page - the first, which states the document's own paper and page size - against 13 ms and 399 page openings for the build-everything path it replaced; 3 entries are rewritten and all 200 copied pages stream; the 1 MiB asset the archive carries is never read; and both paths' bytes re-open to the same document. What the format layer costs is now constant, not proportional to the notebook. VERIFIED: 1459 unit tests / 0 failures (MobixPageReuseTest, MobixIncrementalSavePlanTest, MobixIncrementalSaveTest, the benchmark and the wiring call sites among them), assembleDebug green. CAVEAT (piece 2, still unrun): the on-device round trip is UNRUN - this host has no /data/android toolchain, no adb and no AVD, so emulator_debug=yes could not be honoured; the check is item (3) of verify-the-paged-mobix-open-and-canvas-on-the-emulator, which is also where the paged open and canvas are to be seen. RECORDED RATHER THAN FIXED: the editor's own save still adopts identity over EVERY page before it hands the document over (MainActivityDocuments -> DrawingSurfaceView.adoptIdentity -> Document.withIdentity), so a 200-page save still opens 200 pages on the UI thread and the editor does not yet pay what the format layer pays - confine-the-save-identity-adoption-to-the-pages-it-writes is the task for that, and data-path.md's \"not live yet\" note records it. Also carried: a save with no source archive can still drop a payload no store ever adopted (supply-a-deferred-payload-on-a-save-that-has-no-source)."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-14
completed = 2026-10-15
tags = ["mobix", "perf"]

[[task]]
id = "carry-the-audio-recording-inside-the-document"
title = "Carry the audio recording inside the .mobix container"
description = "A stroke already records its audio in a .mobix - format/mobix/MobixElementCodec.kt writes audioRef.assetId from the .xopp fn and audioRef.startMs from ts - but the sound itself never enters the archive: MobixDocument.of is handed only backgroundBytes (PDF and pixmap) and io/DocumentIo.kt supplies nothing else, so audio/AudioStore.kt .wav stays a sidecar beside the document. The file is therefore not self-contained, which is the one promise a native container makes: move the .mobix to another folder, or hand it to another device, and the recording is gone while the strokes still point at it. The desktop plugin already expects better (plugins/mobix-importer/README.md speaks of bundled audio entries mapped to companion .wav sidecars). Add an audio kind to MobixFormat.AssetKind and feed the recording through the same MobixAssetSink the pictures use, named by the hash of its bytes, so the archive holds one entry per distinct recording however many strokes reference it; on open, adopt bundled audio into the local audio store the way adoptBundledBackgrounds already adopts bundled backgrounds, and keep the sidecar path working for .xopp and for a document whose audio is external. Verify: record audio into a .mobix, move that file to an empty folder with no .wav beside it, and playback still works with fn and ts intact; a .xopp exported from it still names its sidecar reference; the container holds exactly one entry for one recording. Reconcile the plugin expected entry name with the name the app actually writes (it says .opus, the app records WAV) in the same commit, or record the mismatch as a known gap. Landed: a `fn`-linked recording the app's own audio store holds is now **bundled** into the `.mobix` by content hash — `MobixElementCodec.encodeStroke` registers it through `MobixAssetSink` under `AssetKind.AUDIO`, and `MobixAssetSink.suffixFor` names the container the bytes are actually in (`RIFF`/`WAVE` -> `wav`; the app's recorder writes WAV, so that is the real extension and no `.opus` guess is made). The stroke's `audioRef` now keeps the two names apart: `filename` is the sidecar it replayed from — which the `.xopp` export still names, pushing the copy out beside the file — and `assetId` is the entry the bytes live in, carried in the model as `Stroke.bundledAudio` (mirroring `Background.bundledAsset`) so a rewrite from the model cannot orphan the entry. `io/BundledPageAssets.kt` (renamed from BundledBackgrounds) adopts a page's recording when that page is read, through the new `BundledAudio` seam implemented by `AudioSession`: the bytes land in the audio store under the sidecar name the stroke carries, so playback needs nothing beside the file. `DocumentIo.encode` takes a recording lookup and `DocumentIo` a `BundledAudio` adopter; `MainActivity` supplies both, and a `.mobix` save no longer asks for an audio folder or pushes sidecars out (the file is self-contained). Plugin reconciled: `plugins/mobix-importer/main.lua` prefers `filename`, drops the `.opus` -> `.wav` guess, and its README documents the bundle. VERIFIED: 1450 unit tests / 0 failures (`MobixAudioBundleTest`: two strokes over one recording are one entry, the entry name is the hash of the bytes, the sidecar and the entry survive a save-and-open, and a repack over the file the document came from keeps the recording's bytes exactly), assembleDebug green. CAVEAT: the on-device round trip the task asks for (record audio into a `.mobix`, move the file to an empty folder, replay) is UNRUN — no /data/android toolchain, no adb, no AVD here; the check is added to verify-the-paged-mobix-open-and-canvas-on-the-emulator. KNOWN GAP recorded rather than fixed: a save with no source archive (Save As) can still drop a payload no store ever adopted, for recordings exactly as for pictures (supply-a-deferred-payload-on-a-save-that-has-no-source), and an Opus/ogg recording bundled by another writer is carried as it is but not transcoded (record-and-bundle-opus-audio is the task for that)."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-14
completed = 2026-10-15
tags = ["mobix", "audio"]

[[task]]
id = "merge-a-mobix-from-the-manifest-parts"
