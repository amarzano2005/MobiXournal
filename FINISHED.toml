[[task]]
id = "desktop-page-list-drag-and-range-management"
title = "Desktop: drag thumbnails to reorder, and move or delete a range of pages"
description = "The page list now changes in bulk, two ways. **Drag**: a thumbnail dragged onto another row moves it there (PageDragHandle + pure PageReorder.target/scrollStep; the drop target is recomputed from the rows on screen, so the list scrolling under a pointer held against an edge keeps the drop honest, PageDragMetrics 56dp edge / 10dp a frame). The dragged row lifts to the active slot and the destination wears a 2dp accent line; a plain click still selects (row is clickable including its padding). **Manage pages…**: a ninth row in the Pages menu opens a floating panel (PageRangePanel + PageRangeHost, PanelButton's new destructive tone in the document red) with pages from/to and 'start them on page', the panel's refusals stated under the fields (whole document, out-of-range, run's last before its first, target inside the run) from pure PageRanges so the dead buttons and the commands agree. Commands: PageOps.moveRange in mobix-core (block lift + reinsert, no-op inside the run, clamping), DesktopPages.moveRange/deleteRange as one undo step each, the delete keeping the document's PDF reference via PdfPageReferences.keep, the view landing on the moved/removed position, and the panel closing on success. Verified: PageOpsTest 31 tests (4 new for moveRange), PageReorderTest 6, PageSidebarDragTest 2 (a real pointer drag commits exactly one move; a click selects and moves nothing), DesktopPageRangeTest 6 (opening proposal, range delete + undo, range move + undo, the two refusals, deleting a range over a PDF's reference keeps it and every page still draws, panel pixels: accent on Move, document red on Delete), DesktopPagesTest 8 for nine menu rows. Full :desktop:test 621 tests with the same 3 failures that reproduce on a clean HEAD here (DesktopMenuTest x2, 'a plain xopp names the PDF beside it'); guards DocsGuard/SourceStructure/DocClaims/CiCoverage green. Docs: docs/pages-and-paper.md, docs/desktop-workstation.md, README."
