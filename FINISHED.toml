title = "Desktop: marquee and lasso selection on the shared geometry"
description = "Marquee and lasso selection in the desktop window, on the tablet's own geometry. The shared maths moved to mobix-core: PageSelection (a traced Rect/Polygon region plus the ElementRefs it caught, with translate/scale/rotate that move region and elements together), SelectionEdit (move/scale/rotate/delete as page rewrites, one per committed gesture), and SelectionOps / Selection / FigureRedraw / TableElementFactory followed it out of the app module; VerticalSpaceOps keeps sharing the same ElementShift seam. The window keeps only the pointer half: DesktopSelection.kt (which handle a press grabbed, the corner scale factors about the opposite corner, the turn between two bearings with Shift snapping to 15 deg, the finished trace, and selectionToolOf), SelectionGesture.kt (the drag, recomputed from the grab-time page so it cannot compound) and SelectionOverlay.kt (the marching outline, four corner handles, the stem and ring above the box, and the region being traced). Marquee (S) and Lasso (V) share one slot; a press inside the live outline moves, a corner scales, the handle above turns; Delete/Backspace removes what is caught as one undo step through the new DesktopSelectionCommands.kt, and Esc drops the outline before it means anything else. A selection drag is not ink, so the pen's packets stand by (DesktopTool.inksByPackets stays false) and a stylus still reaches it; turning the page lets the selection go, because its refs name indexes of that page. The third select tool, Select background (flatten), is split out as desktop-region-copy-flattened because it needs the window's own clipboard. Structure: the erase-and-select shape of the canvas outgrew two budgets, so the shell's selection commands and the colour panel moved out (DesktopSelectionCommands.kt, ColourPanel.kt), PenPointer now carries the pen's five readings as one value (hover, atNanos, owns, grabLine, previewRegion) and the selection press is dispatched through selectionPress in SelectionGesture.kt - file and function ceilings back under SourceStructureTest with no new exemptions. Tests: DesktopSelectionTest (handle picking, the rotate handle grabbed first, corner scaling, the no-invert clamp, the snapped turn, an empty region leaving no selection, both marquee tools in one slot, a marquee drag catching a stroke and one undo taking the move back, Delete with and without a selection, and the lasso tracing a loop), plus :desktop:test and :mobix-core:test green. Docs: desktop-workstation.md gains \"Selecting, moving, resizing and turning\" and its \"what the window does not do\" list no longer claims there is no selection; docs/selection.md states the shared PageSelection/SelectionEdit seam; README's desktop section tells the reader how to pick things up and what each drag commits."
