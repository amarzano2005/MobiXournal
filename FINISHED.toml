[[task]]
id = "edit-a-page-the-lru-window-has-evicted"
title = "Edit a page the LRU window has evicted"
description = "Landed: render/PageWindow.kt is the editable window over a PageSource - a bounded read cache plus an overlay of edited pages that eviction never touches, with pin/unpin for a live gesture, dirtyIndices for the save, applyTo to write the edits into the document touching only the edited pages, and revert/reset for undo. render/PageWindowEdits.kt is the canvas seam (windowEditPage materialises the page it touches first and keeps the result; resetPageWindow on a wholesale swap), PageCommands.editVisiblePage and DrawingSurfaceStrokes.appendStroke/eraseOnPage go through it, and undo/redo/load/mirror/pages-list reset it. The element ops gained one-page cores (ElementEdits.addElementOn/replaceElementOn; SelectionOps.deleteOn/addToTopLayerOn/moveOnto) so a caller that knows the page never walks the document - replacePlotElement (when the plot is selected), the plot slider and TextEditController (which now remembers its target's page) use them. PageWindowTest pins it on a synthetic 200-page .mobix: an edit on page 151 with only pages 0..4 in hand opens exactly that page, delete/insert/move on page 151 leave 0..4 unchanged, the edit survives the page leaving the read cache, undo/redo restore and reapply it, applyTo carries every other page through by reference, and a pinned page is not evictable. VERIFIED: 1425 unit tests / 0 failures, assembleDebug green. CAVEAT: the editor still hands the canvas an in-memory document, so on device the window wraps that list and the dirty set is not yet consumed by the incremental saver - both arrive with carry-the-page-source-into-the-editor and the save half of repack-only-the-pages-a-save-changed."
