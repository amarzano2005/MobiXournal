id = "desktop-record-the-page-as-a-skia-picture-so-a-frame-fits-144-hz"
title = "Desktop: record the page as a Skia picture so a frame fits 144 Hz"
description = "Desktop/src/main/java/com/mobixournal/desktop/PagePicture.kt records drawPageContent into a Skia Picture once per viewport (keyed on page, viewport offset, zoom, density, canvas size, backdrop and hidden layers), replays it with nativeCanvas.drawPicture in every frame, and closes it with the page through a DisposableEffect in PageCanvas; paintSheet calls it in place of the direct drawPageContent. Measured with --probe-ink plus the watchdog's new paint timer on udiff.xopp, same host and page: 3.8 ms mean / 8.8-10.2 ms worst for the direct paint versus 0.1-0.3 ms mean / 1.0 ms worst for the replay, i.e. inside the 6.9 ms frame budget of 144 Hz; probe latency median 12.45 ms (from 12.79). PagePictureTest pins pixel identity with the direct paint (text included), one record per still viewport, one more per scroll and one replay per frame. DesktopDiagnostics.painted() now takes the paint's duration and logs paint=mean/worst ms, because that is the number the frame budget is about. Docs: docs/desktop-tablet.md. Deliberately not done: dirty-rect pacing for scrolling and zooming (re-recording per frame stays, filed as desktop-dirty-rect-pacing-for-scrolling-and-zooming) and stroke-head prediction (filed as desktop-predict-the-stroke-head-to-hide-the-frame-s-latency)."
