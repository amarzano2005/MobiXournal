[[task]]
id = "desktop-pdf-import-command-and-modes"
title = "Desktop: Import PDF command, its REPLACE/APPEND question and the two outcomes"
description = "Shipped the command end to end. `DesktopPdfImportCommands.kt` holds `ImportPdfRequest(file, pageCount, mode = APPEND)` and the state commands `askImportPdf` (reads the page count first and refuses an unreadable PDF into the failure card), `cancelImportPdf`, `confirmImportPdf(mode)` and `importPdf(file, mode)`: **APPEND** records one snapshot, appends through `PageOps.appendPages` (a lone untouched blank sheet is dropped, the tablet's rule), replaces the page list, records the undo step, drops the page thumbnails and lands the reader on the first arriving page; **REPLACE** adopts a new, unsaved, dirty tab holding the PDF's pages, named after the PDF with the settings' container suffix in the PDF's own folder (never over an existing file or an open tab). `ImportPdfDialog.kt` is the question card — the floating glass, the file and its page count, *Add the pages to this document* / *Replace this document* with the accent and the picked mark, Cancel and Import — hosted by `ImportPdfHost` in `DesktopShellView`. The menu's `Import PDF` row sits above the two export chips (a document command, not an export), threaded through `MenuPanel`, `HeaderMenu`, `Header`, `DesktopShell` and `DesktopApp`'s new `DocumentDialogs.importPdf()` (a native picker filtered on `.pdf`). Verified by `DesktopPdfImportCommandsTest`: replace keeps the open document and its tab and adds one tab with the PDF's pages, dirty, named beside the PDF; add on a new document gives exactly the PDF's page count (the blank sheet is gone), lands on page 0 and one `undo()` returns to one page; add onto a document continues after its last page and lands on the first arriving one; a PDF that cannot be read changes nothing and puts \"This PDF could not be imported\" in the failure card. Docs: `docs/desktop-workstation.md` (a bullet under what the window does), `README.md` (the desktop bullets). No new `ShellCommand` and no key, by the `onExportSvg` precedent."
