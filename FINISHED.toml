id = "harden-tab-snapshot-integrity-on-session-restore"
title = "Harden tab-snapshot integrity on session restore"
description = "Fix the blank-page-on-reopen data loss: TabStore now writes each snapshot atomically (tmp + rename) so a kill mid-write can't truncate it; TabStore.save and MainActivity.snapshotActiveTab skip a tab that is still OpenTab.opening (a slow remote/cloud fetch whose placeholder sits on the strip while the canvas shows the previous tab); and TabStore.hydrate leaves a tab unhydrated when its snapshot exists but won't parse, so the unreadable bytes are never overwritten by the blank stand-in (MainActivity.show now tells the user instead). New tests in TabStoreTest."
