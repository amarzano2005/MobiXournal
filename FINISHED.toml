[[task]]
id = "materialise-only-the-visible-pages-in-the-canvas"
title = "Materialise only the visible pages in the canvas"
description = "The canvas now reads every page it draws or hit-tests through the page source. format/mobix/PageSource.kt gains pageSize(i), cheap for a .mobix (canvas.json declares the paginated page size) and materialising for an in-memory list; render/PageStacker.kt lays a PageSource out from those sizes and its PageBox resolves its page through the source only when a box is drawn (render/CanvasPageSource.kt backs the canvas with the in-memory document); DrawingSurfaceView, DrawingSurfacePaint, DrawingSurfaceSelection, SelectionGestureController and the other canvas read/hit-test sites route through pageAt(i), and relayout() stacks the source. CanvasPageWindowTest pins it: a synthetic 200-page .mobix stacks with zero page entries opened and drawing box 150 opens exactly page_151.json (assertSame on the second read), geometry identical to the in-memory stack, and a .xopp/new document returns the same page objects. REMAINING: (1) the editor still hands the canvas an in-memory document, so on device the source is that list and nothing is deferred - the reader-backed source arrives with carry-the-page-source-into-the-editor, and an edit on an evicted page is edit-a-page-the-lru-window-has-evicted; (2) the emulator pass (open a 200-page .mobix, scroll page 1 to 200, screenshot each end, clean logcat) is UNRUN - this host has no /data/android toolchain and no reachable emulator or device. REMAINING (1) LANDED with carry-the-page-source-into-the-editor: the editor now hands the canvas a reader-backed document, so on device the source answers from the manifest and materialises only the page it draws. REMAINING (2), the emulator pass, is split out into verify-the-paged-mobix-open-and-canvas-on-the-emulator (no /data/android toolchain, no adb on this host)."
status = "finished"
level = "task"
category = "feature"
created = 2026-10-14
