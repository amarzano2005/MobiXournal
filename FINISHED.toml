[[task]]
id = "keep-the-page-window-following-every-page-write"
title = "Keep the page window following every page write"
description = "The page window (render/PageWindow.kt) is a view of the document, but only edits that go through windowEditPage kept it in step: an element placement (commitTableInsertion, commitCircuitInsertion, insertPlotElement, text/LaTeX), a parameter slider's drag and an element swap all write the page straight into Document.pages, leaving the window's overlay (and its read cache, which a board fills) describing the page they replaced. The next gesture through the window rebuilt the page from that stale copy and silently dropped the write. Reported symptoms: a circuit attached to a wire vanished as soon as the pen touched the page, a table cell edit looked like it did nothing, and a plot edit 'sometimes' landed. Fix: PageWindow.followDocument(pages) re-points the overlay/cache at the document's current pages (and drops indices the document no longer has), called from the DrawingSurfaceView.doc setter via syncPageWindow (render/PageWindowEdits.kt) so every write is safe whether or not its author knew about the window. Verified by PageWindowTest (a placed circuit surviving the following stroke, a table cell edit landing after a straight placement, followDocument leaving untouched pages in hand) plus the full JVM suite; docs/data-path.md (The page window) states the contract."
