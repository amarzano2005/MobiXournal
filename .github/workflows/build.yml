name: Android & desktop CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check the task list and the release tooling
        run: |
          python3 scripts/todo/todo.py validate
          python3 scripts/todo/test_store.py
          python3 scripts/todo/test_done.py
          python3 scripts/todo/test_design.py
          python3 scripts/todo/test_release.py

      - name: Verify the release was frozen
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/todo/todo.py verify-release --version "${{ github.ref_name }}"

      # Docs are part of the change (`docs/doc-governance.md`), and their guards live in the app's unit
      # test source set. Running them first means a broken link, an unindexed page or a module the build
      # no longer has fails under a step named for it, instead of inside the full suite's output.
      - name: Check the documentation
        run: >
          ./gradlew :app:testDebugUnitTest
          --tests "com.mobixournal.guards.DocsGuardTest"
          --tests "com.mobixournal.guards.DocClaimsTest"
          --stacktrace

      # `testDebugUnitTest` is a task only the Android module has, so naming it alone ran that
      # module's suite and nothing else: the `.xopp`/`.mobix` codecs, the model and `FormatDriftTest`
      # live in `mobix-core`, which has a plain JVM `test` task. Both are named here, and
      # `CiCoverageTest` fails the build if a module that carries tests is left out of this line.
      - name: Run the app and core suites
        run: ./gradlew :app:testDebugUnitTest :mobix-core:test --stacktrace

      # The instrumented suite is **compiled** here, not run: no runner in this workflow carries a
      # device. `app/src/androidTest` is the half of the suite that only a device can execute, so it
      # compiled against whatever the canvas happened to have at the time — twice in one refactor
      # series it stopped compiling and every step stayed green, because only `src/test` is ever named
      # by a suite task. Naming the compile task makes that a failed build instead of a silence.
      - name: Compile the instrumented tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Build signed Release APK
        run: sh scripts/release-apk.sh

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobixournal-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: docs/releases/${{ github.ref_name }}.md

  # The desktop shell is Windows 11 only (`docs/desktop-workstation.md`), so its suite runs on a
  # Windows runner instead of the Ubuntu one above. It is a separate job rather than a step because
  # `:desktop:test` renders pages and chrome headlessly through Skiko, and that work must not gate or
  # slow the APK job; the PNGs it writes are uploaded so a reviewer can look at the chrome a run
  # produced instead of trusting a byte count.
  desktop:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run the desktop suite
        run: .\gradlew.bat :desktop:test --stacktrace

      # The MSI is linked with WiX. The image ships WiX 3.14 but names it only in `WIX`, and the script
      # looks for candle/light/heat on PATH, so the folder is added here before the one command that
      # builds the installer (`docs/tools.md`, *Desktop installer*).
      #
      # Signing material comes from the repository's secrets; with none of them the script builds an
      # unsigned MSI and says so, so a fork without a certificate still gets an installer.
      - name: Build the MSI installer
        shell: pwsh
        env:
          MOBIX_SIGN_PFX_BASE64: ${{ secrets.MOBIX_SIGN_PFX_BASE64 }}
          MOBIX_SIGN_PFX_PASSWORD: ${{ secrets.MOBIX_SIGN_PFX_PASSWORD }}
          MOBIX_SIGN_THUMBPRINT: ${{ secrets.MOBIX_SIGN_THUMBPRINT }}
          MOBIX_SIGN_TIMESTAMP: ${{ vars.MOBIX_SIGN_TIMESTAMP }}
        run: |
          if ($env:WIX) { $env:PATH = "$env:WIX\bin;$env:PATH" }
          ./scripts/desktop-package.ps1

      - name: Upload the MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: mobixournal-desktop-msi
          path: desktop/build/installer/*.msi
          if-no-files-found: error

      - name: Upload the headless renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-render
          path: desktop/build/desktop-render/
          if-no-files-found: warn

  # The window's installer joins the same release as the APK. A job of its own that needs both, so the
  # asset is attached after the APK job has created the release, and neither build waits for the other.
  release-msi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, desktop ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the MSI built on Windows
        uses: actions/download-artifact@v4
        with:
          name: mobixournal-desktop-msi
          path: msi

      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" msi/*.msi --clobber
