name: Android & desktop CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check the task list and the release tooling
        run: |
          python3 scripts/todo/todo.py validate
          python3 scripts/todo/test_store.py
          python3 scripts/todo/test_done.py
          python3 scripts/todo/test_release.py

      - name: Verify the release was frozen
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/todo/todo.py verify-release --version "${{ github.ref_name }}"

      # `testDebugUnitTest` is a task only the Android module has, so naming it alone ran that
      # module's suite and nothing else: the `.xopp`/`.mobix` codecs, the model and `FormatDriftTest`
      # live in `mobix-core`, which has a plain JVM `test` task. Both are named here, and
      # `CiCoverageTest` fails the build if a module that carries tests is left out of this line.
      - name: Run the app and core suites
        run: ./gradlew :app:testDebugUnitTest :mobix-core:test --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobixournal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: docs/releases/${{ github.ref_name }}.md

  # The desktop shell is Windows 11 only (`docs/desktop-workstation.md`), so its suite runs on a
  # Windows runner instead of the Ubuntu one above. It is a separate job rather than a step because
  # `:desktop:test` renders pages and chrome headlessly through Skiko, and that work must not gate or
  # slow the APK job; the PNGs it writes are uploaded so a reviewer can look at the chrome a run
  # produced instead of trusting a byte count.
  desktop:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run the desktop suite
        run: .\gradlew.bat :desktop:test --stacktrace

      - name: Upload the headless renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-render
          path: desktop/build/desktop-render/
          if-no-files-found: warn
