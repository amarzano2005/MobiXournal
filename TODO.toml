[[task]]
id = "desktop-document-search-results"
title = "Desktop: search the document lazily and keep the hits as tab state"
description = "A pure `DesktopSearch.kt` in `desktop/src/main/java/com/mobixournal/desktop/` that turns a query into hits through the shared `DocumentSearch` (task desktop-share-document-search) over the tab's **page window**: `DesktopDocument.window`/`PageSource` are read one page at a time, so a 200-page `.mobix` is searched without being inflated whole (the same seam `DesktopDocument.page` and `PageIndexScroll` use). Run the walk on `Dispatchers.Default` from the field's `LaunchedEffect`, cancel it with the next keystroke, and keep the answer as view state (`DesktopTab.search`: query, hits, current, total) so no save or undo ever sees it. The PDF half must use **each page's own `Background.Pdf.pageNo`**, never the document index: the window reorders pages (the tablet cannot), and `DocumentSearch.find` keys the PDF index by page index — pass a per-page view of `DesktopPdfIndex` (or a `pdfPageOf(index)` map built from `PdfPageReferences`) and pin it with a test where the PDF's page 2 sits at document index 3 and its words are still found. Navigation: `nextHit`/`previousHit` wrap around, `current` is one-based or zero when empty, each hit carries its page and a short snippet (from the matched text box's content, the math block's source or the PDF words), and a blank or one-character query answers an empty result instead of walking the document. Cache the last answer per (document edit count, query) so a repaint does not re-run the walk. Tests in `desktop/src/test/java/com/mobixournal/desktop/DesktopSearchTest.kt`: a text box, a math block's source, PDF words with the reordered page, a lazy `SyntheticNotebook` document whose pages are read on demand, wrapping next/previous, a blank query, and a cache hit that walks no page. Docs: `docs/desktop-workstation.md` (what search reads and what it deliberately does not — handwriting recognition remains tablet-only, since the window has no recogniser)."
