title = "Editable round-trip: restore an editable document from an exported PDF"
description = "Our own extension (Xournal++'s own PDF export is flattened and does NOT carry the notebook; confirmed 2026-10 review of xournalpp docs/issue #6086). Goal: exporting to PDF also embeds the source .xopp as a PDF attached file (PDFBox EmbeddedFiles / PDEmbeddedFile), and importing a PDF that carries one offers to restore it as the editable document instead of a flat background. Investigate: PDFBox-Android attachment write/read, detection on import, a consent prompt, and how a restore reconciles with an already-present annotation layer. Falls out of the 2026-10-10 vector-PDF lag report."
