title = "Desktop: the geometry slots draw line, arrow, axes, rectangle, ellipse and spline"
description = "Five of the window's fifteen slots - LINE, ARROW, RECTANGLE, ELLIPSE, SPLINE - do nothing: DesktopPen.kt's activeTool() answers ActiveTool.HAND for every slot it cannot draw, so a drag with the Line tool pans the page. The geometry is already pure and Android-free in mobix-core: render/ShapeBuilder.kt (enum ShapeKind with LINE, ARROW, DOUBLE_ARROW, COORDINATE_AXIS, RECTANGLE, ELLIPSE, SPLINE and the STEM set; build(kind, startX, startY, endX, endY, widthPt) answers the stroke's points), which the tablet's DrawingSurfaceStrokes already calls. Work: (1) a mapping beside inkTool() in DesktopPen.kt - shapeKind(): ShapeKind? for those five slots (and for DOUBLE_ARROW and COORDINATE_AXIS, which get their slots with this task so the geometry members the tablet's strip already has are reachable) - plus a pure drag helper, shapeFromDrag(kind, x0, y0, x1, y1, widthPt, constrained: Boolean), that snaps the end point to 45-degree steps when Shift is held and returns no points for a drag shorter than a few pt; (2) PageCanvasInput.kt: when the picked slot has a shape kind, a primary press records the origin page point (pagePointOf, the same arithmetic the pen uses), each MOVE rebuilds the points and paints them as the live preview in the same draft list paintSheet already draws, Escape cancels, and the lift commits exactly ONE Stroke on the active layer through the same tab.document.editPage/record/onEdited path the pen uses, uniformWidth = true, at ink.colour and ink.width; (3) make the packet path stand aside for a shape slot: a pen contact on the glass with Line picked must not draw ink while a drag becomes a line - the simplest honest rule is that with a shape slot picked the packets do not start a stroke (PenPacketStroke is only composed/subscribed for the pen slots), and that rule is stated in the doc and tested; (4) tests: a JVM test of shapeFromDrag (Shift constraint, degenerate drag, each kind's point count) beside DesktopPenTest, and an ImageComposeScene 