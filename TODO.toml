# TODO — active task list for MobiXournal.
#
# Single source of truth for active work (see AGENTS.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "AGENTS.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id> --shipped` to move it to FINISHED.toml; the archive records what the task delivered (files, behaviour, tests, docs, and what it deliberately did not do), not the plan it was picked up from."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are. The writing rules are `docs/writing-docs.md`'s, and its Definition of Done is the bar."
scope = "Only build features the .mobix or .xopp formats can represent on disk (per AGENTS.md and docs/mobix-format.md). If a capability cannot round-trip through either format, it is out of scope."

[[task]]
id = "mobix-capability-warning-surface"
title = "Tell the reader what a file requires, on both shells"
description = """
Surface the verdict from `mobix-capability-reader-gate` in the two shells. This is the task that makes the contract visible; the outcome itself is decided in `mobix-core`, never in the UI.

Files: `mobix-core`'s `MobixOpenVerdict` reason string; the Android open path beside `app/src/main/java/com/mobixournal/ui/NewerAppConsentDialog.kt` (it already handles the `minAppVersion` case) and the desktop window's open-failure/notice surface in `desktop/src/main`.

Behaviour:
1. `RefuseWrite` and `ReadOnlyDisplay` show one notice naming the feature(s) the file requires and exactly what is disabled ("This notebook needs … It opens read-only: drawing, Save and Save As are unavailable."). English copy, no class names. `RefuseWrite` may show the pages but must disable every write affordance.
2. `PreservedButNotDrawn` is a one-line status, not a dialog: the document is editable and the affected elements are untouched.
3. Bind the disables to the verdict itself (one source), so a promise in the copy cannot drift from the state.
4. Follow `docs/interface-contract.md` in full — material class, tokens only, a catalogue glyph, all five states, both shells agreeing — and record the declaration with `todo.py done --design` when the task closes.

Verification: JVM tests for the copy and for the disabled actions driven by a fake verdict (both shells' existing dialog/settings tests are the model); a Compose test asserting the notice's text changes nothing about a document's model. Update `docs/guide-troubleshooting.md` (the reader-facing failure path) and the owning spoke in the same commit. Run `./gradlew :mobix-core:test :app:testDebugUnitTest :desktop:test`."""
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 33
created = 2026-11-10
