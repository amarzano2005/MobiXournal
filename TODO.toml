[[task]]
id = "stem-scalar-evaluator"
title = "A bounded scalar evaluator with no globals and a hard operation budget"
description = "A pure scalar evaluator in mobix-core, used by the calculation element and by nothing else. Grammar: decimal and scientific literals, + - * / ^, unary minus, parentheses, a whitelist of functions (sqrt, abs, sin, cos, tan, ln, log, exp, min, max, round, floor, ceil) and the constants pi and e. No variables, no assignments, no user-defined functions: a name that is not a known constant or function is an error, never a global. Bound it with an operation budget per evaluation, a wall-clock budget, a nesting limit and a limit on the source length, so a hostile or fat-fingered string cannot hang a save or a repaint. Results are a typed outcome - a Double, a division-by-zero cause, a domain error (sqrt(-1), ln(0)), an overflow - never NaN or Infinity, with the display rounding and the precision it rounded to. Report the normalised source so a reader sees exactly what was evaluated. Unit-test the matrix, including 2*(3+4)=14, 1/0 diagnosed, 0^0, (-8)^(1/3) and both budgets."
