[[task]]
id = "mobix-zip64-review"
title = "Decide whether ZIP64 is needed now or stays deferred"
description = """
The incremental raw writer is deliberately limited to classic ZIP (no ZIP64) and only supports STORED/DEFLATED for raw copy; the standard path may fall back. Whether a real document can hit those limits is unknown, so the current behaviour on a very large file is neither documented nor tested.

Establish the real numbers first: page counts, entry counts and total sizes reachable with 120-minute audio, large PDF backgrounds and heavy multi-page notebooks. Then determine what actually happens today at the boundary - clean fallback, refusal, or silent truncation - and test it. If ZIP64 is needed, scope the raw-copy writer extension, reader support, and interop with the third-party CLI; if it is not, record the deferral with the size budget that would trigger it.

DoD: a written decision with the size evidence and a regression test at the boundary; child tasks only if a real workload needs them. Dependency: the baseline and large-file fixtures."""
