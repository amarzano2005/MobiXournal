[[task]]
id = "desktop-guides-overlay-and-readout"
title = "Desktop guides: the overlay, the angle readout and the snap marker"
description = "The instrument has to be visible and to say what angle it is holding. (1) Paint it in `paintLiveOverlay` (`desktop/src/main/java/com/mobixournal/desktop/PageCanvasOverlay.kt`), in page space at `pxPerPt`, above the ink and outside any recorded sheet: the setsquare's three corners (`DrawingGuide.Setsquare.corners()`) as a faint fill under a solid outline with a grab dot at the tip, the compass's circle (`radius`) with a hub dot - the two pictures the tablet paints in `drawGuide` (`app/src/main/java/com/mobixournal/render/DrawingSurfacePaint.kt`), at the window's own sizes. (2) One home for the instrument's colour: hoist the tablet's `CanvasChrome.GUIDE_COLOR` (0xFFE08A20) and `GUIDE_FILL_ALPHA` into `mobix-core/src/main/java/com/mobixournal/design/DesignTokens.kt` as `GUIDE_RGB`/`GUIDE_FILL_ALPHA`, point `CanvasChrome`'s defaults at them and add `DesktopTheme.guide`/`guideFill` reading the same numbers, with `DesktopThemeTest` re-reading the token (its existing token assertions' pattern) so the two shells cannot drift; `docs/colours.md`'s amber row names that one home. No literals in the overlay. (3) The readout: while the guide is being re-posed, a small glass pill follows the tip and shows the aim - a pure `guideAimLabel(radians: Double): String` in `DesktopGuides.kt` answering whole degrees folded into 0..359 with a degree sign (\"45°\", \"0°\"), with a unit test - and while Shift holds the aim on a step of `Snapping.snapAngle` a tick is drawn across the aim at the tip: that tick is the snap marker. The pill is a `FloatingSurface` wearing `DesktopTheme` tokens and English copy (a number, no sentence), hidden while nothing is being posed, live while the drag runs, marked while the angle is snapped; the slot's own five states belong to `desktop-guides-slot-and-chooser`. Tests: `DesktopGuideRenderTest` - an `ImageComposeScene` of a page with a placed setsquare writes `desktop/build/desktop-render/guide.png` and asserts the outline's pixels are the token's colour over the sheet, that the page still holds no element (the overlay is chrome), that the readout pill's fill differs from the sheet's, and that the compass's circle renders through the same path; plus `guideAimLabel` cases (0, PI/4 -> \"45°\", 359.6 degrees -> \"0°\", a negative angle folded up). Verification: `gradlew.bat :desktop:test :mobix-core:test :app:testDebugUnitTest` on JDK 21. Docs: `docs/drawing-tools.md` (the guides section now says the window draws them), `docs/colours.md`, `docs/desktop-workstation.md`'s tool list, README. Regenerate the packaged window before closing."
