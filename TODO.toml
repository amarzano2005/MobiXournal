[[task]]
id = "desktop-pdf-text-and-outline-index"
title = "Desktop PDF: extract the text layer and the Contents outline on the JVM"
description = "Add the window's twins of the app's extractors, over `org.apache.pdfbox` instead of `pdfbox-android` (the precedent is `DesktopPdfMerge` beside `PdfMerger`): `DesktopPdfText` builds the shared `PdfTextIndex` from a `PDFTextStripper` subclass that turns each `TextPosition` into a `CharBox` and hands the run to `PdfWordGrouper`, with the app's exact box convention (`xDirAdj` is the left, `yDirAdj` is the glyph's BOTTOM, so `top = bottom - heightDir`; reading `yDirAdj` as the top drops every word a line); `DesktopPdfOutline` walks `PDOutlineItem.findDestinationPage` into `PdfOutlineTree.flatten` with the app's visited set and node ceiling against a cyclic tree. One `PDDocument.load` per file serves both walks, and `DesktopPdfIndexCache` keys the pair by the resolved `PdfPageReferences` reference plus the file length, soft-referenced like `PdfTextIndexCache`, with a `forget` the save, Save-As, merge and re-import paths call (`DesktopSaves`, `DesktopPdfImportCommands`) so a stale index cannot outlive its bytes. Both are computed off the UI thread (`LaunchedEffect` + `withContext(Dispatchers.Default)`) and published into per-document state the canvas and the sidebar read, so opening a 200-page PDF stalls no frame; a scanned, corrupt or missing PDF answers an empty index and an empty outline instead of throwing. Verify with fixture PDFs built by PDFBox in the test (as `DesktopPdfImportTest` and `DesktopPdfPageListTest` do): a word's box to the point, a nested outline's flattened rows, a text-only PDF's empty outline, a corrupt file's empty answer, and a second ask served from the cache."
