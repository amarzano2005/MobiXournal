[[task]]
id = "reconcile-a-restored-xopp-with-the-pdf-that-carried-it"
title = "Reconcile a restored .xopp with the PDF that carried it"
description = "What a restored notebook does with the PDF it was embedded in, and what its background becomes. Rule to implement: the embedded .xopp is the source of truth, so its pages, layers and strokes replace the flat pages and any ink the PDF carried in its own content stream is discarded along with the flat view (declining the restore is always available, and that path is unchanged). The restored document must not come back with a missing background: keep the background reference it was saved with, and when that reference cannot be resolved, adopt the very PDF it was embedded in as the documents local background copy (io/DocumentIo.adoptPdf) so its pages still draw and the file still round-trips. Cover both paths with unit tests around the import entry point: restore accepted with the embedding PDF available, and restore accepted with the referenced background PDF missing from disk. Record the rule in docs/pdf.md in the PDF section."
