[[task]]
id = "desktop-audio-opus-via-concentus"
title = "Desktop: Opus through Concentus and our own Ogg framing"
description = "Recorded decision (2026-10-29, this task implements it): the window takes WAV from javax.sound.sampled and Opus from io.github.jaredmdobson:concentus 1.0.2 - a pure Java encoder and decoder on Maven Central, so there is no native binary to ship in the MSI and nothing to load at runtime - plus an Ogg layer of our own, because Concentus deliberately contains no container code. Work: (1) add concentus to gradle/libs.versions.toml ([versions] and [libraries], the way jna is declared) and implementation(libs.concentus) to desktop/build.gradle.kts. (2) mobix-core/src/main/java/com/mobixournal/format/audio/OggOpus.kt - an Ogg page writer and reader: capture pattern OggS, segment table, CRC32 with the Ogg polynomial 0x04c11db7, granule position, the OpusHead and OpusTags identification packets, 48 kHz mono, 20 ms frames, one logical stream. It must write the container Android's OpusAudioRecorder writes and read one that writer (or any writer) produced, so a recording captured on either shell is the same asset: encode(pcm, out) and a reader that yields the packets of the first logical stream. (3) The decode side: packets plus a Concentus OpusDecoder produce 48 kHz mono PCM. The container a file holds is already answered by MobixAssetSink.suffixFor (wav/ogg/m4a). (4) An .m4a/AAC recording from a tablet is NOT playable here: a plain JVM carries no AAC decoder and Concentus is Opus-only, so the player says so in one English sentence instead of pretending - no transcode and no rename, the same rule docs/audio-inking-sync.md states for the export path. Tests in mobix-core: one second of a 48 kHz sine survives encode, page, read and decode within a stated tolerance and keeps its sample count; a hand-built page and a fixture .ogg parse to the packets they were built from; a truncated page and a corrupt CRC are refused rather than decoded as noise. Docs: docs/audio.md (the desktop codec row), docs/audio-inking-sync.md (the container sentence), README's desktop paragraph. Verify :mobix-core:test :desktop:test, then createDistributable and open the packaged window - the point of this decision is that it starts with no native library to find."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
