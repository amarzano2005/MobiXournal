[[task]]
id = "stem-scientific-text"
title = "A mixed text-and-formula box with shared baseline (F10)"
description = """
Text and maths cannot be combined: `MathBlockElement` is a block of LaTeX and `TextElement` is plain text, so 'the energy is E=mc²' is either two objects that drift apart or an image. A mixed run model is the missing piece for scientific notes.

User story: write a paragraph, insert an inline formula, keep selection and baseline coherent, reconvert a formula to its source and back, edit with the on-screen keyboard without it covering the field, and save/reopen with the maths intact.

Design a box with paragraphs of immutable, versioned runs (`text` | `math` with `flavor` LATEX and a preserved Typst source that is only rendered when a typesetter exists), a testable layout engine in core, selection, IME and undo. Reuse `LatexParser`, `LatexLayout` and `MathBlockElement` - no second LaTeX parser and no second PDF renderer for the same formula. Global reflow across pages and inline tables are a later phase, explicitly out of this scope, and so is pretending Typst source means Typst rendering.

Child tasks: S1 run model + codec + fixture; S2 layout and rendering in `LivingInk`; S3 editing, IME and selection; S4 PDF Unicode and `.xopp` fallback; S5 UI entry point on both shells. Acceptance: a paragraph with `E=mc^2` saved and reopened byte-stable, copy/search across runs works, selection and undo behave, PDF selectable where the font family allows, `.xopp` degrades visibly. Dependency: `stem-code-block` (shared text infrastructure), `stem-unicode-pdf-review`, the new-type gate."""
