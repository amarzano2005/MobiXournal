title = "Carry the audio recording inside the .mobix container"
description = "A stroke already records its audio in a .mobix - format/mobix/MobixElementCodec.kt writes audioRef.assetId from the .xopp fn and audioRef.startMs from ts - but the sound itself never enters the archive: MobixDocument.of is handed only backgroundBytes (PDF and pixmap) and io/DocumentIo.kt supplies nothing else, so audio/AudioStore.kt .wav stays a sidecar beside the document. The file is therefore not self-contained, which is the one promise a native container makes: move the .mobix to another folder, or hand it to another device, and the recording is gone while the strokes still point at it. The desktop plugin already expects better (plugins/mobix-importer/README.md speaks of bundled audio entries mapped to companion .wav sidecars). Add an audio kind to MobixFormat.AssetKind and feed the recording through the same MobixAssetSink the pictures use, named by the hash of its bytes, so the archive holds one entry per distinct recording however many strokes reference it; on open, adopt bundled audio into the local audio store the way adoptBundledBackgrounds already adopts bundled backgrounds, and keep the sidecar path working for .xopp and for a document whose audio is external. Verify: record audio into a .mobix, move that file to an empty folder with no .wav beside it, and playback still works with fn and ts intact; a .xopp exported from it still names its sidecar reference; the container holds exactly one entry for one recording. Reconcile the plugin expected entry name with the name the app actually writes (it says .opus, the app records WAV) in the same commit, or record the mismatch as a known gap."
