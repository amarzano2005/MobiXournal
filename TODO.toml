# TODO — active task list for MobiXournal.
#
# Single source of truth for active work (see AGENTS.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "AGENTS.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "give-the-dc-source-its-polarity-marks-on-canvas"
title = "Give the DC source its polarity marks on canvas"
description = "The DC voltage source's drawn symbol is two plain plates (long positive, short negative), while its rail glyph (DcSourceIcon) also shows a '+' above the positive lead and a thick short negative plate. Add the matching cues to CircuitShapes.dcSource in app/src/main/java/com/mobixournal/render/CircuitShapes.kt: emit the '+' as its own small two-segment stroke above the lead (like the op-amp's plus in opAmp), so the extra cue costs no extra width; the thick negative plate would need a per-point width on stroke 2, which currently breaks the 'all points carry the same widthPt' contract in ShapeBuilder, so leave the plate thin unless that contract is revisited. Verify with app/src/test/java/com/mobixournal/render/CircuitShapesTest.kt: buildMulti(DC_SOURCE) should then return 3 strokes and the '+' must sit above the positive (left) plate clear of the lead wire. Update the active-circuits bullet in README.md in the same commit."
status = "active"
level = "task"
category = "feature"
urgency = "low"
order = 10
created = 2026-10-07
tags = []
rebuild = true
emulator_debug = false
