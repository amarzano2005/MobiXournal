[[task]]
id = "mobix-bridge-metadata-block"
title = "The .xopp bridge metadata block and its verification rule"
description = "Carry living-element semantics through a .xopp export so it can be re-imported, per docs/mobix-format.md. Write a mobix:meta block holding the living elements plus, for each, the SHA-256 of the strokes it was synthesized into. Two hazards the implementation must handle: an XML comment cannot contain a double hyphen, so a formula, a label or a JSON string containing one is escaped on write and unescaped on read; and a round trip through desktop Xournal++ may drop the comment entirely. The block is therefore a claim to be verified and never truth: on import it is honoured only for elements whose referenced strokes are still present, byte-identical and unmodified, and everything else is discarded so the flattened geometry is read as ordinary ink. Verify with JVM tests: a double hyphen round-trips, edited strokes reject the metadata, intact strokes revive it, and a .xopp with no block imports unchanged."
