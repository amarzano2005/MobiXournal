# TODO — active task list for MobiXournal.
#
# Single source of truth for active work (see AGENTS.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "AGENTS.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id> --shipped` to move it to FINISHED.toml; the archive records what the task delivered (files, behaviour, tests, docs, and what it deliberately did not do), not the plan it was picked up from."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are. The writing rules are `docs/writing-docs.md`'s, and its Definition of Done is the bar."
scope = "Only build features the .mobix or .xopp formats can represent on disk (per AGENTS.md and docs/mobix-format.md). If a capability cannot round-trip through either format, it is out of scope."

[[task]]
id = "stem-persistent-connectors"
title = "Connectors that hold onto pins instead of coordinates (F11)"
description = """
`CircuitElement` exposes `CircuitPin(id, relX, relY, connectedTo)` and `CircuitSnapping` matches geometry, including wire ends, so a wire is a drawing rather than a connection: move the component and the electrical meaning is lost, and an incidental crossing is indistinguishable from a junction. No topology exists to check.

User story: place two resistors and a source, drag a wire between pins, move one component and the wire follows and still connects the same pins; a crossing is drawn but is not a junction unless marked; undo restores the whole drag as one step.

Design a new `connector` element: endpoints as `PinRef {elementId, pinId}` with fallback coordinates, route mode, waypoints, style. Keep routing strictly separate from connectivity, keep the net distinct from the drawn wire, define dangling-endpoint and unresolved-pin behaviour, and make the dependency index local so a drag never recomputes a whole page. Copy and merge must remap ids consistently.

Child tasks, in this order: M1 model + codec + JSON Schema + fixture (before any UI); M2 bounded orthogonal router with cache and an explicit junction marker; M3 drag UI on both shells with a single undo; M4 `.xopp` export as geometry with the semantics documented as `.mobix`-only; M5 net export consumed by `stem-netlist-spice-review`. Acceptance: a series R1/R2/V circuit keeps its connections through a component move, copy, reorder and save/reopen, and the file remains readable by a third-party validator. Dependency: `mobix-known-type-unknown-fields` and a minimum `mobix-capability-contract`."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 240
created = 2026-11-10
tags = ["stem", "circuit", "schema", "p1"]
rebuild = false
emulator_debug = false

[[task]]
id = "stem-numeric-reliability"
title = "Choose derivative/root/integral algorithms by accuracy, not by doc text"
description = """
The audit `stem-numeric-doc-code-audit` records what `FunctionAnalysis.kt` really does: fixed `H = 1e-5`, `bisectRoot` with a 24-iteration default, no error estimate and no stated accuracy. That is adequate for drawing a tangent and not adequate for a scientific result, and the plotting features about to ship depend on it.

Decide, with measurements: the derivative scheme (fixed vs adaptive step, higher-order stencil, safeguarded secant), the root and extremum solver (keep bisection, or a bracketing method with better convergence), the integrator, and how singularities and non-differentiable points are reported. Define accuracy metrics over a fixture set, error estimates, computational budgets and fallbacks when a result cannot be trusted. Keep the result honest: 'no root found in the scanned interval' is a valid answer, an invented one is not.

Respect the consumers: `PlotElement.summaryText` is derived, the analysis summary is cached, and `stem-plot-inspection` will surface these numbers to users. Never swap an algorithm without a precision/regression benchmark.

Child tasks: precise algorithm decisions per function, test corpus with tolerances, replacement of `FunctionAnalysis` internals behind the same public surface, and doc updates in `docs/math-engine.md`. DoD: a measured accuracy improvement (or a documented decision to keep the current scheme), with the audit's characterization tests updated deliberately. Dependency: `stem-numeric-doc-code-audit`."""
status = "active"
level = "scope"
category = "refactor"
urgency = "normal"
order = 250
created = 2026-11-10
tags = ["stem", "math", "p1"]
rebuild = false
emulator_debug = false

[[task]]
id = "stem-netlist-spice-review"
title = "From connectors to a checkable circuit: ERC and an SPICE subset (F12)"
description = """
Only worth doing after connectors are real. Once `stem-persistent-connectors` gives pins with identity, the electrical graph becomes derivable, and with it the questions a student actually asks: is anything floating, is ground missing, are two nets shorted, does this symbol even have a mapping?

Design: a deterministic `CircuitNetGraph` compiled from components plus connectors (with explicit junctions and labels), a bounded `CircuitERC` that flags floating pins, missing ground, duplicate net names, obvious shorts and incompatible terminals where the symbol's semantics allow the judgement, and a `SpiceExporter` for a documented subset (R, C, L, ideal sources). A symbol without a mapping must report `UNSUPPORTED` rather than an invented component. An ERC is not a physics validation and must say so. No internal simulator in this scope.

Child tasks: N1 net graph and stable net ids; N2 ERC rules with severities; N3 SPICE export plus fixture verification in an external tool; N4 UI surfacing of diagnostics; N5 spec and interop. Acceptance: the series R1/R2/V circuit exports a netlist that matches the hand-written reference, a floating pin and a missing ground are reported, and reordering/copying elements does not change the nets. Dependency: `stem-persistent-connectors` complete and tested."""
