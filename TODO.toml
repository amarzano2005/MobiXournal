[[task]]
id = "desktop-settings-interface-defaults"
title = "Desktop: Interface section - default fit, sidebar and inspector"
description = "The rest of the Interface page, the three defaults that decide how a document opens. Default fit (Fit page / Fit width / Free zoom), applied to a tab when it is opened in desktop/src/main/java/com/mobixournal/desktop/DesktopTabs.kt, where FitMode.AUTO is chosen today. Page sidebar policy (Automatic - the existing rule that shows the sidebar only for a document of more than one page, Always, Never), applied where DesktopShellState.sidebar resolves sidebarVisible through sidebar.shows(active). Inspector policy (Shown when it has an editor - what InspectorLane in desktop/src/main/java/com/mobixournal/desktop/InspectorPanel.kt does now, Always, Never). Persist as interface.fitOnOpen, interface.sidebarPolicy and interface.inspectorPolicy in DesktopSettings, each written through the Settings surface. A change to a view default applies to the open tabs at once; the default fit applies to the next document opened, and the row says so in one line. Tests: one state test per row proving the value survives a restart through a second DesktopSettings over the same file, and one shell test that a two-page document opens with the sidebar under Always while a one-page document does not under Automatic. Docs: docs/desktop-workstation.md (Interface)."
