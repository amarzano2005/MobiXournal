[[task]]
id = "desktop-audio-sidecars-and-bundling"
title = "Desktop: recordings travel with the document (sidecar and bundled)"
description = "A recording leaves with the document by the format's own rule, and the window has neither half. (1) Store: recordings live in %APPDATA%\\MobiXournal\\audio, beside desktop.properties (DesktopSettings.defaultFile), one bare file name each, copied as a stream - never a ByteArray, since MobixPayload.of(File) is the streaming seam. (2) .xopp: on open pull every name in documentAudioFiles(model) that sits beside the document into the store (the desktop can read siblings; there is no SAF grant to respect), and on save push every name the model references back out beside the target, so the fn in the file resolves to the file that is actually there; a name already present at the same length is not rewritten. (3) .mobix: bundle by passing audioFiles = { name -> store.file(name) } to the DocumentEncoder.write call in DesktopSaves.stage - the parameter already exists in mobix-core/io/DocumentEncoder.kt - so the archive carries assets/aud_<sha>.<ext> by content hash and one recording behind forty strokes is stored once. On open, adopt what the pages name: the desktop's version of app/io/BundledPageAssets.kt (which cannot move - it depends on the app's BackgroundResolver), at the .mobix open in DocumentLoader.openMobix where PageBackdrop already receives reader.assetSource - for each stroke carrying bundledAudio, copy the entry once per entry into the store under stroke.audioRef().filename, the name playback looks a recording up by. (4) A recording a document references and this machine does not have is reported once in English, naming the recordings - the window's answer to AudioSession.missingFor - not a silent silence and not a crash. Tests: a .xopp saved next to its sidecar reopens and finds it; a .mobix written with two strokes on one recording carries exactly one aud_ entry and reopens with the recording in the store; a document whose recording is gone opens with the report and no exception. Docs: docs/audio.md (sidecars on Windows), docs/desktop-documents.md (what a save writes), README. Verify :desktop:test :mobix-core:test and regenerate the distributable."
