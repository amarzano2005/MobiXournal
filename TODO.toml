title = "Repack only the .mobix pages a save changed"
description = "The saver is written and tested (format/mobix/MobixIncrementalSaver.kt, MobixIncrementalSaveTest) and no save path uses it: the MOBIX branch of io/DocumentIo.kt encode (around line 475) always calls MobixDocument.of(...).toBytes(), so every save re-compresses the whole archive - on a long notebook, a save that touched one page rewrites every page and the background PDF with it. Wire the incremental path: when the document was opened from a file whose bytes are still reachable (the staged copy io/UriStaging keeps, the source in io/SaveTarget.kt), repack through MobixIncrementalSaver, streaming the untouched entries from the source archive and writing only the manifest and the pages whose bytes changed, with the mimetype first and STORED as always; fall back to the full write whenever there is no source (a new document, a first save, a save to a new target), and never leave a half-written archive behind - every write already goes to a staging file first. Dirtiness comes from the manifest own sha256/modified fields, so the caller supplies the previous manifest and the new page bytes rather than a hand-maintained dirty flag. Verify with JVM tests: after editing one page of a ten-page document the untouched entries come out byte-identical to the source, the mimetype is still first and STORED, preserved unknown entries still survive, and the result read back through MobixDocument.open is equal to a full write of the same document. Measure and report the bytes written for the ten-page document with one dirty page against a full repack. Then check it on the emulator: open a .mobix, edit, save, close, reopen - the document is intact and nothing about it changed."
