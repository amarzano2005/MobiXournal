[[task]]
id = "draw-the-ring-and-summon-it-from-the-keyboard"
title = "Draw the ring and summon it from the keyboard"
description = "The window's half of `docs/ui-modernization.md` (*The pen-tip HUD*), reachable without hardware: the ring's state, its painter, and the keyboard/mouse door. (1) New pure file `desktop/src/main/java/com/mobixournal/desktop/sheet/DesktopHud.kt`: `internal data class DesktopHudState(cx, cy, active, picker)` plus `internal object DesktopHud` with `slots(palette, custom, widths, tools)` delegating to the shared `RadialHud.slots(...)`, `HUD_TOOLS = listOf(DesktopTool.PEN, DesktopTool.HIGHLIGHTER, DesktopTool.ERASER)`, `indexAt(state, x, y, count, density)` and `within(state, x, y, count, density)` (the ring-plus-air test that separates a tap aimed at the ring from a tap well outside it), both a thin dp->px shell over `RadialHud.slotIndexAt` and its constants. Compose-free, so the hit-testing is a JVM test. (2) `PageCanvas` owns the open ring (it is the surface the nib is over) and the shell owns the commit: `PageCanvas` gains `hudRequest: Int = 0` and `onHudPick: ((HudSlot) -> Unit)? = null`, keeps the open state in `PageCanvasMemory`/the canvas memory, and opens the ring in a `LaunchedEffect(hudRequest)` at the last reading of `PenPointer.hover` (the value `sheetMark` already uses; the canvas centre when the pointer has never been over the page). (3) The keyboard door: `ShellCommand.RADIAL_HUD` bound to `Alt+B` in `ShortcutTable.entries` (label \"Ring at the pen\"), handled in `DesktopShell.apply` by incrementing `hudRequest`; it is a **picker** (no held button to release), so a click on a slot commits, a click inside the ring but off a slot does nothing, a click well outside closes it, `Esc` closes it (inserted in `DesktopShell.onKey`'s `Esc` chain beside the group picker, ahead of the failure card), and a second `Alt+B` closes it too. A mouse has no barrel and the tertiary button already pans (`PageCanvasInput`), which is why this is a key. (4) The painter: new file `desktop/src/main/java/com/mobixournal/desktop/sheet/DesktopHudPaint.kt`, `internal fun DrawScope.drawRadialHud(open, slots, density)`, called after the sheet in `PageCanvas`'s canvas so it lies over the page. Material by the interface contract's **floating surface** class and tokens only: the disc in `DesktopTheme.floating`, the rim in `DesktopTheme.hairline`, one 40 dp face per slot at `RadialHud.RING_RADIUS_DP * density` through `RadialHud.slotCenter` — a swatch is its own ARGB with a 35 % rim (white would vanish on the glass), a width is a dot of that width, a tool is `drawToolGlyph(...)` from `settings/ToolGlyphs.kt` — the picked slot on `DesktopTheme.activeSlot` inside a 3 dp `accent` ring, and a 3 dp nib dot in `chromeInk`. No literal of any kind (`DesktopThemeTest` sweeps the chrome sources). (5) The commit is the strips' own path, never a second one: `DesktopWorkspace` passes an `onHudPick` that calls `state.pickColour(argb)`, `state.pickWidth(pt)` and `state.selectTool(...)` — the entries the rail and the flyouts use — fed `state.palette`, `state.paletteCustom`, `PenPalette.DEFAULT_WIDTHS` and `HUD_TOOLS`. (6) **The dial keeps its documented job**: a notch still zooms at the cursor, and the ring gives it no role (a second device for a pick the pen is already making). Record that decision where the ring is documented so it is not re-litigated. Verified: `DesktopHudTest` — the contents are the eight factory swatches, the three widths and the three tools in that order; a 24-swatch palette still caps the swatches; the custom slot is there; every member of `HUD_TOOLS` is in `DESKTOP_TOOLS_THAT_ACT`, so a tool that does not act is never offered; every slot centre maps back to its own slot; the boundaries, the seam, the dead zone and the off-band release answer null; the outside-tap rule. `DesktopHudRenderTest` on a headless `ImageComposeScene` over a page — closed paints nothing at the nib, open paints the glass disc and its rim, the swatch slot's centre pixel is the palette colour, and `state.apply(ShellCommand.RADIAL_HUD)` then a click on that swatch commits it (`state.ink.colour`) and closes the ring. `ShortcutTableTest` covers the `Alt+B` row and `Esc`'s order. `:desktop:test` and the guards green. Docs: `docs/desktop-ui-layout.md` gains the window's ring section (summon, dismissal, contents, material, the dial decision) and the shortcut row; `docs/interface-contract.md` gains the ring's line under *Floating surface* if it needs one; `docs/ui-modernization.md` links to it instead of repeating it; `README.md` gets the user's sentence. `rebuild = false` — the window only."
