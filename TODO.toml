The plotter can draw, analyse and shade, but reading a value means typing coordinates: there is no cursor that snaps to a curve, no tangent tool and no way to drag integral bounds and watch the value follow. The analysis code exists, the interaction layer does not.

User story: drag a crosshair over `x^2`, read `(x, y)` with scientific precision; drop a tangent at a point and see the slope, with a clear signal at a non-differentiable point; drag two handles to shade an integral and read its value without overwriting the function; compare several curves and read a shared table of values.

