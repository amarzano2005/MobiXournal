description = "Add the window Share menu: three actions in one glass menu, opened from a catalogue-glyph capsule on the band (disabled while no document is open). Files: a new desktop/src/main/java/com/mobixournal/desktop/shell/ShareMenu.kt with the panel and its rows; desktop/src/main/java/com/mobixournal/desktop/shell/Header.kt for the capsule; desktop/src/main/java/com/mobixournal/desktop/shell/DesktopShellView.kt to wire the three handlers. Rows: Show in Explorer (ProcessBuilder explorer.exe /select,<path>, refused with a sentence in the status band when the tab has no file yet), Copy path (the system clipboard through the same guarded route DesktopPdfTextSelection.copyText uses, answering Copied <path> in the status band, and a no-op rather than an exception on a headless toolkit) and Export (opens the existing ExportRequest Pdf, Svg and Png commands, so no export code is duplicated). Every row takes its glyph from ChromeGlyphCatalogue, its copy is English, and a row that cannot run is disabled rather than hidden (docs/interface-contract.md section 6). Verify: a headless render of the open menu plus unit tests on the three handlers for a saved and an unsaved tab (no Explorer process for an unsaved tab, no clipboard write when the toolkit is headless, the refusal sentence returned). Docs in the same commit: docs/desktop-workstation.md (the band commands) and README."
