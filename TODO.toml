[[task]]
id = "desktop-audio-replay"
title = "Desktop: audio recording, playback and karaoke replay (scope)"
description = "Priority 3 of the window, and an owner decision that has not changed: audio must work on the desktop, RECORDING INCLUDED (2026-10-21). Documents carry audio the window cannot yet handle: a .mobix bundles Opus, a .xopp has a WAV sidecar, and every stroke point records its own audio timestamp (docs/audio-inking-sync.md, docs/audio.md). This scope owns the whole audio lane, including the Y audio tap / replay key and the audio entry of the tool strip, so the tools-parity map points here instead of keeping a second copy of it. Investigate, then add the atomic tasks in this order: (1) recording on Windows through javax.sound.sampled (TargetDataLine) or a native alternative - microphone choice, the buffer that keeps latency low, and what happens when the device or the permission is missing (an English notice, never a crash or a silent no-op); (2) the codec policy the tablet already follows (WAV for a .xopp document, Opus for a .mobix) and what an Opus encoder costs on a JVM - a library or a native binary packaged with the MSI - plus the WAV to Opus compaction the tablet already does for a .mobix; (3) stamping every stroke point with its audio timestamp while recording, through the shared stroke model, so the file replays on Android too (this is the one part that must not be re-invented: the field already exists in StrokePoint); (4) playback, including an Opus decoder, a transport that stays in step with the page, and what happens when a document's audio is missing; (5) the Y audio tap and karaoke replay of strokes (the pen's own ink replayed with the recording, one stroke at a time); (6) scrubbing from the timeline and from the tablet dial, decided together with desktop-dial-width-and-ring so the dial has one meaning at a time; (7) the recording indicator and level in the status bar, with the settings that expose the input device living in desktop-settings-and-status-ui. Verification: a JVM test that records from a fake line, writes a .mobix and a .xopp, and