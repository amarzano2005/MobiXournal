[[task]]
id = "write-strokes-into-a-chunk-and-keep-them-across-eviction"
title = "Write strokes into a chunk and keep them across eviction"
description = "render-and-edit-an-infinite-canvas-document, the written-on half. Every edit path today is keyed by page index: render/DrawingSurfaceStrokes.kt commits into layout.boxes.getOrNull(currentPage) through a PageBox, and render/PageEraser.kt, render/Selection.kt, render/EditHistory.kt and the page window (render/PageWindow.kt) all speak pages. For a chunked document a stroke has to land in the chunk under the pen: derive cx/cy from the document point and canvas.json chunkSizePt, take the chunk from ChunkTileManager.getOrCreateChunk(cx, cy), append the stroke to its top layer and markDirty(cx, cy). Load the chunk first when it is not resident (returning to a chunk the viewport evicted must read it back, the trap edit-a-page-the-lru-window-has-evicted fixed for pages), and let eviction write a dirty chunk back into a store the document owns (ChunkTileManager.onEvict, or a chunk store beside it in render/DrawingSurfaceInfinite.kt) instead of dropping it - an evicted stroke is a lost stroke. Keep the path honest where the rest of the app cannot follow: eraser, selection and undo either work in chunk space or are refused for a chunked document, and whichever is true is written in docs/infinite-canvas.md. Verify with JVM tests: a stroke committed at a document point in chunk (1, 0) is found through the store, a chunk evicted and re-read keeps its stroke, and an erase on an evicted chunk loads it first; plus an emulator pass writing across a chunk boundary, panning away and back, with the ink still there and logcat clean."
