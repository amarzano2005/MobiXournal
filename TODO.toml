id = "desktop-settings-and-status-ui"
title = "Desktop: the Settings section and the status bar (scope)"
description = "Priority 2 of the window: one place where every choice the app already has - and the ones the tasks in TODO.toml are about to add - can be seen and changed, instead of a properties file edited by hand. Settings persist through the existing store (desktop/DesktopSettings.kt, which owns tool placement today) so a restart finds them; every option is English copy and the window's own glass (docs/interface-contract.md), never a dialog over the page. Investigate and then add the atomic tasks: (1) the Settings window itself - a section per lane, opened from the header and from a key, with the sections Interface (tool placement, page spread and fit, sidebar and inspector defaults), Display (light or dark theme, target refresh rate, the frame-time readout), Tablet (which pen stream: Windows Ink or Wintab, aspect-ratio lock, active-area mapping, pressure curve), Dial (what the ring controls - it reads the setting desktop-dial-width-and-ring introduces - and its step size), Audio (input device and level, when desktop-audio-replay has landed), and Shortcuts; (2) the status bar additions that are reads, not settings - refresh rate and frame time, the pen stream, and the tablet and dial indicators that already exist (docs/desktop-workstation.md); (3) a shortcut table that can be remapped, sharing the Android remapping model of docs/ui-modernization.md so a key means the same tool in both shells, with a conflict check and a reset; (4) what each setting does when it changes live (a new density re-records the page picture, a new placement re-lays the strips) and the one test per setting; (5) tests: a render test per Settings section (the window's chrome, no band over the page), a state test that each option survives a restart through DesktopSettings, and one test that a remapped key reaches the same command the old key did. Behaviour an option exposes is owned elsewhere and is linked, not re-specified here: the dial's width ring by desktop-dial-width-and-ring, the spr