[[task]]
id = "desktop-guides-place-and-pose"
title = "Desktop guides: place and pose the instrument with the pointer"
description = "The pointer half of the guides slot, on the shared grab rules `desktop-guides-geometry-into-mobix-core` lifts into `DrawingGuide.grabHandle`/`grabbableBody`. New `desktop/src/main/java/com/mobixournal/desktop/GuideGesture.kt`, plain Kotlin and JVM-testable: `GuideGrab` (NONE/BODY/TIP), `guidePress(pose, page, x, y, reach)` picking the tip first and then the body (the tablet's order in `GuideDrag.begin`), `guideDragged(pose, grab, grabX, grabY, x, y, snapAngle)` answering the re-posed guide through the tablet's own functions - `moved` for a body drag, `Setsquare.aimedAt`/`Protractor.aimedAt` (with `Snapping.snapAngle(raw)` when the hand holds Shift) and `Compass.openedTo` for a tip drag - and `guideReachPt(zoom, density)` built from a screen-pixel hit radius divided by zoom and density, the way `LivingGrips.gripAt` already converts. Wiring: in `pageGestureLoop` (`PageCanvasInput.kt`) ask `guidePress` BEFORE `preInkPress`, so a press on the instrument is answered before a selection, a living slot, a figure or the ink router; the drag then re-poses the guide on every move and reads Shift from `currentEvent.keyboardModifiers.isShiftPressed`; turning the page keeps the pose (it is pinned to `page`, so it applies only there); a drag off the sheet keeps the last pose rather than jumping. A pose drag writes NO page edit and NO undo step (assert `canUndo` stays false), and `Esc` during the drag restores the grab-time pose through the existing `PagePressTargets.onLiveDrag` cancel path. The shell writes the result back to the tab through a new `PagePressTargets.onGuide: (DesktopGuidePose?) -> Unit` (`PagePressTargets.kt`), exactly as `onPlaceLiving` does for a STEM slot. Cursor: add SETSQUARE/COMPASS to the `null` branch of `toolCursorDiameterPx` (`DesktopCursor.kt`) - the slot draws no band, so a pen-sized ring would promise ink it never lays. Tests: pure `DesktopGuideGestureTest` (a body press slides, a tip press aims with and without the snap, the compass opens its radius, a miss answers NONE, a drag never shrinks below `DrawingGuide.MIN_SIZE_PT`, a ruling/chemistry guide can never be grabbed) and `DesktopGuideSceneTest` in a real `ImageComposeScene` (a press inside the placed setsquare and a 40 pt drag move the tab's guide by 40 pt; a tip drag with Shift held lands the angle on 45 degrees; the same drag on the compass sets the radius; the pen's packets stand aside - `DesktopTool.SETSQUARE.inksByPackets()` is false - and the page is untouched). Verification: `gradlew.bat :desktop:test` on JDK 21. Docs: `docs/desktop-editing.md` (what a drag on the page does with a guide down), `docs/drawing-tools.md`, README. Regenerate the packaged window before closing."
