title = "Replay the writing in time with its recording"
description = "render/KaraokeStrokeAnimator.kt computes what a stroke should look like at an audio playhead - it reads StrokePoint.dtMs, which only a .mobix carries - and DrawingSurfaceView.karaokeState exists on the view, but nothing sets it and DrawingSurfacePaint.kt never reads it: the animator is dead code. So every timing the app is at pains to capture and store is shown to nobody, and audio playback (audio/AudioPlayer.kt, audio/AudioSession.kt) is play and stop while the page stays still. Working this is an investigation first: what clock the playback can publish into the view (the player owns a MediaPlayer, so the playhead has to come from it rather than from a second timer that would drift), how the paint loop draws a stroke visible prefix without re-tessellating the page each frame, what happens to strokes whose dtMs are null (a .xopp load or an older .mobix - the honest answer is that such a stroke is simply already complete), and whether the first cut is playback only or includes scrubbing. Add the atomic tasks that come out of it."
