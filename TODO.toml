id = "desktop-pdf-export-keeps-source-page-vectors"
title = "Desktop: keep an imported PDF's own vectors in an exported PDF"
description = "desktop-export-pdf-document flattens a PDF-backed page to a raster picture, which is the one place the window is worse than the tablet: there the untouched source page is imported verbatim, so an annotated PDF round-trips at its original size and crispness and a 200-page scan does not become a 100 MB export. Move PdfOverlayMatrix (app/src/main/java/com/mobixournal/render/PdfOverlayMatrix.kt) into mobix-core under the same package: it is already free of PDFBox and Android types - its doc names com.tom_roush only as the class that consumes the coefficients - so the move needs no import change and its unit test moves with it. Then teach DesktopPdfExport the tablet's two arms per page: when the page's background is a Background.Pdf whose source this window can open (the same bundled-first-then-file resolution PageBackdrop performs, exposed as a source-PDDocument lookup rather than a raster), import that page with outDoc.importPage, read its crop box and /Rotate, build PdfOverlayMatrix.forPage and pre-transform the content stream by it (org.apache.pdfbox.util.Matrix from the coefficients), then paint the plan's ink with PdfPageTransform(0, 0, visualHeight) so the overlay lands where it was drawn on a rotated page; every other page keeps the fresh-sheet arm. A source that will not open falls back to the flattened page rather than failing the export, and that difference is worth a sentence in the docs. Verify in desktop/src/test/java/com/mobixournal/desktop/DesktopPdfExportVectorsTest.kt: a two-page source PDF whose text a PDFTextStripper reads exports with that text still extractable from the exported page (a raster flatten would lose it) and with the same page count and size; a /Rotate 90 source page puts an ink mark drawn at the top of the visual page at the top of the page a renderer shows, checked by rendering both the source-and-overlay export and a mark drawn on a plain sheet; a source that cannot be found still exports the page with its picture or paper instead of throwing. Docs in the same commit: docs/pdf.md (both shells preserve source vectors; the one flatten left is a picture that is already raster) and docs/desktop-workstation.md. No emulator pass."
