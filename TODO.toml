[[task]]
id = "desktop-pdf-import-merges-a-second-pdf"
title = "Desktop: a second imported PDF is joined into the first"
description = """
`docs/pdf.md`'s single-background rule on the PC: a `.xopp` references one PDF, and the tablet answers a second import by joining the two files (`MainActivity.appendMergedPdf` → `render/PdfMerger.join`). That merger is pdfbox-android (`com.tom_roush`); the desktop links `org.apache.pdfbox` and needs its own twin.

New `desktop/src/main/java/com/mobixournal/desktop/DesktopPdfMerge.kt`: `object DesktopPdfMerge` with `fun join(base: File, added: File, out: File): File` using `org.apache.pdfbox.multipdf.PDFMergerUtility` (`destinationFileName = out.absolutePath`, `addSource(base)`, `addSource(added)`, `mergeDocuments(MemoryUsageSetting.setupTempFileOnly())`), refusing an `out` that equals either source — the merge reads them while it writes, which is why `PdfMerger` requires the same and why callers alternate names. It is the only place that merges.

Then the APPEND path in `DesktopPdfImportCommands.kt` honours it: when the active document already has a `Background.Pdf` page whose reference resolves to a file, the arriving PDF is joined *after* it — the joined file becomes the document's reference (page 0's `filename` re-pointed at it, `domain` left as it was), the built pages are appended with `pageNoOffset = base.numberOfPages` so their `pageno` continues, and the tab is still one undo step. When there is no PDF background yet, nothing merges: the pages are appended with their own reference, as the tablet does. A reference that resolves to nothing (a document whose PDF went missing) takes the merge arm only if the file can be found; otherwise the import adds its own reference and the pages paint from it.

Verification, `DesktopPdfMergeTest.kt`: two builder-made PDFs, 2 and 3 pages; `join` writes a 5-page file and leaves both sources byte-identical; the appended pages carry `pageno` 2,3,4; page 0's `filename` is the joined file; a `.mobix`/`.xopp` save of that document paints all five pages through `PageBackdrop.sourcePdf`. Add the state case to `DesktopPdfImportTest.kt`: APPEND onto a document already backed by a two-page PDF gives five pages, one reference, one undo step.

Docs, same commit: `docs/pdf.md` (the single-background paragraph gains the desktop's twin), `docs/desktop-workstation.md`. Desktop only: `rebuild = false`."""
