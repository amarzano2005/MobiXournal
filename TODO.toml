description = "Create `tools/mobix-cli/` as a Python 3 package runnable with `python3 -m mobix_cli` from a checkout and installable with pipx, **standard library only** (no Kotlin, Gradle, Android or `com.mobixournal.*` import; an optional JSON-Schema dependency is a later task and must stay optional). Implement `inspect` (mimetype, formatVersion, documentId, creator, page or chunk count, entry count and total bytes, canvas mode and page size, declared capabilities) and `list` (pages and chunks by index with their entry name, size and digest; assets by name and size, decoded from the central directory only). Both take a path and a `--json` flag that prints one object a script can read, and both exit 0 on a readable archive, 2 on a file it cannot open and 1 on a document it must refuse, with the reason on stderr. No rendering and no element decoding yet. Tests with `unittest` in `tools/mobix-cli/tests/` over the committed golden corpus in `mobix-core/src/test/resources/fixtures/mobix-v1/` and the hostile corpus, run by `python3 -m unittest discover tools/mobix-cli/tests`, with no network and no dependency outside the standard library."
