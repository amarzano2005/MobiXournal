[[task]]
id = "desktop-images-and-import"
title = "Desktop: images as elements and content import (scope)"
description = "Today desktop/ shows images only as page backgrounds. This scope owns BOTH halves of the tablet's picture tools: an image as a movable, resizable page element, and bringing content into the document (paste, drag a file onto the page, insert a picture). Investigate, then add the atomic tasks: (1) what a .xopp image element stores versus what a .mobix element stores (the content-hash assets are the native path; a .xopp carries the bytes inline or beside the file), and what the window must write so the document round-trips on both shells (docs/mobix-format.md, docs/xopp-format.md); (2) which slice of the app's image and PDF import path (io/, render/) can be reused unchanged, and what a dropped or pasted file becomes (one element, a new page, a background - three different outcomes that must not be conflated); (3) the element's handles: move and resize without resampling, one undo step per gesture, the same handles the selection transform gives (desktop-eraser-and-selection-on-shared-geometry); (4) the drop target itself: what Windows gives drag-and-drop on Compose Desktop, the visual affordance while a file is over the window (docs/interface-contract.md), and what happens to an unsupported file; (5) import of a PDF and of a sketch, under the sticky format policy - an imported PDF becomes a page background, never a silent conversion. Tests: a JVM round-trip that writes and reopens a document with an image element (both formats), and an ImageComposeScene test of the drop and the handles. Docs: README, docs/desktop-workstation.md, the owning format doc. Produce tasks, no code."
