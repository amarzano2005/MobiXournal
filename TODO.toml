id = "desktop-status-frame-time"
title = "Desktop: the status bar's measured frame time"
description = "The status bar (desktop/src/main/java/com/mobixournal/desktop/DesktopStatus.kt) already says the pen source, the refresh rate and the frame budget it implies; add the frame time the window actually paints at. The shell keeps a short exponential average of the intervals between painted frames (the number DesktopDiagnostics computes under --diagnose, kept always at a cost of a few nanoseconds per frame), and the bar shows it beside the refresh label as one muted label - so a loop capped at 30 frames on a 120 Hz panel reads as 33.3 ms beside 8.3 - hidden when Display's display.frameTime is off. The tablet and dial indicators stay the penLabel they already are. Tests: DesktopStatusTest asserts the label for a known average and its absence with the readout off, and a shell test that the average follows the frames painted. Docs: docs/desktop-workstation.md (the status bar paragraph)."
