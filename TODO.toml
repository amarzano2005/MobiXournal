title = "Desktop: a stroke committed while recording carries its offset"
description = "While a take runs, every committed stroke carries the link, from the one funnel. Use the shared Stroke.withAudio (moved into mobix-core by desktop-audio-shared-seam) where the window appends a committed stroke to the page - the single commit that freehand strokes, figures and highlighter bands all pass through (follow the ink router's commit into the tab's PageWindow rather than stamping per tool) - reading the recorder's stamp exactly as the tablet reads audioStamp inside appendStroke: the offset is the bytes written so far, never wall time. A commit while the take is paused stamps nothing. A stroke committed with no recording is untouched. The per-point dtMs the window already writes (DesktopPen.kt, from the packet's own timeMs) is what makes point-precise seek work: assert in the test that it still sums to the stroke's own timeline, so a tap can land on a word. Tests: a scene test that a stroke drawn during a take carries fn and ts (the recording's name and the elapsed ms) and one drawn after it carries neither; a pure test that withAudio writes the two attributes the .xopp codec reads and that a .mobix audioRef round-trips them. Docs: docs/audio.md (the stamping sentence gains the window), docs/desktop-editing.md (one line: a stroke drawn while recording carries its offset), README. Verify :desktop:test :mobix-core:test and regenerate the distributable."
