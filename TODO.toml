description = """
`ParametricShapeElement`, `ShapeVertex`, `ParametricShapes.kt`, `FigureGeometry.kt` and snapping let a shape be edited, but there is no persistent constraint: 'keep this angle at 90 degrees' cannot be expressed, so dragging a vertex breaks the construction it was meant to represent.

