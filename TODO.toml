[[task]]
id = "desktop-page-copy-paste"
title = "Desktop: copy, cut and paste the picked pages, across tabs"
description = "Pages cannot be copied today: the only clipboard is `DesktopClipboard` in `DesktopSelectionCommands.kt`, which holds *elements*. Add a page clipboard beside it (`DesktopPageClipboard`, one per shell so a page picked in one tab can land in another) holding copied `Page`s. In `DesktopPages`: `copyPickedPages()`, `cutPickedPages()` and `pastePages(index)`. Copy takes the sidebar's picked rows, or the current page when nothing is picked, and re-mints every page and element id (`ElementId.mint`) so the same page can be pasted twice into one document without the two copies claiming one identity; cut is copy plus a removal, as **one** undo step that also clears the pick. Paste inserts after `index` (the last picked page, else the current one) as **one undo step** through the same snapshot/replace/record path `removePages` uses, selects the first pasted page and leaves the pick cleared. Routing in `DesktopShellState.apply` for `ShellCommand.COPY_SELECTION`/`CUT_SELECTION`/`PASTE_CLIPBOARD`: when the sidebar pick is non-empty and `tab.selection == null`, the key goes to the page clipboard; otherwise it keeps today's order (a PDF text selection first via `copyPdfTextOf`, then the element clipboard), so no existing gesture changes meaning. A copied PDF page keeps its `Background.Pdf`, and pasting into a **different** document must either re-reference the PDF the target already carries or refuse with a sentence in the status bar — never leave a dangling reference (`PdfPageReferences`, `docs/pdf.md`). `PageSelectionBar` grows Copy / Cut / Paste. Tests in `desktop/src/test/java/com/mobixournal/desktop/DesktopPageClipboardTest.kt`: copy and paste a picked run, ids fresh on both pastes, paste into another tab, cut removes and pastes back in one step, Esc/no pick still reaches the element clipboard, and a page pasted into a document without that PDF is refused rather than dropped. Docs: `docs/desktop-workstation.md` and `docs/desktop-editing.md` (the sidebar pick and its bar)."
