description = "carry-the-page-source-into-the-editor and materialise-only-the-visible-pages-in-the-canvas shipped JVM-verified only: both carry emulator_debug=yes, and this host has no /data/android toolchain (no adb, no AVD), so the runtime behaviour they exist for has never been seen. Install the APK and make a 200-page .mobix (the synthetic writer in MobixPagedOpenBenchmarkTest can produce one) reachable to the app, open it through the system picker, and check: (1) the tab counter and the pages menu show 200 rows with the manifest's page names on open, before any page is drawn - logcat clean, no per-page parse at open; (2) scroll from page 1 to page 200 and screenshot both ends, confirming pages render with their backgrounds (a bundled PDF page and a picture page drawn later than the open, which is what the BackgroundResolver adoption is for); (3) open a .mobix whose page names a bundled picture, draw one stroke on it, save, close, reopen: the background is still there and the stroke survived; (4) switch to another tab and back, and mirror the tab in the second pane, confirming the adopted backgrounds survive the switch; (5) edit a page the window has evicted (jump to page 150, then edit) and confirm no stale page comes back. Record failures with the screenshot and the log line, and if the lazy path misbehaves only on device, fix it there and note what the JVM tests could not see. (6) A bundled recording plays from the .mobix alone: record audio while writing a stroke, save as .mobix, copy the file to an empty folder with no .wav beside it, reopen it there and tap the stroke with the Play Object tool — the recording must sound from the right offset, with the page that names it drawn at least once first (adoption happens on that page's read). (7) Record a minute of speech with the pen in a `.mobix` document, save it, and compare the file's size against the same minute recorded into a `.xopp`: the container should carry Ogg/Opus (~1 MB a minute) rather than WAV (~5