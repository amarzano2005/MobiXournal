[[task]]
id = "track-the-flick-and-commit-a-colour-width-or-tool"
title = "Track the flick and commit a colour, width or tool"
description = "The interaction half of the HUD: while the barrel button is held, the flick direction selects a slot, a haptic tick marks each crossing of a boundary, and the release commits. The commit must go through one entry point, and there is a stub of it: applyToolPreset (ui/ToolPreset.kt) is documented as the call the rail and a radial-palette slot both make, but nothing calls it today - the rail switches through EditorUiState.switchToolTo plus surface.applyTool in EditorScreen and EditorRegions. So this task starts by routing the rail's own tool, colour and width switches through applyToolPreset, pinned by a unit test, which is what turns the guarantee (a HUD choice can never mean something the user could not have set by hand) from a comment into a property. Keep the angle-to-slot geometry pure and unit-tested, including the seam wrap where the ring closes and the centre dead zone, which commits nothing when the release lands there; haptics respect the existing pen haptics setting. Verify with JVM unit tests over the slot maths (each slot centre, a boundary, the dead zone) plus an emulator pass committing a colour and a width and seeing the rail follow."
