id = "desktop-settings-tablet-area"
title = "Desktop: Tablet section - active area and aspect lock"
description = "The second half of the Tablet page. tablet.activeArea (Full - the driver's whole surface; Tablet - the rectangle a hand actually writes in, in millimetres) and tablet.aspectLock (keep the area the tablet's own ratio, on by default). Today TabletWintab in desktop/src/main/java/com/mobixournal/desktop/TabletWintab.kt opens the driver's SYSTEM context, whose coordinates are already mapped to the screen, so no area can be chosen: this task opens a non-system context (WTI_DEVICES, WTI_CS_OMN), reads the axes it declares and maps them onto the page through the same page transform the pen reader already uses. An area the driver cannot map degrades to the system context with one line in the section, never to a dead pen. Tests: a pure mapping test (millimetres in, page points out, aspect lock holds the ratio, an unmappable area falls back) and one that the context in use is what PenSource reports. Docs: docs/desktop-workstation.md and the tablet reader spoke listed in docs/architecture.md."
