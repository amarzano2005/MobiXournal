[[task]]
id = "mobix-page-virtualization-reader"
title = "Page virtualization: read .mobix pages on demand instead of whole"
description = "The performance reason the format exists (docs/mobix-format.md, engine optimizations): reading a 200-page notebook must not parse pages 1-199. MobixContainer.open reads every entry into memory today, which is right for the manifest and for tests and wrong for a real document. Add a reader that walks the ZIP central directory, exposes the manifest and the entry index without inflating the payload, and materialises a page (or chunk) on demand into an LRU window of the current page plus or minus two, evicting the rest. Keep MobixContainer as the envelope primitive and put the paging policy in its own file (for example format/mobix/MobixPagedReader.kt) with an injectable cache budget so it is testable without a device. Verify with JVM tests over a synthetic 200-page archive: opening touches only the manifest and the first pages, navigating to page 200 does not inflate the earlier ones, and an evicted page is re-read rather than corrupted."
status = "active"
level = "task"
category = "feature"
urgency = "low"
order = 380
created = 2026-10-12
tags = ["mobix", "perf"]
rebuild = false
emulator_debug = false

[[task]]
id = "mobix-incremental-save"
title = "Incremental saves: repack only the pages that changed"
description = "A .mobix save must not recompress the whole document: only entries whose bytes changed are rewritten, while unmodified pages, background PDFs and assets are copied through. Implement it as a repack of the archive (ZIP has no in-place edit) that streams every untouched entry from the source into the destination with the same compression method and writes only the dirty entries from memory, plus the mimetype first and STORED as always. The manifest sha256/modified fields decide dirtiness, so use them. Verify with JVM tests: after editing one page of a multi-page document the untouched entries come out byte-identical, the mimetype is still first and stored, and unknown-entry preservation still holds. Measure and report the bytes written for an N-page document with one dirty page, so the claim is a measurement rather than an assumption."
status = "active"
level = "task"
category = "feature"
urgency = "low"
order = 390
