[[task]]
id = "desktop-audio-wav-recorder"
title = "Desktop: record from the microphone through javax.sound.sampled"
description = "desktop/src/main/java/com/mobixournal/desktop/DesktopAudioRecorder.kt: capture from a Windows microphone in the format docs/audio.md gives for a .xopp WAV - 44.1 kHz, mono, 16-bit signed little-endian PCM - by opening a TargetDataLine from a chosen Mixer (AudioSystem.getMixerInfo / Mixer), reading a bounded buffer of about 100 ms on its own thread, and writing RIFF/WAVE with AudioSystem.write(AudioInputStream, AudioFileFormat.Type.WAVE, file) or with the WavWriter that the shared seam moved out of app/audio; prefer the move, because its two patched length fields and its durationMs are what a stroke's ts is read from. Behaviour: start answers the recording's bare file name (shared audioFileName, extension wav) or one English sentence when the line cannot open (no microphone, device busy, no permission) - never a crash and never a silent no-op; stop finalises the file and answers it; pause and resume close nothing (the capture is muted, not closed, exactly as on the tablet) and elapsedMs() is the bytes written so far over sampleRate times two, so a stroke's offset points at the sample it was drawn over. Settings keys, read from DesktopSettings with the names desktop-settings-audio already states: audio.inputDevice (empty means the system default; a stored device that has disappeared falls back to the default with the recorder saying so) and audio.outputDevice (written by the Settings page, unused here). Expose the peak of the last chunk as a 0..1 level for the status bar that desktop-audio-record-slot-and-status draws; compute it once per chunk, never per sample. Tests: a fake TargetDataLine (the interface is small) proves a half-second capture writes a 44-byte-header WAV of the right length and durationMs, that a line which fails to open answers the sentence and leaves no file behind, that a vanished device falls back to the default, and that the level follows the chunk's peak. Docs: docs/audio.md (recording on Windows), docs/desktop-workstation.md. Verify :desktop:test :mobix-core:test, then createDistributable and record one real take on the Huion machine: the packaged runtime needs java.desktop, and that live pass is what proves the packaged window can open a line."
