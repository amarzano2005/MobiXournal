[[task]]
id = "wire-the-android-pointer-path-through-the-router"
title = "Wire the Android pointer path through the shared router"
description = "The router is written and tested (InkPointer/InkPointerRouter in mobix-core), and the decisions it wraps are what the app already calls (InputClassifier, PressureCurve, PageEraser/StrokeEraser). What is still the surface's own is the state machine that turns MotionEvent into those calls: DrawingSurfaceInput.kt's beginPointer/addSamples and DrawingSurfaceStrokes.kt's start/extend/end (docs/stylus.md says so: status library only). This task finishes the adapter half. (1) MotionEvent to InkPointer for one pointer: tool type (MotionEventPointer.kt already maps it), x/y, pressure, event time, phase from actionMasked, buttons from buttonState, and tilt/azimuth through telemetryAxis so an undeclared axis stays null. Historical samples stay where they are: the adapter emits one InkPointer per historical point, which is what makes the pressure ramp reach the router. (2) The stroke path: startStroke/extendStroke/commitCurrent in DrawingSurfaceStrokes.kt consume InkEvent.StrokeStart/Sample/End and keep everything document-shaped (page box, guide snapping, smoother, hold-to-snap, commit, undo) in the view; the router owns only WHEN a stroke begins and ends. Configure it with startOnDown = true, because on the tablet a tap leaves a dot and moving that would change what users see. (3) Navigation and palm rejection come from the router: a second finger ends the stroke and starts a pan (InkEvent.PanBegin), the pen takes over from a finger, and a finger under a writing pen stays ignored — the cases onPointerDown implements today. (4) Not routed: barrel keys and vendor keys, page drag and its arm timer, guide drag, spline taps, table/plot double-taps, audio play mode, vertical space, background select and the marquee. They keep their own entry points, and DrawingSurfaceInput's header must list them, so the next reader knows what is adapter and what is not. (5) The gate is the existing app suite, unchanged; add a JVM test per routed decision only where the view can be driven without a MotionEvent. No emulator (the on-device StylusInputTest covers the physical paths). Docs: docs/stylus.md (drop the library-only status), docs/codebase.md rows for the two files."
