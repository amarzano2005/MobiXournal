description = "One of the two settings-driven tablet controls, and the other half of the dial work (the notch already zooms through TabletWheel). (1) Delivery: the dial's rotation runs DesktopShellState.dialZoom today; add tablet.dial=zoom|width to desktop/DesktopSettings.kt, read it into DesktopShellState as a dialControl snapshot state, and route the rotation to the stroke-width steps while the setting says width (the same stepWidth the keys and the strip use) - every dial action keeps a keyboard twin that edits the same value (DesktopKeys.kt and the shortcut table of docs/ui-modernization.md section 3; read the table first and never reuse a taken key). (2) Ring: while the width control moves, and for about 700 ms after, draw a circle at the pen's last page position whose radius is the prospective width in page pt times zoom times density, in the window's own chrome and tokens (DesktopTheme, docs/interface-contract.md: one material class, the five states, English copy), not a second HUD - a Canvas overlay in PageCanvas.kt above the page transform, fed by a ringWidth state the shell clears on a timer. (3) Tests: the width steps clamp at PenPalette.DEFAULT_WIDTHS ends, the setting routes rotation to the right control (a pure state test beside TabletDialTest), and an ImageComposeScene render test that the ring's radius follows the width and that it disappears after the hold. (4) The Settings window that exposes the choice is desktop-settings-and-status-ui (Interface/Dial section): this task adds the key and the state, that one draws the control, so neither specifies the other's surface. Docs: docs/desktop-workstation.md (The tablet on Windows), the shortcut table if a key is added, README's desktop paragraph. No vendor HID and no Android change; verify with :desktop:test plus one live pass on the Huion."
