id = "desktop-settings-live-apply"
title = "Desktop: every Settings row acts on the open window, with one test each"
description = "A stored setting that changes nothing is a setting the window has forgotten. Collect the hooks in one place - DesktopShellState.applySetting, called by every row of the Settings surface - so a new row cannot be persisted and dropped: a new strip placement re-lays PageWorkspace, a new theme repaints the tokens, a new tablet stream reopens the reader, a new dial control re-aims one rotation, a new default fit lands on the next opened document, a new shortcut is live at the next key, the frame-time readout shows and hides. Then add DesktopSettingsRestartTest: for every key DesktopSettings owns, write it through the state, build a second DesktopSettings over the same file and assert the surface reads the value back - the test a new setting must extend. Docs: docs/desktop-workstation.md (the Settings section states the rule: a row is a hook, a key and a test)."
