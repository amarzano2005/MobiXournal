[[task]]
id = "desktop-pdf-text-selection"
title = "Desktop: select a PDF page's text and copy it"
description = "The drag and the clipboard: with the slot picked, a press resolves through `pagePointOf` to page-local points and anchors the selection at `PdfTextIndex.anchorWord` on that page (only when the page's background is a `Background.Pdf` with a text layer), a drag extends the focus word on the same page, and the overlay paints `rangeBoxes` as the tablet's `drawTextSelection` does — a wash and a hairline per word box, in `DesktopTheme`'s selection colour, never in the page's ink. `Ctrl+C` and a Copy button on the selection bar put `rangeText` on the system clipboard as a `StringSelection` (`java.awt.Toolkit`, the route `DesktopSelectionCommands` already uses); `Esc`, a click off the text or a page change clears it. The selection is **view-only and never document content**: no page edit, no undo step, and a select-copy-save leaves the file byte-identical — the rule `docs/pdf.md` states for the tablet. A page carrying no text layer (a scan, a photograph, a `.mobix`) answers one English sentence in the status bar rather than nothing at all. Verify with JVM tests over the anchor/extend/range mapping (a hand-built `PdfTextIndex` and one extracted from a fixture PDF), a `DesktopPdfTextSelectionRenderTest` on `ImageComposeScene` (as `DesktopPaperRulingTest` does) showing the wash on the selected words and not on the line beside them, and a test that the model and the undo depth are untouched; document it in `docs/pdf.md`, `docs/desktop-editing.md` and README."
