[[task]]
id = "desktop-dial-wheel-zoom"
title = "Desktop: the dial's notch zooms, told apart from the mouse wheel"
description = "The dial turned nothing in the window: Windows delivers its rotation as WM_MOUSEWHEEL (delta +/-120, no modifier, extra-info empty), the same message and the same unit as the mouse's wheel, so routing every notch to zoom would take scrolling away from the mouse. Give the notch a device: register the window for raw mouse reports (WM_INPUT, RIDEV_INPUTSINK so the dial works unfocused), turn RAWINPUTHEADER.hDevice into the device's interface path with GetRawInputDeviceInfoW, and call a notch the dial's when the path is the tablet's (tablethid/huion/vmidi/vid_256c). Keep it observational: the same notch stays the WM_MOUSEWHEEL Compose receives, and the canvas asks DesktopTablet.dialWheelRecently() whose wheel it was, so one notch is one action whichever message arrives first. The dial's notch takes wheelViewport's zoom path at the cursor with no Ctrl held; the mouse's wheel keeps scrolling. Verify with DialWheelSceneTest (an ImageComposeScene, both devices through Compose's real dispatch): the dial's notch zooms in and leaves the fit, the mouse's scrolls and keeps the 100 % zoom. Docs: docs/desktop-workstation.md (measured rows for the dial and raw input) and README's desktop paragraph."
