[[task]]
id = "desktop-predict-the-stroke-head-to-hide-the-frame-s-latency"
title = "Desktop: predict the stroke head to hide the frame's latency"
description = "What is left of the pen's latency is the frame interval, not this code: the packet ticker applies a batch as it arrives, so the measured gap between a packet and the frame that first drew it is 1.48 ms median / 5.22 ms p95 / 7.82 ms max on a blank A4 page and 1.96 / 5.10 / 7.48 ms on udiff.xopp on the owner's PC (docs/desktop-tablet.md has the table). What remains is the wait for the next vsync, which the eye reads as the line trailing the nib. Work: extend the DRAFT only (never the committed stroke) by one predicted sample along the velocity of the last few packets, capped in distance, cleared on a direction change and skipped below a slow speed so a resting pen does not jitter; keep it in PenPacketStroke so the shared router and the ink filter are untouched, and add a test that the committed stroke holds exactly the packets' samples while the draft may carry one extra. This is polish, not a defect: measure the perceived lead with --probe-ink on the owner's PC (the 144 Hz effect cannot be measured on a 60 Hz laptop) and record the before and after rows in docs/desktop-tablet.md before deciding it is worth keeping."
