[[task]]
id = "stem-reactive-variables"
title = "Page-scoped variables with a real dependency graph (F03)"
description = """
`PlotElement` already has parameters driven by sliders, but they are local to one plot: there is no way to define `a=2` once and have a calculation, a table and a plot read the same value. Nothing in the model expresses 'this result depends on that definition', so nothing can go stale.

User story: define `a = 2` and `m = 5 kg` in the notebook, reference them from a result and a plot, change `a` once and see exactly which results are affected; distinguish a live reference, a frozen value and a dangling reference.

Model decision to make in this scope: bind by stable `variableId`, never by the display name alone; the name belongs in the formula text, the id survives rename and move. First phase is page scope only - document-wide definitions are `stem-document-wide-definitions`, because they need an authoritative registry and must not scan every page on each interaction. Runtime: directed definition-to-consumer graph, cycle detection, topological evaluation, revisions, local invalidation; throttle during a slider drag and commit one undo entry per gesture; a deleted definition becomes `UNRESOLVED` and keeps its source and last cache for diagnosis. Never silently rebind an ambiguous name.

Files: `Living.kt` and new pure models, the page index, `PlotElement.parameters`, `PlotInk`, `MobixManifest`/`MobixDocument` for any document-level registry, merge by id, and both shells' inspectors. Child tasks: V1 definitions and page-scoped bindings; V2 graph with cycle diagnostics and revisions; V3 wiring into calculations and plots; V4 define/rename UI; V5 round-trip, merge and drift guard.

Acceptance: chain `a -> b -> c` evaluates once per revision; `a -> b -> a` is diagnosed, not hung; rename keeps bindings; reopening the file is identical; the independent validator can enumerate the dependencies. Dependency: F01, F02, the reference-preservation policy from `mobix-known-type-unknown-fields`."""
status = "active"
level = "scope"
category = "feature"
urgency = "high"
order = 170
created = 2026-11-10
