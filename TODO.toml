[[task]]
id = "desktop-eraser-whole-stroke-mode"
title = "Desktop: the eraser's second member - whole-stroke erase"
description = "The tablet's eraser is one group with two members - partial erase (the disc cuts the stroke where it crosses) and whole-stroke erase (a touched stroke goes) - and the window only has the first: PageInkGesture.eraseAt in desktop/src/main/java/com/mobixournal/desktop/PageCanvasInput.kt passes EraserMode.STANDARD hard-coded to PageEraser.erase, although mobix-core's PageEraser already answers both modes (enum EraserMode { STANDARD, WHOLE_STROKE }). Work: (1) a second slot: DesktopTool gains ERASER_WHOLE (\"Eraser (whole)\", shortcut Shift+E, its own catalogue glyph - the eraser's own with the struck-through ring, not a Material icon, docs/interface-contract.md section 4); the group's chevron will put the two erasers under one slot when desktop-tool-groups-and-pickers lands, so nothing here may assume the two are neighbours in the strip; (2) DesktopPen.kt: activeTool() answers ERASER for it and a new eraserMode(): EraserMode answers STANDARD for ERASER and WHOLE_STROKE for ERASER_WHOLE, which PageInkGesture passes to PageEraser.erase instead of the constant, so one erased gesture is still ONE undo step (the recorded flag in PageInkGesture is the same one); (3) the cursor ring is the eraser's radius for both (DesktopCursor.toolCursorDiameterPx), so the whole-stroke eraser shows the same tip it cuts with; (4) tests: beside DesktopPenTest, eraserMode() answers the two modes and nothing else; in DesktopEditingTest (which already erases across a bar with the shared PageEraser) a whole-stroke eraser drag removes the WHOLE bar where the standard mode left two halves, and one undo brings it back; a strip render test asserts the new slot draws its glyph and that picking it is what the status bar reports; (5) docs: docs/desktop-workstation.md (the eraser's two modes in the tool-strip paragraph), the eraser section of docs/drawing-tools.md notes the desktop's second mode, README's desktop paragraph mentions it. Finish with :desktop:createDistributable. No Android change; :desktop:test plus the guards green."
