# TODO — active task list for MobiXournal.
#
# Single source of truth for active work (see AGENTS.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "AGENTS.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id> --shipped` to move it to FINISHED.toml; the archive records what the task delivered (files, behaviour, tests, docs, and what it deliberately did not do), not the plan it was picked up from."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .mobix or .xopp formats can represent on disk (per AGENTS.md and docs/mobix-format.md). If a capability cannot round-trip through either format, it is out of scope."

[[task]]
id = "desktop-guides-setsquare-compass"
title = "Desktop: the setsquare and compass guides (scope)"
description = "The tablet's rail carries a guides slot (docs/drawing-tools.md: the setsquare/compass guides beside BackgroundRenderer, PdfBackgroundPainter and Snapping) and the window has none, so this is one of the tools the parity map still has to reach - and the last one without an owner. Investigate and then add the atomic tasks: (1) how much of the tablet's guide geometry and its snapping is already platform-free in mobix-core (the guide lines, the snap candidates, the angle readout) - whatever is, moves or is reused rather than re-derived, so a guide placed on the tablet and one placed here behave the same; (2) how a guide is placed and moved with a pointer: a press anchors the compass, a drag turns it, a second press drops it, and whether a guide is a document element at all or page view state (the tablet answers this and the window must give the same answer, because only one of the two survives a save - the scope rule of AGENTS.md decides it); (3) the slot: guides are not ink, so DesktopTool.inksByPackets stays false for the slot and the pen's packets must not take the drag (DesktopVerticalSpaceTest is the pattern), and the face comes from the shared catalogue like every other slot (unify-remaining-stem-tool-glyphs); (4) the readout: the angle and the snap marker in the window's own chrome and tokens, English copy, the five states (docs/interface-contract.md); (5) tests: a pure geometry test for the guides and their snapping beside the shared maths, an ImageComposeScene test that a drag places a guide and that snapping holds a line at 0/45/90 degrees with Shift, and a render test of the guide over a page. Docs: docs/drawing-tools.md (the guides section), docs/desktop-workstation.md, README. Produce tasks, no code."
status = "active"
level = "scope"
category = "feature"
urgency = "high"
order = 92
created = 2026-10-24
tags = ["desktop"]
rebuild = false
emulator_debug = false

[[task]]
id = "desktop-pen-tip-radial-hud"
title = "Desktop: pen-tip radial HUD (scope)"
description = "The radial HUD of docs/ui-modernization.md - summoned by a barrel button under the nib, dismissed on release, holding the user's swatches first, then widths, then tools - exists on the desktop only as a word in the tablet scope, and it is a tool surface, so it belongs to the tools-parity group. Investigate, then add the atomic tasks: (1) how the barrel button reaches the JVM with the stream this machine has (Wintab reports it as a pressure shoulder or a button bit; Windows Ink as a pointer property - TabletWintab already decodes buttons, so find the exact reading), and what a mouse gets instead (a key or a middle-click summon); (2) whether the HUD's geometry and its hit-testing and selection logic can live in mobix-core as pure Kotlin and be drawn by both shells, so the tablet's HUD and this one cannot disagree; (3) what the ring holds on the desktop: the palette the strip already uses (PenPalette), the three width slots and the acting tools only - a member whose tool does not act is not offered; (4) the dial's role in it (docs/desktop-workstation.md: the dial is a separate wheel device, so decide whether a turn steps the highlighted swatch) and the dismissal rules (release, Esc, a click outside); (5) tests: pure hit-testing and selection tests beside the shared geometry, a render test of the HUD over a page, and one scene test that a barrel press summons it and a release dismisses it. Depends on the Android HUD (app) for the ring's contents, not on a second drawing. Docs: docs/ui-modernization.md, docs/desktop-workstation.md, README. Produce tasks, no code."
status = "active"
level = "scope"
category = "feature"
urgency = "high"
order = 95
created = 2026-10-21
tags = ["desktop"]
rebuild = false
emulator_debug = false

[[task]]
id = "desktop-light-theme-and-header-extras"
title = "Desktop: light theme, breadcrumb and Share (scope)"
description = "The parts of the header and the theme the window still lacks, narrowed so nothing here is somebody else's: (1) light-theme tokens for the glass, the desk and the sheet, with a setting and the system default - the window is dark-first today and docs/desktop-workstation.md says the light theme waits until the tokens cover it, so the work is the token set plus the proof that every surface (bands, desk, sheet, sheet shadow, slot states, ink-on-paper) reads in both, and a switch that does not change what a document looks like; (2) the document path breadcrumb in the header, for the open document's path, which shortens from the left when the window is narrow; (3) Share: reveal the document in Explorer, copy its path, and open the export command that desktop-export-pdf-svg adds - three actions in one glass menu, English copy. Not here, and owned elsewhere: the Settings entry opens desktop-settings-and-status-ui's window; the header's search field belongs to desktop-page-management-and-search (a search field with nothing behind it is not built); the tool faces are unify-remaining-stem-tool-glyphs; the layout of the bands on an ultrawide window is desktop-ultrawide-21x9-layout. Each child owes a render test in both themes and, for the breadcrumb and Share, the pixel check that they carry the band's material and no more. Docs: the chrome and theming sections of docs/ui-modernization.md, docs/desktop-workstation.md, README. Produce tasks, no code."
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
