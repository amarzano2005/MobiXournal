title = "Notebook-level variable definitions without scanning every page"
description = """
Deliberately deferred out of `stem-reactive-variables`, which is page-scoped. A notebook-wide definition registry is only worth designing once page-scoped bindings are proven, because the naive version - scan all pages on every keystroke - would destroy the paging and memory work the format already does.

Decide the authoritative storage (a dedicated entry referenced by the manifest is the working proposal, e.g. `stem/definitions.json`, which legacy readers preserve raw), the id namespace, how a page resolves a definition without materialising 200 pages, merge and rename/remap semantics, unknown-entry preservation, and the safety limits. Derived indices stay derived and rebuildable.

Child tasks: schema decision; derived index with invalidation; merge-by-revision; document definitions UI; a test proving a notebook of 200 pages opens a shared definition without loading every page. Acceptance: shared definitions work across pages with bounded open cost. Dependency: F03 complete, `mobix-spec-v1`, the performance baseline."""
