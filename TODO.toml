description = "The data model the whole sheet rests on, extending the existing `table` element rather than adding a second type. A cell keeps `text` as its source of truth for a reader that knows no formulas, and gains optional `formula` (the source starting with =), `value` (the last computed number, a cache), and `error` (the typed refusal, so a broken formula is a value rather than empty ink). Rows and columns get stable ids the way elements do, minted once and never derived from their index, so inserting a row above a formula does not silently repoint its references; the policy for insert, delete and move is written down and tested. Encode and decode in `MobixTableCodec` under the existing rule - model or preserve whole, never half-read - with an old-reader check: a document without the new fields reads as exactly today's table and writes back unchanged, and a newer writer's unknown cell key is carried in the cell's own `unknown` map. The mode marker that says a table is scientific is absent in every legacy document, so nothing is converted by reading it."
