title = "Desktop: PDF annotation and outline (scope)"
description = "The desktop viewer rasterises an annotated PDF page as a background but cannot work on it, while the tablet has the tools. Investigate for desktop (PDFBox, not pdfbox-android) and then add the atomic tasks: (1) PDF text selection - what the text layer gives on a JVM, how a selection's rectangles are built, and how the selected text reaches the clipboard; (2) the snap-to-text magnetic highlighter (docs/pdf.md) - whether its geometry is platform-free enough for mobix-core so both shells snap the same way, and what a highlighter stroke stores so it round-trips; (3) the PDF outline and bookmarks in the sidebar (docs/ui-modernization.md lists PDF outlines there), including a lazily loaded outline for a big document; (4) the tools' slots: PDF text select and the magnetic highlighter are entries of the strip, so their slot faces and shortcuts follow the same rules as every other tool (unify-remaining-stem-tool-glyphs, docs/ui-modernization.md section 3) and a drag with them is not ink, so the pen's packets must not take it (DesktopTool.inksByPackets). Leaving the page's PDF untouched until a save writes it is the Android rule and applies here. Export is not in this scope: desktop-export-pdf-svg owns it. Verification per child: a JVM test over a fixture PDF for the geometry, a render test that a selection or a highlight lands where the text is. Docs: docs/pdf.md, docs/desktop-workstation.md, README. Produce tasks, no code."
