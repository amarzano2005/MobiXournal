id = "mobix-cli-writer"
title = "Write a .mobix from the CLI and prove both directions open"
description = "Second stage: a minimal writer in the same package that (a) creates a one-page document with one stroke and one bundled asset and (b) changes the title of an existing document while preserving every entry it does not understand, every unknown JSON key and every asset byte it does not touch. Determinism is a requirement: fixed ZIP timestamps, sorted entries after `mimetype`, the same bytes for the same input. Prove both directions with named acceptance tests: a file the CLI wrote opens in MobiXournal (a JVM test in `mobix-core` reading a file the CLI generated, gated on an env var with a stated skip message when the generator is absent) and a file MobiXournal saved validates clean in the CLI. State in the task's own output which element families the tool only **preserves** and which it can actually produce — a ZIP parser is not a STEM renderer. Never rewrite an element family it does not model: a title change touches the manifest and nothing else."
