[[task]]
id = "desktop-pdf-op-emitter"
title = "Desktop: replay PdfPagePlan into a PDF with the JVM PDFBox"
description = "The tablet's PDF page is mobix-core's PdfPagePlan replayed by app/.../render/PdfVectorPainter.kt through pdfbox-android; the desktop carries org.apache.pdfbox 2.0.31 (gradle/libs.versions.toml, declared in desktop/build.gradle.kts) and has no emitter, which is why it cannot print. PdfVectorPainter's own class doc names the desktop emitter as the second consumer, so build exactly that. Add desktop/src/main/java/com/mobixournal/desktop/DesktopPdfPainter.kt with paint(doc: PDDocument, cs: PDPageContentStream, page: Page, t: PdfPageTransform) looping over PdfPagePlan.of(page, t), one arm per PdfOp and runCatching around each op exactly as the app does so one bad op is skipped instead of aborting the page: PdfFill (a closed polyline, non-stroking colour, a PDExtendedGraphicsState carrying the alpha, MULTIPLY when the op asks for it), PdfPath (round cap and join, the op's dash, one stroke for the band when widths is empty and one stroke per segment when it follows the pressure), PdfText (beginText, the base-14 font for op.face, newLineAtOffset, one showText per line advanced by lineHeight) and PdfImage (decode op.data with ImageIO into a BufferedImage, LosslessFactory over it). Geometry stays in mobix-core: no arithmetic, no page walking. The platform swaps are the real work: pdfbox-android's BitmapFactory decode becomes ImageIO plus a BufferedImage for LosslessFactory.createFromImage, and the base-14 font map is written once here for org.apache.pdfbox - confirm the standard-14 constants exist in 2.0.31 as they do in the port and leave one comment noting that a 3.x upgrade replaces them with Standard14Fonts, so the next person knows the single place to change. Verify in desktop/src/test/java/com/mobixournal/desktop/DesktopPdfPainterTest.kt: a page carrying a pressured pen stroke and a text box paints without throwing; PDFTextStripper reads the box's words back out of the produced document; the page's content stream carries a stroking operation whose colour is the plan's first PdfPath colour; a PdfImage op fed a PNG lands as a drawn XObject. Docs: docs/rendering.md (one plan, two emitters) and docs/pdf.md (which library each shell uses). No emulator pass."
