# TODO — active task list for MobiXournal.
#
# Single source of truth for active work (see AGENTS.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "AGENTS.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .mobix or .xopp formats can represent on disk (per AGENTS.md and docs/mobix-format.md). If a capability cannot round-trip through either format, it is out of scope."

[[task]]
id = "step-2-modern-mobile-ui"
title = "Step 2 - modern mobile interface (design system, living editors, typesetting, PDF, multi-window)"
description = "The roadmap second pillar (docs/future-roadmap.md), and the one gate it used to carry is open in the part that matters here: Step 1's data model shipped (the living families, their schema and the .xopp bridge, in FINISHED.toml), so no child here waits on another epic - while the pillar's engines are a third Step 1 epic (step-1-mobix-format-engines) that none of these children depends on. It owns five spokes - the modern design system and pen-tip radial HUD (docs/ui-modernization.md), auto-shape perfection (docs/shape-perfection-engine.md), on-device scientific typesetting (docs/latex-typst-rendering.md), the advanced PDF annotation engine (docs/pdf-annotation-engine.md) and the multi-window workspace (docs/multi-window-workspace.md) - plus the in-place editors that make Step 1 living entities editable, one family at a time (docs/mobix-elements.md). First principle, owned by ui-modernization.md (Core design principles): bands never lie on the page, transient surfaces may, and a header closes on one edge across the full width. Order of work: (1) finish the chrome and radial HUD set, and take the chrome geometry guard (guard-the-chrome-bands-as-one-geometry-contract) as the prerequisite of the first UI task started after it; (2) the living families one at a time - plot (shipped), then table, circuit, parametric shape; (3) the three engines, each starting from its riskiest child: typesetting from the offline compilation core, PDF from the magnetic highlighter, multi-window from the shared document state. Not in this epic: Phase 4 of ui-modernization.md (the desktop shell, Mica / Vibrancy) and everything in docs/desktop-workstation.md, which are Step 3. Done means: every child closed with its docs in the owning spoke, every UI child verified on the emulator per its own task flags, the chrome guard family green, the spokes asserting only what exists, and a release. Known gap: only the Pixel_Tablet AVD exists here, so a narrow (phone) screen is in no task's pass yet - the first UI child that needs it adds the device. EPIC: never implement in one pass; children are scope items (investigate, then add tasks) and atomic tasks, and it stays active until the last child ships."
