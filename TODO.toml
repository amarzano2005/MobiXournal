[[task]]
id = "stem-unicode-pdf-review"
title = "Fix the non-WinAnsi character loss in PDF export for STEM text"
description = """
`mobix-core/src/main/java/com/mobixournal/render/PdfPagePlan.kt` (and the Android/desktop painters around it) contains paths that substitute `?` for characters outside WinAnsi. That is tolerable for today's incidental labels and unacceptable the moment a `codeBlock` or a mixed scientific text box promises copyable Unicode, so it must be resolved before either ships.

Audit which text reaches which PDF path (living-element labels, math blocks, table cells, notes, future code) and reproduce the loss with a fixture containing Greek, Cyrillic, super/subscripts, combining marks and astral-plane characters. Then decide the cross-platform solution: an embedded, properly licensed font subset with ToUnicode mapping, or a documented fallback that degrades visibly instead of silently. Verify text extraction/selection from the produced PDF, not just that glyphs appear, and check Android and desktop agree. Keep the licence rule: never redistribute a font without a compatible licence.

Owners: `docs/pdf.md`, `docs/rendering.md`, `docs/guide-limitations.md`. DoD: a decision, child tasks, and a failing-then-fixed fixture. Dependency: a scientific text corpus; precedes `stem-code-block` and `stem-scientific-text` claiming full Unicode."""
