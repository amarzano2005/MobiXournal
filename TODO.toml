title = "Render and edit an infinite-canvas .mobix document"
description = "A .mobix can be an infinite canvas and the app refuses to open one. The format half is complete: MobixManifest.CanvasMode carries PAGINATED, INFINITE_VERTICAL, INFINITE_HORIZONTAL and INFINITE_2D, format/mobix/MobixChunkCodec.kt reads and writes the spatial tiles under chunks/ (chunk_<cx>_<cy>.json), MobixDocument.forInfinite creates one, and render/CanvasAutoSlicer.kt already knows how to measure and slice living content for a continuous strip. The app half is not: docs/mobix-format.md records the refusal (a chunked document would be rewritten as a paginated one, which is why it is refused rather than opened as an empty page list) and calls the engine that lifts it a later step - and that step is in no task. Working it is an investigation first: how far the existing layout, viewport and auto-slicer go, what an unbounded viewport does to the surface coordinate system and to everything that assumes a page list (the page counter, the rail pages button, bookmarks, the zoom badge, split view, search), how a chunk is materialised, evicted and written back, and what a new-document flow for a mode other than paginated looks like. Add the atomic tasks that come out, smallest first, so a chunked document can be created, shown, written on and saved without ever becoming a paginated one."
