[[task]]
id = "desktop-guides-slot-and-chooser"
title = "Desktop guides: the guides slot, its chooser and the tab's guide"
description = "Give the window the tablet's guides surface, on the shared geometry. (1) Add `DesktopTool.SETSQUARE(\"Setsquare\", \"Q\")` and `DesktopTool.COMPASS(\"Compass\", \"Shift+Q\")` to `desktop/src/main/java/com/mobixournal/desktop/ToolSelection.kt` (both letters are free: the table's existing keys are B,H,G,E,Shift+E,Shift+V,V,S,Shift+S,X,Y,Shift+T,L,A,Shift+A,R,C,Alt+R,Alt+Z,P,M,Shift+X,T,K,Shift+K,Alt+K), and put them in ONE slot - `ToolGroup(listOf(DesktopTool.SETSQUARE, DesktopTool.COMPASS))` in `DESKTOP_TOOL_GROUPS` (`ToolGroups.kt`), after the selection pair and before the figures. (2) Add both to `DESKTOP_TOOLS_THAT_ACT` so `ToolGroupsTest`'s two-way rule stays satisfied. (3) `inkTool()` (`DesktopPen.kt`) must keep answering null for both, which is what makes `DesktopTool.inksByPackets()` false - a guide drag is not ink and the pen's packets stand aside for it; assert it in the test, as `DesktopSelectionTest`/`DesktopTextAuthoringTest` do for their slots. (4) The view state, in a new `desktop/src/main/java/com/mobixournal/desktop/DesktopGuides.kt`: `data class DesktopGuidePose(val page: Int, val guide: DrawingGuide)` held on `DesktopTab` (`DesktopTabs.kt`) as snapshot state `var guide: DesktopGuidePose? = null`, plus `placeGuide(kind: GuideKind, page: Int, centre: Pair<Double, Double>)` using the shared `GuideKind.place` (the page's visible centre comes from `DesktopTab.visiblePageCenter`), `clearGuide()`, and `projectGuide(pose, page, x, y)` answering the point unchanged when no guide is placed or the guide is pinned to another page - the tablet's own rule (`GuideDrag.project(boxIndex, ...)`). Record the DECISION this task exists to settle: a guide is **view state, never a document element** - the tablet's answer is that nothing about a guide reaches the document, only the resulting stroke does - so it is not written to .mobix or .xopp and it is dropped when the tab closes; remembering it across a restart is deliberately not part of this scope. (5) The slot's face is the placed instrument's glyph (`ToolGlyph.SETSQUARE` while none is placed, `ToolGlyph.COMPASS` when the compass is), and its picker is the tablet's menu trimmed to this scope - Off / Setsquare / Compass - as a new guides branch in `slotSurface` (`ToolGroups.kt`) beside the circuit-palette and figure-variant cases, drawn on the window's glass (`FloatingSurface`, `DesktopTheme` tokens) with the catalogue glyphs and the tablet's own labels. Picking an instrument places it on the current page; picking Off clears it and hands the tool back to the last acting tool through `ToolToggle`'s existing family rule, exactly as the two erasers already do. Tests: `ToolGroupsTest`/`ToolStripsTest` for the new slot and its two members; a pure `DesktopGuideChooserTest` for the three rows, for placing at the page centre, for Off clearing and handing the tool back, and for a guide pinned to page 0 being invisible to page 1; `DesktopThemeTest`'s per-slot glyph coverage; `InkShortcutsTest` if it enumerates the shortcut table. Verification: `gradlew.bat :desktop:test :app:testDebugUnitTest` on JDK 21. Docs: `docs/desktop-ui-layout.md` (both shortcut rows), `docs/ui-modernization.md`'s tool table, `docs/drawing-tools.md` (the chooser has the window's copy; the guide is view state on both shells) and README's desktop section. Regenerate the packaged window before closing."
