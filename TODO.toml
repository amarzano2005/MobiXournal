# TODO — active task list for MobiXournal.
#
# Single source of truth for active work (see AGENTS.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "AGENTS.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id> --shipped` to move it to FINISHED.toml; the archive records what the task delivered (files, behaviour, tests, docs, and what it deliberately did not do), not the plan it was picked up from."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .mobix or .xopp formats can represent on disk (per AGENTS.md and docs/mobix-format.md). If a capability cannot round-trip through either format, it is out of scope."

[[task]]
id = "desktop-guides-geometry-into-mobix-core"
title = "Desktop guides: move DrawingGuide and the grab rules into mobix-core"
description = "The setsquare/compass geometry already exists and is already pure, but it lives in app (`app/src/main/java/com/mobixournal/render/DrawingGuide.kt`: the sealed `DrawingGuide` with `Setsquare`, `Compass`, `Protractor`, `Ruling` and `Chemistry`, plus `GuideKind` and the `GRAB_PT`/`DEFAULT_SIZE_PT`/`DEFAULT_RADIUS_PT`/`MIN_SIZE_PT` companion). It depends only on kotlin.math, `Snapping` and `TriangularLattice`, both already in mobix-core, so this is the same move `Snapping` and `VerticalSpaceOps` already made: MOVE the file to `mobix-core/src/main/java/com/mobixournal/render/DrawingGuide.kt` keeping the package `com.mobixournal.render` (so no call site changes: `GuideDrag`, `DrawingSurfaceView`, `EditorScreen`, `GuidePose`, `AppSettings` and `AppSettingsBackup` keep compiling untouched), and MOVE `app/src/test/java/com/mobixournal/render/DrawingGuideTest.kt` to `mobix-core/src/test/java/com/mobixournal/render/DrawingGuideTest.kt` unchanged (it is a plain JVM test). Then lift the pure grab rules out of `app/src/main/java/com/mobixournal/render/GuideDrag.kt` into the shared file, so the two shells cannot disagree about where an instrument is held: `fun grabHandle(): Pair<Double, Double>` (the setsquare's long-leg tip `corners()[1]`, the compass's pencil point `(x + radius) to y`, the protractor's `tip()`, and the anchor for `Ruling`/`Chemistry`, which have nothing to hold) and `fun grabbableBody(px: Double, py: Double, reach: Double): Boolean` (the setsquare's `contains` interior, the compass within `reach` of its hub, the protractor's `contains`, false for the two invisible rules). `GuideDrag.tipOf`/`bodyHit` become one-line delegates to them; `GuideDrag` keeps its MotionEvent/StackedLayout plumbing and stays internal to app. Add the cases to the moved `DrawingGuideTest`: each instrument's handle, a press inside the setsquare is a body grab while a press on one of its edges is not (the edge belongs to the pen), the compass's hub is a body grab and its circumference is not, and a ruling/chemistry guide answers neither a handle nor a body. Verification: `JAVA_HOME` = JDK 21 then `gradlew.bat :mobix-core:test :app:testDebugUnitTest` - the app's `GuidePoseTest`, `AppSettingsBackupTest` and `DrawingGuidePopupTest` must stay green untouched - plus `DocsGuardTest`/`SourceStructureTest`. Docs: `docs/repo-layout.md` (the two file rows move from the app's render block to mobix-core's), `docs/codebase.md`'s list of what moved into the core, and `docs/drawing-tools.md` naming the shared file; keep every spoke inside the 300-line budget. Regenerate the packaged window (`gradlew.bat :desktop:createDistributable`) before closing."
