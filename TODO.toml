[[task]]
id = "stem-study-cards"
title = "Review cards whose answers are hidden by interaction, not by black ink (F21)"
description = """
There is no study content type: hiding an answer today means covering it with ink, which is a visual trick and not a promise. Physics and maths revision is a plausible daily use for this app, and it needs its own small model.

User story: create a card with a question and an answer that is hidden until tapped, annotate an attempt, link the card to a formula or a calculation, and export questions only or questions with solutions - deliberately, never accidentally.

Design `studyCard`: front, answer as text/formula/reference, `revealPolicy`, ids, and a view state kept outside the document by default; decide explicitly whether saved progress is personal local data or shared document data. State plainly, in the guide, that this is not redaction - anyone holding the file can read the answer - and that PDF/`.xopp` export must offer an explicit choice of questions or questions-and-answers, never assume an opaque rectangle hides anything.

Child tasks: S1 model + codec + fixture; S2 reveal/reset gesture, undo and keyboard; S3 create from selection; S4 export policy and interop; S5 no auto-reveal in any export. Acceptance: study works with nothing lost, and a third-party reader sees a documented, honest representation. Dependency: the new-type gate and the export rules from `stem-semantic-export`."""
