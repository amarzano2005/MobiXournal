[[task]]
id = "desktop-search-ui"
title = "Desktop: the header's search field, the results section and the page highlight"
description = "The header's search field the old scope deliberately reserved: `Header.kt`'s band grows a search capsule in the app's own glass (`docs/interface-contract.md` §1: a material class, tokens only, a glyph from the catalogue, English copy) with the placeholder \"Search document…\" and a `3 / 17` counter while a query is up. Keys: `ShellCommand.FIND` in `DesktopKeys` on `Ctrl+F` opens and focuses it, `Enter` steps to the next hit, `Shift+Enter` to the previous, `Esc` clears the query and closes the field, and the field's clear glyph empties it — each control with its five states, and no shortcut that steals a key an editor surface owns (`TextEditor`). Results go in `PageSidebar` as a section under the layers, built like `PdfContentsSection` (filled only while a query is up, one row per hit: page number, snippet, the current row marked); a row click calls `selectPage` and makes that hit current. The current hit's `SearchHit.boxes` are painted as chrome over the page in `PageCanvas` above the sheet — the accent wash at the same translucency `drawPdfTextSelection` uses, with a one-screen-pixel outline, mapped through the sheet's zoom and density — so a hit is visible without touching the ink. The status bar shows the count next to the page counter while a query is up, and the whole flow reads from `DesktopTab.search` (task desktop-document-search-results), never re-running the walk from the UI. Tests: an `ImageComposeScene` render of the field and of the results section in the `desktop/build/desktop-render/` convention, and a test that a hit's page-point box maps to the right screen rectangle at two zooms. Docs: `docs/desktop-workstation.md`, `docs/desktop-ui-layout.md` (the band's contents), README desktop section."
