[[task]]
id = "desktop-karaoke-replay"
title = "Desktop: karaoke replay, the writing follows the recording"
description = "The writing follows the recording in the window as it does on the tablet. (1) Shared: move the pure half of app/render/KaraokeStrokeAnimator.kt into mobix-core render/ - State, RenderDirective, resolve, pointTimeMs, seekTimeMs, dimmedColor, isMatchingRecording - leaving in the app only the Canvas tip painter and the DrawingSurfaceView extension; KaraokeStrokeAnimatorTest moves with the pure half, and the tablet's own suite is the oracle that its painting did not change. (2) Frame loop: while a clip sounds the window posts one frame per vsync through Compose (withFrameNanos in a LaunchedEffect over a DesktopKaraokeDriver state), stopped on stop, on completion and when the tab closes - the tablet's KaraokeFrameDriver is the model, including its rule that a pause publishes once and then stops. (3) Paint: the page painter applies the directive per stroke - strokes the recording has not reached dimmed at DIMMED_ALPHA_FACTOR, the one being written drawn as its visible prefix with the glowing tip - and, exactly as the tablet cannot blit a page out of its ink cache while a clip sounds, the page is painted directly rather than from PagePicture for as long as a clip sounds, because a cached picture holds the recording as finished. (4) Tests: the moved core tests; a render test with a fake playhead that a page painted before a stroke's start shows it dimmed and painted after its end shows it whole, and that the loop publishes once and stops while held; a scene test that turning the page while sounding drops the state. Docs: docs/audio-inking-sync.md (mode 1 on the window), docs/desktop-workstation.md (A stroke costs the stroke gains the exception), README. Verify :desktop:test :mobix-core:test :app:testDebugUnitTest and regenerate the distributable."
