[[task]]
id = "desktop-pdf-import-page-builder"
title = "Desktop: build the pages of an imported PDF"
description = """
New `desktop/src/main/java/com/mobixournal/desktop/DesktopPdfImport.kt`, a JVM twin of `app/src/main/java/com/mobixournal/render/PdfImport.kt`: `object DesktopPdfImport` with `fun pages(pdf: PDDocument, reference: String?, pageNoOffset: Int = 0): List<Page>` and `fun document(pdf: PDDocument, reference: String): Document`.

Behaviour, page for page, exactly the shape the tablet's importer documents: one `Page` per PDF page, `width`/`height` from `PDPage.mediaBox` in points (the unit `.xopp` and `PdfImport` use, so the sheet matches the PDF page), `background = Background.Pdf(filename = if (i == 0) reference else null, pageNo = i + pageNoOffset, domain = if (i == 0 && reference != null) ABSOLUTE_DOMAIN else null)` and `layers = listOf(Layer(emptyList()))` so the page has something to draw on. `ABSOLUTE_DOMAIN` is the constant `PdfImport` uses (`"absolute"`); take it from where it already lives rather than spelling a second one. A PDF that cannot be opened, or has no pages, is refused with a sentence a reader can act on (the copy rule is `docs/ui-modernization.md`; `describeOpenFailure` in `OpenFailure.kt` is the pattern) — never a stack trace, never an empty document.

The page count and the page sizes are the only things `PdfPageCache` was needed for, so nothing of Android enters this: `PDDocument` is the desktop's own `org.apache.pdfbox`.

Verification: new `desktop/src/test/java/com/mobixournal/desktop/DesktopPdfImportTest.kt`. Build a three-page PDF in the test with `PDDocument`/`PDPage` the way `DesktopPdfExportTest` does, then assert: the page count; each page's size equals its media box; only page 0 carries `filename` and `domain`, the others `pageno` alone; `pageno` runs 0,1,2 and `pageNoOffset = 5` shifts it to 5,6,7; `document()` gives one layer per page. Then assert the desktop renders it through the existing path: `PageBackdrop(bundled = { null }, documentDir = null).sourcePdf(pages.first().background as Background.Pdf)` answers a document with three pages (the absolute path arm of `PageBackdrop.fileOf`, no Skia needed).

Docs, same commit: `docs/pdf.md` (the import paragraph gains the desktop half — one page per PDF page, the first carrying the reference), `docs/desktop-workstation.md`. Desktop only: no APK, `rebuild = false`."""
