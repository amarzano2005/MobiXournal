[[task]]
id = "stem-scientific-tables"
title = "Tables with cell formulas, ranges and references (F04)"
description = """
`TableElement` has textual cells, a codec, `TableInk` and a cell editor, but a cell cannot hold `=B3/A3`, a range or a unit, so a lab table cannot recompute when a measurement changes. This is the single most requested practical workflow after plain calculation.

User story: build a table with `time (s)`, `distance (m)`, `speed (m/s)`; the third column holds `=B3/A3`; `SUM`, `AVG`, `MIN`, `MAX` work over ranges; changing a measurement updates dependants; the sheet can feed a plot.

Audit `TableElement`, `TableCell`, `MobixTableCodec`, `TableInk`, `TableElementFactory`, `TableCellEditorModel`, `TableCellEditorDialog` and selection/undo. Then make the one decision this scope exists for: extend the known `type` compatibly, or add `type=scientificTable` with stable row and column ids and typed cells (literal / formula / error). Do not rewrite `TableCellEditorDialog` and do not turn every existing table into a spreadsheet: conversion must be an explicit 'Convert to scientific table' action, reversible by copy, and old documents are never converted automatically. `A1` is a user-facing notation; internally prefer stable row/column ids with a documented policy for insert and move.

Child tasks: T1 cell schema and row/column ids; T2 formula parser with cell dependencies, cycle and missing-reference diagnostics, bounded depth; T3 explicit conversion from `TableElement`; T4 a non-invasive editor adaptation; T5 PDF/`.xopp`/CSV and interop; T6 load/save/undo and formula-error states. Keep dates, locale-sensitive parsing and drag-fill semantics out of the MVP and say so.

Acceptance: `=B2*C2`, range sums, divide-by-zero and cycle errors, missing reference, incremental recompute, CSV round-trip, faithful `.xopp`, and untouched legacy tables. Dependency: F01-F03 and the forward-field-preservation policy."""
