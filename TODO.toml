[[task]]
id = "stem-physical-units"
title = "Physical quantities, SI dimensions and unit conversion (F02)"
description = """
No quantity model exists: `5 kg * 3 m/s^2` can only be drawn. Every later feature - calibrated measurements, dataset columns, table units, simulations - needs the same canonical representation, so it must be designed once and not per feature.

User story: write `v=10 m/s` and obtain `36 km/h` on request; define `m=5 kg` and `a=3 m/s^2` and read `F=m*a` as `15 N`; type `3 m + 2 s` and get 'incompatible units' while the expression stays intact.

Specify: the seven SI base dimensions, linear and affine unit transforms (an absolute °C is not a metro, and a temperature delta has no offset), a parser for units separate from the expression parser, locale-independent stable unit identifiers (never display labels or `java.util.Locale` in the data), and the error taxonomy. Reuse the evaluator contract from `stem-page-calculations`; watch precision, overflow and equivalent symbols.

Child tasks: U1 the unit table plus a conversion suite; U2 quantity/evaluator with the limit cases; U3 the 'Convert unit' UI action on both shells; U4 codec, spec entry and external fixtures; U5 formatting in PDF/CSV. Acceptance: `10 m/s = 36 km/h`, `N` and `kg·m/s²` agree, `m+s` is rejected without deleting the source, absolute vs delta temperature correct, and a third-party reader can convert using only the published table. Dependency: `stem-page-calculations` evaluator contract, `mobix-spec-v1` for the published unit identifiers."""
