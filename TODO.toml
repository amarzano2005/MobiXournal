id = "desktop-pdf-import-command-and-modes"
title = "Desktop: Import PDF command, its REPLACE/APPEND question and the two outcomes"
description = """
The command and its two answers, wired end to end. Four pieces:

(1) `DesktopMenu.kt` — a chip *Import PDF* in the export row beside *Export PDF*, wearing `ChromeGlyph.PDF`, always enabled (REPLACE needs no open document), with `onImportPdf: () -> Unit` on `MenuPanel`/`HeaderMenu` threaded exactly like `onExportSvg`. No new `ShellCommand` and no key: `onExportSvg` is the precedent, and `ShortcutTableTest` stays untouched.

(2) `DesktopApp.kt`'s `DocumentDialogs` — `fun importPdf()`: a `FileDialog(window, "Import a PDF", FileDialog.LOAD)` filtered on `.pdf` (its filter is ignored on Windows, as `chooseDocument`'s comment says), then the question card. New `desktop/src/main/java/com/mobixournal/desktop/ImportPdfDialog.kt` in the window's own grammar (the material and the words of `docs/interface-contract.md`: two rows with a sentence each, the accent on the answer that keeps the work, Cancel): *Add the pages to this document* (the default) and *Replace this document*. A `.pdf` that will not open is reported through the failure card the window already has.

(3) `DesktopShellState.importPdf(file: File, mode: ImportPdfMode)` in a new `DesktopPdfImportCommands.kt` beside `DesktopShellSaves.kt` (`ImportPdfMode` is already `app/.../render/ImportPdfMode.kt`, REPLACE/APPEND, reusable). REPLACE opens the built document in a **new tab** and never discards the open one: the tab is unsaved, dirty, named after the PDF with the default container's suffix in the PDF's own folder, so `Ctrl+S` proposes `<name>.mobix` beside it; `DesktopTabs.newBlankDocument` (`DesktopTabs.kt`) is the pattern to mirror — add an `adopt(...)` beside it that takes a model, a container and a proposed file rather than forking the tab class. APPEND records `tab.document.snapshot()` first, swaps the model for `PageOps.appendPages(...)` of the built pages, and drops a lone untouched blank sheet before appending (the tablet's rule in `DrawingSurfaceView.appendPages`); the tab is left dirty with exactly one undo step, and `Ctrl+Z` returns to the old page count.

(4) Nothing else: no reader, no cache, no second format. `PageBackdrop` already paints the reference.

Verification, in `DesktopPdfImportTest.kt`: a fixture PDF three pages long; REPLACE with a document open leaves that document and its tab untouched and adds one tab holding three PDF pages, dirty, with the proposed name; APPEND onto a fresh blank page yields exactly three pages (not four — the blank sheet is dropped); APPEND onto a two-page document yields five, dirty, and one `undo()` gives two again; a cancelled question changes nothing. A render test is not required: the dialog is a card and the state cases are the behaviour.

Docs, same commit: `docs/desktop-workstation.md` (What the window does — the import and its two answers), `README.md` (the menu list and the import), `docs/pdf.md`. Desktop only: `rebuild = false`."""
