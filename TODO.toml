[[task]]
id = "desktop-export-svg-one-file-per-page"
title = "Desktop: export the active document as one SVG per page"
description = "The window writes .xopp and .mobix and no picture at all. The vector half already exists and is platform-free: mobix-core/src/main/java/com/mobixournal/render/PageSvgWriter.kt serialises a Page of this model - strokes with their alpha, fills, text, images and LaTeX as data: URLs, the sheet fill and its ruling including the isometric mesh - so the desktop export is a driver, not a second renderer. What the writer cannot draw is the picture a page sits on: it reads Background.Solid and stops, so a page written over an annotated PDF would export blank paper. (1) In mobix-core add an overload write(page: Page, backdrop: ByteArray?): String that emits one <image> covering the page box under the ink (the same data: URL encoder emitImage already uses) when the argument is non-null, and leave write(page) delegating with null so the tablet's page export (app/.../render/DrawingSurfacePaint.kt, SelectionTransfer.kt) and every existing test are unchanged - the assertion is that the two shells produce the same SVG for the same page. (2) Add desktop/src/main/java/com/mobixournal/desktop/DesktopSvgExport.kt: object with write(document: DesktopDocument, folder: File, backdrop: (Background) -> ByteArray?): List<File>, one file per page named <document-name>-p<NNN>.svg with the number padded to the page count's digits, each staged in a temp file in the same folder and moved over its name (the atomic replace DesktopSaves already uses), so a crash mid-export cannot leave a truncated page. The backdrop lambda is the caller's: it turns PageBackdrop.image(background) into PNG bytes (toAwtImage + ImageIO.write) at the page's point size. (3) Verify in desktop/src/test/java/com/mobixournal/desktop/DesktopSvgExportTest.kt: a two-page document writes exactly two files with those names and each parses as XML whose width and height are the page's; a PDF-backed page's file carries one <image> and a ruled page's carries none while still carrying its <line> ruling; and for a page with no picture the file's text equals PageSvgWriter.write(page) exactly, the check that the shells cannot drift. Docs in the same commit: docs/rendering.md (the writer's backdrop parameter and who supplies one), docs/desktop-workstation.md, and README's Export bullet in user-facing words. No emulator pass: the window is a JVM program."
