id = "desktop-settings-toolbar-placement"
title = "Desktop: where the tool strips stand - top, side or both, and which edge"
description = "The row the user asked for by name: the tool strips must be placeable along the TOP as well as at the SIDE. Today ToolPlacement in desktop/src/main/java/com/mobixournal/desktop/DesktopSettings.kt is Rail/Ribbon/Both, with no way to change it from the window (the header chooser was removed on purpose, Header.kt) and no left/right choice; the phone offers exactly this in its Toolbar section (AppSettings.toolbarPosition LEFT/RIGHT in app/src/main/java/com/mobixournal/ui/AppSettings.kt, page in app/src/main/java/com/mobixournal/ui/ToolbarSection.kt), and its figures toolbar sits in the top bar. Replace the enum with StripPlacement (SIDE, TOP, BOTH) plus RailSide (LEFT, RIGHT), stored under the existing interface.toolPlacement key with a migration in StripPlacement.of that still reads the old names Rail, Ribbon and Both, and a new interface.railSide key defaulting to LEFT. PageWorkspace in desktop/src/main/java/com/mobixournal/desktop/DesktopWorkspace.kt lays the rail on the chosen edge (left: after the page sidebar, before the canvas; right: after the canvas, before the inspector lane) and the ribbon as a band under the header for TOP and BOTH, so the page keeps the rectangle that is left and nothing is ever drawn over the sheet (docs/chrome.md). The change applies live through DesktopShellState.setToolPlacement. Interface rows: a three-way Top / Side / Both choice and, while a side is drawn, Left / Right labelled for the writing hand exactly as the phone labels it. Tests: a new DesktopSettingsTest (round-trip of both keys, and the legacy names Rail/Ribbon/Both read back as SIDE/TOP/BOTH from a properties file already on disk) and DesktopStripLayoutTest, which renders PageWorkspace and asserts the rail lane sits right of the canvas under RailSide.RIGHT and that StripPlacement.TOP draws the ribbon and no rail. Docs: docs/desktop-workstation.md (Interface, the placement rule) and README (the window's toolbars)."
