[[task]]
id = "mobix-cli-extract-export"
title = "Extract what a document carries without letting it write where it wants"
description = "Add `extract` and `export-json`. `extract` writes chosen entries (a page, a chunk, one asset, or everything) under a destination directory, refusing any name that escapes it (absolute paths, `..`, symlinked targets), refusing to overwrite unless `--force`, and never inflating more than a stated cap per entry or in total; the entry name it writes is derived from the archive's own name, never from JSON inside the document. `export-json` prints a stable document dump — manifest, canvas, per-page summaries with their element ids and families, per-asset name and size — with audio and images listed by name and size and **not** decoded, so a script can diff two documents. Tests: a hostile archive whose entry name is `../../escape.txt` writes nothing outside the destination and fails with a finding; an archive with an oversized entry is refused at the cap; `export-json` over two fixture versions produces a byte-identical diff when the document is unchanged."
