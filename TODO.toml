title = "Guard the chrome's bands as one geometry contract"
description = "The principle that bands never lie on the page, and that a header closes on one edge, is discipline today: the two failures it exists to prevent (a pane-local tab band leaving a notch of desk inside the header's own bottom edge, and a rim-less bar stacked over a slab reading as two bars) both shipped and were found by eye. Make it mechanical, as the prerequisite of the first UI task in this epic started after it, next to the system-bar guard (guard-the-system-bars-as-one-transparent-contract). One test in app/src/test/java/com/mobixournal/guards/ reading the layout sources the way SourceStructureTest reads the tree, pinning three properties: (a) the chrome's bands and the canvas partition the window in every combination - Standard and Compact, rail left and rail right - so no band rectangle can intersect the canvas's; (b) the header is one Surface whose closing edge spans what the bar spans, with the tabs row inside it rather than a slab beside it, so its bottom edge is drawn once across the full width; (c) the rail's lane begins at the header's bottom, not at the bar's row. Keep the matrix of combinations in one table so a new layout mode has to be added there instead of slipping past. Verify: the guard fails on the pre-fix shapes (TabStrip outside EditorTopBar's Column, a pane-local TabBand, a lane started at the bar's height) and passes on the current tree - that is what makes it a guard rather than a comment."
