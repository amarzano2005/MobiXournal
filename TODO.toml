[[task]]
id = "step-1-mobix-format-engines"
title = "Step 1 - the native .mobix format (the engines it promises and does not run)"
description = """
The roadmap first pillar (docs/future-roadmap.md), carried for the third time and this time for what the first two left running rather than planned: step-1-native-mobix-format closed the data model (the PKWARE container, the schema, the living families, the math engine) and step-1-mobix-format-remainder closed the infinite canvas, audio and plugin scopes believing them built - and the format half of each did land, while the app half did not. No user-facing interface can exceed the data model beneath it, so the pillar is not finished until these run: the two container engines now do run - a `.mobix` opens page by page (`format/mobix/MobixPagedReader.kt`, carry-the-page-source-into-the-editor) and a save repacks only the pages that moved (`MobixIncrementalSaver.kt`, repack-only-the-pages-a-save-changed) - and what the second one left open is the rest of this step: neither engine has been seen on a device (verify-the-paged-mobix-open-and-canvas-on-the-emulator), the adoption is per page so a save with no source to repack over still drops a bundled picture or recording (supply-a-deferred-payload-on-a-save-that-has-no-source), and a page drawn without the background it names is silent rather than reported (report-a-mobix-page-whose-background-is-missing); the inking telemetry is captured and stored and consumed by nothing (tilt, azimuth and dtMs, a barrel roll nowhere, and KaraokeStrokeAnimator has no caller); an infinite-canvas document can be written by this app and not opened by it; and a recording does travel inside the container now (carry-the-audio-recording-inside-the-document), but as a WAV where the format doc asks for Opus, with nothing yet replaying the writing in time with it (record-and-bundle-opus-audio, docs/audio-inking-sync.md). The three scopes carrying those last three gaps were investigated and closed with the atomic children they broke into. (3) The schema and inking payoff: log-tilt-and-azimuth-in-the-pen-diagnostics-panel (471) and store-a-genuine-zero-tilt-instead-of-dropping-it (472), after the doc correction landed with them - docs/mobix-format.md, docs/future-roadmap.md, docs/mobix-elements.md and docs/stylus.md now say that tilt and azimuth are the platform own radians, that barrel roll is not obtainable on Android and so is in no schema, and that telemetry never drives the drawn width, which is the written decision that keeps tilt- and speed-driven width out. The diagnostics finding: the panel prints pressure only, so whether a pen reports tilt at all is unanswerable on the device that has the pen. (4) The canvas engine, smallest first: open-a-chunked-mobix-and-save-it-back-as-chunks (481), create-a-new-document-in-an-infinite-canvas-mode (482), render-a-chunked-document-as-an-unbounded-canvas (483), write-strokes-into-a-chunk-and-keep-them-across-eviction (484), save-only-the-chunks-a-session-changed (485), make-the-chrome-tell-the-truth-for-a-document-with-no-pages (486), export-an-infinite-document-through-the-auto-slicer (487). The investigation found the format half complete and the app half missing: MobixDocument.open reads chunks, toDocument maps them to pages, of() and forInfinite write them; the refusal lives in MobixPagedReader, DocumentIo never passes a canvas mode, setInfiniteCanvas and ChunkTileManager have no caller, every edit path is keyed by page index, and CanvasAutoSlicer has no caller either. (5) Audio last: publish-the-audio-playhead-from-the-player (501), drive-the-surface-karaoke-state-from-the-playhead (502), draw-the-karaoke-directive-on-the-canvas (503), scrub-the-recording-and-the-ink-together (504), seek-to-the-point-not-the-stroke (505) - KaraokeStrokeAnimator.resolve, its State and the DrawingSurfaceView.karaokeState property all exist and are unwired, and AudioPlayer exposes no playhead at all; the first cut is playback, with scrubbing and point-precise seeking as their own tasks, and record-and-bundle-opus-audio stays open. Order of work: step (3) and step (4) in parallel, step (5) last, as the pillar lists it. Not in this epic: everything Step 2 owns (step-2-modern-mobile-ui) and Step 3 (docs/desktop-workstation.md). Done means: every child closed with its documentation in the owning spoke, docs/mobix-format.md asserting only what the document path actually does, both container engines measured rather than assumed, the chunked path round-tripping on a device, and a release. Known gaps: the desktop half cannot be exercised here - no Xournal++ on this machine, so plugins/mobix-importer is covered by its JVM test alone and a real desktop round trip is outside any pass - and the host this epic was worked on has no AVD and no system image either (adb is present, the AVD list is empty), so every emulator_debug=yes child in this epic is queued for a machine that has a device. EPIC: never implement in one pass; children are scope items (investigate, then add tasks) and atomic tasks, and it stays active until the last child ships.

Where it stands (2026-10-16). Three more children landed JVM-verified, all with their docs in the owning spoke: record-and-bundle-opus-audio (commit 5076db6 - a `.mobix` records Ogg/Opus, a `.xopp` keeps the desktop's WAV, the bundled entry is `assets/aud_<sha256>.ogg`, and nothing pretends to transcode on export), split-the-chunk-half-out-of-mobixdocument-kt (a7f41c5 - the chunk half is `format/mobix/MobixChunkWriting.kt` and the file-budget ceiling for MobixDocument.kt is gone) and give-the-shaded-area-a-control-that-sets-its-bounds (a3c8b56 - the plot editor owns shadeIntegral, and the summary's integral follows it). What is left is the three device passes the epic's own known gap describes: write-strokes-into-a-chunk-and-keep-them-across-eviction, make-the-chrome-tell-the-truth-for-a-document-with-no-pages and verify-the-paged-mobix-open-and-canvas-on-the-emulator (whose step (6) covers bundled audio playback and its new step (7) the Opus size comparison), plus the shade control's own emulator pass (drag-the-plot-shade-bounds-on-the-emulator). Every one of them is code-complete and green on the JVM; none has been seen on a screen, because this host still has no adb and no AVD."""
