[[task]]
id = "step-3-desktop-workstation"
title = "Step 3 — Desktop workstation program (epic)"
description = "The milestone, and the decisions behind it. MobiXournal Desktop is the native workstation app for WINDOWS 11 ONLY (decision 2026-10-21: no Linux, no macOS, no plugin system) that opens the same documents as the tablet editor, on a graphics tablet, for 21:9 monitors and 144 Hz, with bimanual shortcuts, living-entity editing and tablet rotary-dial support. Decisions taken 2026-10-21 and recorded in docs/ui-modernization.md: the chrome is the app's own glass on a true-black desk (not Mica), the tools live in BOTH a vertical rail and a top ribbon with a setting that switches between them, and the shared core is the plain kotlin-jvm module both shells depend on (mobix-core). Shipped phases: the shared core (mobix-core: ink, paper and paper geometry), the complete reader (.mobix and ZIP .xopp, tabs, Ctrl+B sidebar, zoom and pan, the decided chrome, both placements), editing (pressure inking through the shared router, both erasers, the geometry slots, vertical space, undo and redo, Save and Save As under the sticky format policy, the paged page window), the graphics tablet (Wintab and Windows Ink, the packets path, the dial's notch) and 144 Hz render pacing (the page recorded once, scroll and zoom as replays, a lift costing the stroke). What remains is the open work of TODO.toml and nothing else: this epic owns no plan of its own, so read the list. Its ordering is the owner's: (1) every tool equivalent to the tablet's, including the complete icon-to-glyph adaptation, (2) the Settings section, (3) audio recording and playback, (4) everything else - the strip's groups and pickers, selection, text and math, STEM placement, living-entity editing, PDF annotation, images, the radial HUD, undo/redo controls, ultrawide layout, export, page management and search, extra windows, the MSI, and stroke-head prediction. Done means: every phase closed with its docs updated in the owning spoke, the desktop suite green on the host (no emulator), a packaged binary that opens .mobix and .xopp, README documenting it, and the 144 Hz and tablet results confirmed by the owner on real hardware. Never implement in one pass: children are scopes where the code must be investigated first, tasks where the work is already clear."
status = "active"
level = "epic"
category = "feature"
urgency = "normal"
order = 990
created = 2026-10-21
tags = []
rebuild = false
emulator_debug = false

[[task]]
id = "tablet-a-ring-section-in-settings-mirroring-the-window-s"
title = "Tablet: a Ring section in Settings, mirroring the window's"
description = "Give the Android editor a Ring section like the window's (docs/desktop-settings.md, *Ring*): the same three families — the palette swatches, the three pen widths and the writing tools — each on or off, stored so the ring is rebuilt from them when it opens, plus a reset. Read RingContents (desktop/sheet) and the tablet's radial HUD settings first: the shared model is mobix-core's RadialHud, so the tablet's page should choose the same three families rather than invent a fourth meaning of a notch. The tablet's ring currently always carries all three, and docs/ui-modernization.md says so; the shared keys are ring.swatches / ring.widths / ring.tools. Verify on the Pixel_Tablet AVD: ring contents follow each switch, an emptied ring does not open, and a restart reads the answers back. Docs: docs/ui-modernization.md (the HUD spoke), README, and the tablet's settings spoke."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 1000
created = 2026-11-01
tags = ["app"]
rebuild = true
emulator_debug = true

[[task]]
id = "read-ink-on-the-stroke-lift-in-the-window-with-a-per-page-cache"
title = "Read ink on the stroke lift in the window, with a per-page cache"
description = "Make the PC window's handwriting reading immediate without shipping a model: after a stroke settles (~300 ms) recognise the touched line through the existing WinRT line call (InkLineEngine in WinInk.kt) instead of waiting for the first search query, keep the reading in the tab's HandwritingCache (DesktopHandwriting.kt) keyed by the edit count so a query reuses it, and start the per-page walk when a document opens rather than on the first query (DesktopSearch.kt / DesktopTabs.kt). Verify with DesktopSearchTest: a line written on the page is readable before any query, an untouched page is recognised once, an edited page is read again; then run the packaged window on a real notebook and record lift-to-reading and open-to-ready in docs/search.md."
status = "active"
level = "task"
category = "feature"
