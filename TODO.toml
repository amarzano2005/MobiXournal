[[task]]
id = "stem-dataset-laboratory"
title = "CSV in, statistics and a regression plot out (F13)"
description = """
There is no dataset concept at all: a table is a page element with textual cells, which cannot hold ten thousand rows, and there is no import path, no column typing, no units per column and no plot fed by data. Every science lab workflow stops here.

User story: import `experiment.csv`, see columns, units, row count and missing values, compute statistics, plot time against distance, fit a line with its equation and R², and re-export the measurements as CSV; changing a value marks dependants stale rather than freezing the pen.

Separate the two cases explicitly: a hand-typed table with a few formulas is `stem-scientific-tables`; a large dataset is a new `datasetView` element referencing a content-addressed asset (`assets/dat_<sha256>.csv`), with a new `AssetKind` only after the spec allows it. Audit `MobixAssets`, `MobixDocument`, `MobixPagedReader`, `PlotElement` and existing CSV routes, and measure memory on large files. Storage keeps hash, delimiter, encoding, header, column types and units, source row count; indices and aggregates are derived caches. An external CSV path is not a portable document and must say so (`mobix-portable-assets`).

Child tasks: D1 streaming CSV import with quoted fields, delimiters and a fixture set; D2 `datasetView` + asset + codec; D3 statistics with diagnostics (count, median, mean, sample variance, min/max); D4 scatter and OLS linear regression through the existing plot engine, with degenerate-case states; D5 CSV export and validator support; D6 UX and a benchmark proving no stall. Acceptance: S2 complete, 10k rows handled without freezing on the baseline device, re-exported CSV coherent, and the plot legible in a reader that knows nothing about the editor. Dependency: F02 for column units; the dataset can land before F04."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
