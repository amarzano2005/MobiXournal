id = "mobix-cli-validate"
title = "Validate a document the way a third party would, and say which rule failed"
description = "Implement `validate` in the CLI against `spec/CONFORMANCE.md` row by row: `mimetype` first and STORED, ZIP rules (no encryption, no path traversal, entry-count and size caps mirroring `MobixSafetyCaps`), `manifest.json` and `canvas.json` checked structurally and, when the optional `jsonschema` package is present, against `spec/schema/`, every part digest compared with the manifest's `sha256`, every `assets/` name checked for grammar and for hashing to its own name, every reference resolved (an `asset` name with no entry is an error), and page/chunk counts and modes agreed with the entries. Output one finding per line with rule id, severity and location, plus `--json`; exit 0 clean, 1 findings, 2 unreadable. The rule ids must match the conformance rows so the two documents can be read together. Tests: each hostile-corpus file is refused with the expected rule id, the golden corpus validates clean, and a mutated fixture triggers exactly one finding per rule (bad mimetype order, bad hex in a name, digest mismatch, missing entry, unknown compression method)."
