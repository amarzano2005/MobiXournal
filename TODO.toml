# TODO — active task list for MobiXournal.
#
# Single source of truth for active work (see AGENTS.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "AGENTS.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id> --shipped` to move it to FINISHED.toml; the archive records what the task delivered (files, behaviour, tests, docs, and what it deliberately did not do), not the plan it was picked up from."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .mobix or .xopp formats can represent on disk (per AGENTS.md and docs/mobix-format.md). If a capability cannot round-trip through either format, it is out of scope."

[[task]]
id = "step-3-desktop-workstation"
title = "Step 3 — Desktop workstation program (epic)"
description = "Step 3 of docs/future-roadmap.md, defined across docs/desktop-workstation.md and the desktop section of docs/ui-modernization.md: MobiXournal Desktop, a native workstation app for WINDOWS 11 ONLY (decision 2026-10-21: no Linux, no macOS, no plugin system) that opens the same documents as the Android editor on a graphics tablet, optimised for 21:9 monitors and 144 Hz, with bimanual shortcuts, a property inspector for living entities and tablet rotary-dial support. A read-only viewer already ships in desktop/ with headless render tests. Decisions taken 2026-10-21 and recorded in docs/ui-modernization.md: the window chrome is the app's own glass on a true-black desk (NOT Mica), the drawing tools live in BOTH a vertical rail and a top ribbon with a setting that switches between them, and the shared core is a plain kotlin-jvm module that both shells depend on. Phases, in execution order: (A) shared core - mobix-core plus ink and paper geometry (done); (B) complete reader - .mobix and ZIP .xopp, tabs, Ctrl+B sidebar, zoom/pan, the decided chrome, both tool placements (rail and ribbon open); (C) KMP module split (desktop-kmp-module-split) then editing - pressure inking, eraser, selection, undo, Save and Save As under the sticky format policy, in-place living-entity editors, images and import, page management and search, layer visibility; (D) graphics-tablet and rotary-dial hardware; (E) 21:9 layout and 144 Hz render pacing, with the settings window that exposes them (desktop-settings-and-status-ui); (F) living-entity property inspector and PDF/SVG export; (G) MSI installer and CI artifact. Parity scopes added 2026-10-21, each broken down when picked up: colour and width palette, shape perfection / text / math, PDF annotation and outline, pen-tip radial HUD, audio recording and replay, infinite canvas, multiple windows and monitors, light theme and header extras, and desktop-guards-and-ci (structure budget and CI job for desktop/). Done means: every phase closed with its docs updated in the owning spoke, the desktop suite green on the host (no emulator), a packaged binary that opens .mobix and .xopp, README documenting it, and the 144 Hz and tablet results confirmed by the owner on real hardware. Never implement in one pass: children are scopes where the code must be investigated first, tasks where the work is already clear."
