title = "Advanced PDF annotation engine: snap-to-text highlighter, full-text index, ISO annotations"
description = "docs/pdf-annotation-engine.md specifies three capabilities. A magnetic highlighter: while a HIGHLIGHTER drag is live, test the stroke against the glyph boxes of the page, cluster the glyphs it crosses into line runs, replace the path with a flat rectangular band sitting on the text baseline with its ascenders and descenders, and release back to freehand when the drag is vertical or crosses several lines steeply. An inverted full-text index answering in under 2 ms, built by a low-priority background worker on first open and cached at .mobix/assets/pdf_index.bin. And an optional native ISO PDF/A export writing /Highlight with /QuadPoints, /Ink for handwriting and /Text or /Sound for notes, instead of burning the annotations into the page as the export does today. Some ground is covered: docs/pdf.md owns the per-file text layer (render/PdfTextExtractor.kt, render/PdfTextIndexCache.kt) and the highlighter already blends and snaps its tip widths. Work out what that text layer already gives the snapping algorithm, what the index still lacks, and where a second export mode sits beside the flattened one, then add the task-level children. Produce tasks, not code."
