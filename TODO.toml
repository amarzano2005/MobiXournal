[[task]]
id = "desktop-document-path-breadcrumb-in-the-header"
title = "Desktop: document path breadcrumb in the header"
description = "Put the open document path in the window header as a breadcrumb that shortens from the left. Files: a new desktop/src/main/java/com/mobixournal/desktop/shell/HeaderBreadcrumb.kt holding the row and a pure shortenPath(path, maxChars) function (keep the drive and the file name, replace the middle with an ellipsis, never split a separator, and leave a short path untouched); desktop/src/main/java/com/mobixournal/desktop/shell/Header.kt gains the slot between the tab strip and the search field, reading the active tab file with the document name plus Unsaved for a tab that has no file yet; the full path is revealed on hover through the existing strip pill, and the row is absent when no document is open. Constraints: band material only (no card, no rim), the label type role, one line, and the search field keeps its width - the breadcrumb takes the band spare width and shortens rather than pushing the tabs or the file commands. Verify: shortenPath unit tests (short path untouched, deep path shortened from the left, trailing separator, Windows drive root) and a headless render at 1400 dp and at 900 dp proving the file name survives and the search field did not move. Docs in the same commit: docs/desktop-ui-layout.md (the band order), docs/desktop-workstation.md, README."
