[[task]]
id = "desktop-pdf-import-saves-the-bytes-with-the-document"
title = "Desktop: a save carries the PDF an import brought"
description = """
The bytes an import brought must travel with the document where the format can carry them, or the first save loses the PDF.

`DocumentEncoder.write` in `mobix-core` already has the seam: `pdf: File?` is bundled as `background/background.pdf` for a `.mobix` and attached as `bg.pdf` with `domain="attach"` for a zipped `.xopp`, while a plain gzip `.xopp` keeps the path reference, made relative to the target when the two share a folder (`relativeReferences`). The window never passes it: `DesktopSaves.stage` calls `write(...)` with the shape alone.

So: give `DesktopSaves.stage`/`save` a `pdf: File?` argument and pass it through, and resolve it in one place — a new `fun pdfSource(): File?` on `DesktopDocument` (`DocumentLoader.kt`, beside `saveShapeFor`) that answers the file behind the document's first `Background.Pdf` when its `filename` is an absolute path that exists, and null otherwise (a bundled `.mobix`, a package's extracted entry, a relative reference and a missing file all answer null — the first two already travel inside the archive `SaveShape.carriedFrom` repacks from, and passing them again would write a second entry). `DesktopTab.saveBack` and `DesktopShellState.saveAs` (`DesktopShellSaves.kt`) take the same document, so nothing else changes; `DesktopRecovery`'s snapshot keeps writing without it (a snapshot is a self-contained `.mobix` of its own, and `saveShapeFor` already handles it).

Verification, new `DesktopPdfImportTest` cases or `DesktopSaveTest`: import a PDF onto a blank tab, save as `.mobix`, reopen with `DocumentLoader` and assert the background carries `bundledAsset` and that `PageBackdrop.sourcePdf` opens it; save as a zipped `.xopp` and assert the package holds `bg.pdf` and the reference is `attach`; save as a plain `.xopp` in the PDF's folder and assert the reference is relative, still opens, and is not `attach`; and a document opened from a `.mobix` that already bundles its PDF saves again with exactly one `background/background.pdf` entry (read the archive's entry names — no duplicate).

Docs, same commit: `docs/pdf.md`, `docs/desktop-workstation.md` (a save carries the PDF), `docs/data-path.md` if it states what a save carries. Desktop and core only: no APK, `rebuild = false`."""
