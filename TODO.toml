title = "Epic: evolution that never loses what this build does not understand"
description = """
Mission: guarantee that new or unknown data survives, and that capabilities are declared in a way that protects a reader older than the file - the prerequisite for every new element family in the STEM roadmap.

Completion means: unknown types *and* unknown fields in known types survive an edit elsewhere and a save; capabilities are declared, read and enforced; migrations are explicit, tested and reversible; and no new `type` can ship without a codec, a fixture and a legacy-reader fallback test.

