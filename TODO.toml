[[task]]
id = "desktop-light-theme-tokens-and-a-setting"
title = "Desktop: light theme tokens and a theme setting"
description = "Give the window a light theme and prove every surface reads in both. Files: mobix-core/src/main/java/com/mobixournal/design/DesignTokens.kt gains the light counterparts the Android side already names (DeskLight #F8F9FA for the desk and the paper surround) beside the existing DESK_RGB, GLASS_LIGHT_RGB, GLASS_LIGHT_ALPHA and DESKTOP_BAND_ALPHA; desktop/src/main/java/com/mobixournal/desktop/settings/DesktopTheme.kt stops being one dark object and exposes two token sets behind one accessor Compose reads (desk, glass, floating, panel, settingsPanel, stripGlass, hairline, accent, activeSlot, hoverSlot, ink, inkSecondary, inkMuted, chromeInk, danger, pageShadowColor, bandRgb and the three COLORREF values), the light set mixing the same glass RGB at its own alpha over the light desk with the accent staying Blue #2563EB; DesktopSettings gains an interface.theme key (values light and dark, default system) read like every other key; a Settings -> Appearance row switches it and the window repaints without reopening; the Windows title bar (DWM, which reads bandRgb, bandColourRef, deskColourRef and inkColourRef) follows the same value. What must not change: a document looks identical in both themes, because paper, ink and ruling read the document rather than the chrome - assert that. Verify: headless ImageComposeScene renders of the header, the rail and the Settings surface in both themes filed under build/desktop-render, and DesktopThemeTest extended to measure each theme ink over its own desk, to prove the two desks differ and the page pixels do not. Docs in the same commit: docs/ui-modernization.md (theming), docs/desktop-settings.md (the Appearance row), docs/desktop-workstation.md (the sentence that says the light theme waits), README."
