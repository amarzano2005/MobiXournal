[[task]]
id = "desktop-guides-project-the-ink"
title = "Desktop guides: project every drawn vertex onto the guide"
description = "The half that makes the instrument useful: with a guide placed on the tab's current page, every drawn vertex goes through `DrawingGuide.project`, so a stroke ruled along the setsquare is straight in the file. Two call sites on the window's ink edge, both in `desktop/src/main/java/com/mobixournal/desktop/`: (1) `PageInkGesture` (`PageInkGesture.kt`) takes a new `project: (Double, Double) -> Pair<Double, Double> = { x, y -> x to y }` and applies it in `start`/`addSample` BEFORE the sample reaches `draft` - which covers the Compose pointer and the tablet's packets alike, since both paths arrive at `addSample`; (2) the geometry drag's `preview()` in `PageCanvasInput.kt` (`shapeDrag`) builds `StrokePoint`s straight from the drag, so its two endpoints are projected too, in the preview and therefore in the lift. The lambda is the canvas's, from the tab's pose through `DesktopGuides.projectGuide` (no guide, or a guide pinned to another page, answers the point unchanged). Projection applies to EVERY vertex within `DrawingGuide.GRAB_PT`, not only a shape's endpoints: that is the tablet's rule and the whole difference between a guide and Snap-to-grid, and it is why a freehand line comes out along the edge. The window has no grid snapping at all (vertical space keeps `snapSpacingPt = 0.0`), so there is no ordering question here and the doc should say so rather than promise a precedence that does not exist. What lands on the page is an ordinary `Stroke` of the tool's own ink: nothing about the guide reaches .mobix or .xopp, and the resulting ink round-trips like any other - the scope rule of AGENTS.md is satisfied without a format change. Tests: pure `DesktopGuidesTest` (a wobbling 5-point stroke beside a placed setsquare ends up collinear to 1e-6 on the edge it was drawn against, a point 40 pt away is untouched, a guide pinned to page 0 leaves page 1's ink alone, a compass pulls a swept sample onto its circumference) and a scene case in `DesktopGuideSceneTest`: with a setsquare placed and the Pen in hand, a 3-4 pt wobble within reach of the long leg commits ONE stroke whose points sit on the line, as one undo step, and a drag on the far side of the page is written exactly as drawn. Verification: `gradlew.bat :desktop:test :mobix-core:test` on JDK 21. Docs: `docs/drawing-tools.md` (the window's guide at the ink edge, beside the tablet's `guided()` paragraph), `docs/desktop-editing.md`, README. Regenerate the packaged window before closing."
