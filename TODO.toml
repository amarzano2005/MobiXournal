[[task]]
id = "summon-the-ring-from-the-pen-button"
title = "Summon the ring from the pen's button"
description = "The pen's own summon, which is what the tablet's ring is for. (1) The setting: `DesktopSettings` gains `penButton` stored as `tablet.penButton` with two values, `erase` (the default) and `hud`, decoded the way the other enum rows are (an unreadable value falls back to `erase`), and Settings -> Stylus gains a **Pen button** group of two choices under `StylusPressureGroup`/`StylusAreaGroup` in `desktop/settings/SettingsSections.kt`, following the row rule of `docs/desktop-settings.md` (294 lines, so compress an equal number of lines out of that file). (2) The behaviour mirrors the tablet's `BarrelAction`, which already lives in `mobix-core`: with `penButton = hud`, a barrel press **with the tip off the glass** opens the ring at the nib — the newest packet's client position minus the canvas origin, the same reading the tool-ring cursor already uses — move packets with the button held track the pick, the release commits through the `onHudPick` of `draw-the-ring-and-summon-it-from-the-keyboard`, a tip that lands while it is open cancels it and writes **nothing**, the pen leaving proximity cancels it, and `Esc` cancels it. With `penButton = erase` (the default) nothing changes at all: the barrel keeps erasing through the Compose secondary button (`buttonsOf` in `PageCanvasInput`). With `hud`, a barrel held while the tip is down draws with the tool in hand rather than erasing — exactly what the tablet's `InputClassifier` does when `BarrelAction.HUD` is chosen. (3) Where: `desktop/ink/PenPacketStroke.kt` is the one subscriber that already owns the pen's packets (the window-thread queue, the per-frame flush, `publishHover`), so the button edges and the hover position are reported from there to the ring's state in `PageCanvas`; the packet's `barrel` bit is `read-the-pen-barrel-button-from-the-packet-stream`'s. The Compose pointer must not fight it: the secondary button still reaches the router, and where `penButton = hud` the barrel is the ring's, not the eraser's. Verified: a `PenPacketSceneTest`-shaped scene test `aBarrelPressSummonsTheRingAndAReleaseDismissesIt` (a `FakePackets` with a `barrel` flag: hover, then a press opens the ring at that point, a release with no slot under it closes it and changes no ink; a press and a release over a swatch commits that colour, asserted on `state.ink.colour`); `aTipThatLandsOnTheOpenRingCancelsItAndWritesNothing` (the packets carry `tip = true`: the page keeps its stroke count); a `PenPacketStrokeTest` unit test that one press and one release report one edge each, not one per packet; and the setting's round trip through the file plus the `erase` default. `:desktop:test` and the guards green. (4) A live pass on this machine (Gaomon WH851): `:desktop:createDistributable`, ring summoned by the pen's button, and the bit measured by the packet task confirmed on the running window. Docs: `docs/desktop-tablet.md` (the measured stream and the bit), `docs/desktop-ui-layout.md` (the ring section's pen half), `docs/desktop-settings.md` (the new group), `README.md` (what the pen's button does, and that it is the window's own setting). `rebuild = false` — the window only."
