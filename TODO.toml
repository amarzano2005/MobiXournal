# TODO — active task list for MobiXournal.
#
# Single source of truth for active work (see AGENTS.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "AGENTS.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id> --shipped` to move it to FINISHED.toml; the archive records what the task delivered (files, behaviour, tests, docs, and what it deliberately did not do), not the plan it was picked up from."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .mobix or .xopp formats can represent on disk (per AGENTS.md and docs/mobix-format.md). If a capability cannot round-trip through either format, it is out of scope."

[[task]]
id = "desktop-every-tool-does-what-it-does-on-the-tablet"
title = "Desktop: every tool in the strip does what it does on the tablet (scope)"
description = "Priority 1 of the window, and the map of who owns which remaining slot: every slot the strip offers must do what the same tool does on the tablet, and no tool may be offered without acting. Shipped since this scope was opened: pen and highlighter inking through the shared router and pressure filter, both erasers (standard and whole-stroke), the seven geometry slots (Line, Arrow, Double arrow, Axes, Rectangle, Ellipse, Spline) and Vertical space - each through mobix-core, each one gesture and one undo step. Still open, and owned by exactly one child so nothing is planned twice: TEXT and TEXIMAGE -> desktop-shape-text-and-math-tools; MARQUEE, LASSO and BG_SELECT -> desktop-eraser-and-selection-on-shared-geometry (the eraser half has shipped); PLOT, AXES, TABLE and CIRCUIT -> desktop-stem-slot-placement; pictures and import -> desktop-images-and-import; the setsquare and compass guides -> desktop-guides-setsquare-compass; the audio tap, the Y key and karaoke replay -> desktop-audio-replay; PDF text selection and the magnetic highlighter -> desktop-pdf-annotation; what exposes a group's members at all (chevrons, glass pickers, grouping) -> desktop-tool-groups-and-pickers; every slot face's glyph -> unify-remaining-stem-tool-glyphs; the barrel-button ring of tools, widths and colours -> desktop-pen-tip-radial-hud. Every tablet tool now has an owner, and a tool whose task has not landed is simply not shown on the strip rather than shown dead. Rules every child follows: the shared router decides what a press means (docs/stylus.md), width and colour come from the strip through the same PressureCurve, a drag previews exactly what the lift commits, one gesture is one edit and one undo step, a packet-driven stroke and a mouse drag never draw the same contact twice (DesktopTool.inksByPackets is the one gate), every UI element answers docs/interface-contract.md, and the owning spoke plus README change in the same commit. Done when every slot either acts or is not shown. This scope is the map, not the work: picking it up means breaking the listed children down, never implementing here."
status = "active"
level = "scope"
category = "feature"
urgency = "high"
order = 10
created = 2026-10-24
