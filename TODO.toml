[[task]]
id = "stem-geometry-solver"
title = "Solve coincidence, parallel and perpendicular within a stated budget"
description = """
Add the bounded solver behind the construction: residuals per constraint kind (a coincident pair has two, parallel and perpendicular one each, computed in a stable form that does not divide by a near-zero length), a damped least-squares step (Gauss-Newton with a fixed damping constant or a projection iteration), an iteration cap and a convergence tolerance that are recorded constants, and four states - SATISFIED, UNDERCONSTRAINED, OVERCONSTRAINED, UNSOLVED. Degrees of freedom come from counting independent residual rows against movable point coordinates, and an over-constrained system is reported as a conflict naming the constraints that cannot all hold, not merely as a failure.

The rule that matters: a failed solve never irreversibly alters the original drawing. Solve on a copy, commit only on SATISFIED or UNDERCONSTRAINED; a partial solve keeps the dragged point where the user put it and reports which constraints gave way. Deterministic: the same input and the same start values must produce the same output.

Verify with a core test: a right angle built from a perpendicular constraint holds to 1e-9 after moving a point; a triangle with two contradictory distance constraints is OVERCONSTRAINED and names them; a construction with a free point is UNDERCONSTRAINED and still solves; an iteration-capped case returns UNSOLVED with the original untouched; running the same solve twice returns equal coordinates. Run ./gradlew :mobix-core:test --tests '*GeometrySolver*'."""
