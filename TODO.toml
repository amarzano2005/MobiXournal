ves the one the line passes through where it was, is one undo step, and that a drag over empty space records nothing; VerticalSpaceOps' own tests stay the arithmetic's authority; (6) docs: docs/drawing-tools.md (Vertical space) notes the window now has it, docs/desktop-workstation.md gains the tool-strip paragraph, README's desktop paragraph mentions it. Finish with :desktop:createDistributable. No Android behaviour change; :desktop:test plus the guards green."
