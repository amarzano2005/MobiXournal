id = "stem-code-block-highlight"
title = "Colour code syntax as a derived view with a strict budget"
description = """
Syntax colouring is a derived view and must never become the only source: the stored element is text, and the colouring is recomputed. Add an adapter with a plain-text fallback and resource limits: a pure core tokeniser (no Tree-sitter dependency for the first cut; an interface with one implementation for a handful of languages and null for everything else) that returns at most a recorded number of tokens per line and refuses a block over a recorded budget (source length and line count), stated in the class comment and enforced by a test. If highlighting is off, unknown, or over budget, the ink is the monospace text of stem-code-block-ink with its one colour — the fallback path is the default, not an error state.

The colouring rides the ink only: no token is written to the document, the codec does not change, and the .xopp export keeps plain text (a .xopp stroke cannot carry a language), which the report statement already covers. Highlighting is off by default and per element (a flag), and turning it on never changes the source. Docs: docs/mobix-elements.md's entry gains the rule (derived view, budget, never stored) and docs/guide-stem-tools.md says highlighting is optional.

Verify with a core test: a tokeniser run on a Python block produces the same line count and character count as the source, an over-budget block returns no tokens and the plain ink, an unknown language falls back without an exception, and a saved/reopened block is identical with highlighting on and off. Run ./gradlew :mobix-core:test --tests '*CodeHighlight*'."""
