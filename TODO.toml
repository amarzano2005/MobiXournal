[[task]]
id = "stem-dynamic-geometry"
title = "Constrained geometry that survives a drag (F07)"
description = """
`ParametricShapeElement`, `ShapeVertex`, `ParametricShapes.kt`, `FigureGeometry.kt` and snapping let a shape be edited, but there is no persistent constraint: 'keep this angle at 90 degrees' cannot be expressed, so dragging a vertex breaks the construction it was meant to represent.

User story: draw a triangle, fix a right angle, drag a vertex and keep the angle at 90 degrees within a stated tolerance, with lengths and angles updating; suspend a constraint; see clearly when the system is over-constrained instead of watching it go wrong.

Design a `geometryConstruction` entity: stable points/lines/segments/circles with ids, and `constraints[]` (`coincident`, `parallel`, `perpendicular`, `distance`, `angle`, `pointOnCurve`, `equalLength`) referencing ids and carrying values with units. Never bind a constraint to absolute coordinates or to a vertex index that can shift. Specify a bounded deterministic solver with iteration caps, states `SATISFIED`/`UNDERCONSTRAINED`/`OVERCONSTRAINED`/`UNSOLVED`, and a rule that a failed solve never irreversibly alters the original drawing. Keep free-form figure editing and constrained construction separate.

Progressive child tasks: G1 entity/constraint model + codec; G2 solver for coincidence/parallel/perpendicular; G3 drag UI, handles and diagnostics; G4 circles and tangencies plus degrees of freedom; G5 cross-platform export and tests. Acceptance: S3 complete, over-constrained shown as an error without corruption, undo and reopen correct. Dependency: the reference/identity policy and the performance baseline."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 280
created = 2026-11-10
tags = ["stem", "geometry", "constraints", "p2"]
rebuild = false
