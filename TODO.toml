# TODO — active task list for MobiXournal.
#
# Single source of truth for active work (see AGENTS.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "AGENTS.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id> --shipped` to move it to FINISHED.toml; the archive records what the task delivered (files, behaviour, tests, docs, and what it deliberately did not do), not the plan it was picked up from."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are. The writing rules are `docs/writing-docs.md`'s, and its Definition of Done is the bar."
scope = "Only build features the .mobix or .xopp formats can represent on disk (per AGENTS.md and docs/mobix-format.md). If a capability cannot round-trip through either format, it is out of scope."

[[task]]
id = "mobix-migrations"
title = "Make format migrations explicit, repeatable and reversible"
description = """
There is no documented migration mechanism: no `fromVersion`/`toVersion` plan, no golden migration tests, and no written guarantee that a structural save is atomic on SAF (Android) and on Windows file APIs. The existing read-only path for newer documents is the only protection.

Distinguish the four operations that are currently conflated and design each: format migration (changes the schema, may justify a new `formatVersion`), writer upgrade (better compression or an added derived index, no semantic change), compaction (drops unused assets only after references from unknown areas are resolved - an explicit, conservative action), and external conversion (PDF/SVG/`.xopp`/JSON export, which never mutates the original).

Decide: no in-place migration on open; write to a temp file, validate it fully, then publish it by replacement; keep a recoverable backup; specify what happens if the process dies mid-write on each platform, verified rather than assumed. Define the migration plan shape (`fromVersion`, `toVersion`, preconditions, diagnostics, checkpoints) and the golden tests that pin it. State the conditions under which `formatVersion=2` is genuinely required.

Owners: `docs/mobix-format.md`, `docs/document-session.md`, `docs/tools.md`. DoD: written policy plus child tasks (plan format, atomic publish, backup/restore, golden tests). Dependency: `mobix-capability-contract`, `mobix-archive-safety`, the fixture corpus."""
status = "active"
level = "scope"
category = "refactor"
urgency = "normal"
order = 100
created = 2026-11-10
tags = ["mobix", "compatibility", "p1"]
rebuild = false
emulator_debug = false

[[task]]
id = "mobix-compression-review"
title = "Decide STORED vs DEFLATE per entry from measurements, not taste"
description = """
The ordinary writer DEFLATEs every entry except `mimetype`, which spends CPU on media that is already compressed (PNG, JPEG, WebP, Opus, PDF) and recompresses payloads it could have copied raw. Nobody has measured whether a selective STORED policy would help, and changing the default without evidence would be a compatibility gamble.

Using the baseline from `mobix-current-performance-baseline`, compare STORED and DEFLATED per content class: page JSON, chunk JSON, small assets, already-compressed media, and large audio. Measure save CPU, resulting document size, cold-open time and the raw-copy path (`MobixZipRewrite`, `MobixIncrementalSaver`), and confirm that every reader this project cares about - including a third-party one - accepts the chosen methods. Respect the current invariant that unmodified entries are copied raw and never recompressed.

Deliver a per-entry policy proposal with the numbers behind it, plus child tasks for `MobixContainer`, `MobixZipRewrite` and `MobixIncrementalSaver` if the policy is worth adopting, and the spec text that documents it. DoD: a measured recommendation, including an explicit 'keep the current default' outcome if the data does not justify a change. Dependency: the baseline."""
status = "active"
level = "scope"
category = "refactor"
urgency = "normal"
order = 110
created = 2026-11-10
tags = ["mobix", "performance", "p1"]
rebuild = false
emulator_debug = false

[[task]]
id = "mobix-derived-index-review"
title = "Assess an optional derived index/ only where a profile shows a bottleneck"
description = """
The plan proposes optional `index/` and `previews/` entries. Neither exists, and adding them without a measured reason would be a fixed cost on every save plus a second source of truth. This scope exists to keep the idea honest rather than to build it.

Using the baseline report, identify whether any real workload (search across 1000 pages, thumbnail grid, asset lookup during a lazy open) is actually bottlenecked by rescanning. If it is, design an entry that is strictly derived: content-addressed or digest-invalidated, rebuildable from the canonical JSON, never the only home of any datum, ignored by readers that do not know it, and cheap to skip on save. Design the preview policy the same way: a non-authoritative cache with a source hash, never a substitute for rendering, and never a claim that an older Mobixournal can show a new element.

DoD: a written go/no-go with the profile that motivates it, and child tasks only in the 'go' case. Dependency: `mobix-current-performance-baseline`, `mobix-spec-v1` (extension rules)."""
