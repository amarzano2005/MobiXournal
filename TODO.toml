description = "A quantity layer on top of the bounded scalar evaluator contract that stem-scalar-evaluator establishes, not a second expression parser: units get their own parser and are attached to literals and results, while the grammar, the budgets and the typed outcomes stay the evaluator's. Multiplication and division combine dimensions, addition and subtraction require identical dimensions, and a power takes a dimensionless exponent with integer or rational dimension handling. Functions with a dimension requirement state it: sin, cos, ln and exp take a dimensionless argument, sqrt halves the exponents. Errors are typed and named (unknown unit, incompatible units, ambiguous symbol, non-finite result), never a number, and an incompatible expression keeps its source intact so the user sees what was rejected. Unit-free input stays dimensionless, so every existing expression keeps its meaning. Tests: 5 kg * 3 m/s^2 = 15 N, 3 m + 2 s rejected with its cause, sqrt(4 m^2) = 2 m, a dimensionless sin, overflow, and the operation budget still enforced."
