title = "Export the meaning, not just the picture (F22)"
description = """
Exports today are visual: PDF, SVG and `.xopp` render living entities to ink, which is the right fallback but carries no semantics. There is no way to get the LaTeX of a formula, the CSV of a table, the samples of a plot or a netlist out of a document, and no report of what a conversion lost.

Inventory the existing channels - `XoppSynthesis`, `PdfPagePlan`, `PageSvgWriter`, the `.xopp` bridge and the per-family coverage in `XoppExportCoverageTest` - then define a pure `ScientificInterchange` contract plus a `ConversionReport` that says, per object and per target: preserved, editable, displayed, partly lost, unsupported. No export may mutate the original `.mobix`, and no export may claim round-trip fidelity it does not have.

Targets and fallbacks: formula/scientific text -> LaTeX/Markdown/MathML for the supported subset, PDF/SVG/`.xopp` fallback; calculation and variables -> JSON/CSV with source, units and values; scientific table -> CSV plus formulas; plot -> sampled CSV + SVG/PDF + a JSON definition; code -> the original text file; dataset and simulation -> their own scopes' formats.

