[[task]]
id = "stem-linear-algebra"
title = "Vectors and matrices as values, not pictures (F14)"
description = """
There is no structured matrix value anywhere: matrices can be drawn or written in LaTeX, and nothing can compute their determinant. The evaluator planned in `stem-page-calculations` already needs a `Matrix`/`Vector` case, so the algorithms and their error states must be designed rather than bolted on per button.

User story: type a 3x3 matrix, ask for its determinant, transpose or product, see a readable error for incompatible dimensions, copy the result as LaTeX or CSV, and keep the object editable.

MVP scope: addition, dot product, matrix product, norm, transpose, determinant for small matrices, and linear solving with pivoting and singularity diagnostics. Enforce dimension limits and keep all computation off the UI thread. Prefer pure Kotlin in core over a third-party library; if a library is considered, verify its licence and portability first. Persist source and operation, never a screenshot of the numbers.

Child tasks: L1 value schema and matrix input; L2 product/determinant/norm; L3 solving with pivoting and error states; L4 editor plus LaTeX/CSV export; L5 singular, empty and ragged tests plus interop. Acceptance: every dimension error is explicit, small-matrix results match a reference, round-trip through JSON and PDF is correct. Dependency: the `ScientificEvaluation` contract from F01."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 300
created = 2026-11-10
tags = ["stem", "math", "matrix", "p2"]
