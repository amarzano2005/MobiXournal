[[task]]
id = "desktop-page-insert-and-duplicate"
title = "Desktop: insert and duplicate a page from the page list"
description = "`DesktopPages` can remove and move pages but cannot add or duplicate one: `PageMenuActions.addPage` only appends a sheet through the shell, and nothing copies a page. Add `insertPageAt(index, before: Boolean)` through `PageOps.addBefore`/`addAfter` at the page's own size, and `duplicatePage(index)` through `PageOps.duplicateAt` (which keeps content, ruling and a PDF background verbatim), both as **one undo step** (`tab.document.snapshot()` → `replacePages` → `tab.record(before)` → `onStructure(tab)`), selecting the new page and clearing `tab.pickedPages`. A duplicate must get a **fresh page id** (`ElementId.mint(ElementId.PAGE)`) and fresh ids for its elements, or a `.mobix` declares the copy to be the original's part and a merge joins them; a `.xopp` has no page ids, so there the copy is simply a second page. An inserted or duplicated page before a PDF page must leave the document's PDF reference alone (`PdfPageReferences`), and the new page's background must follow `PageOps`'s rule (a PDF page's copy keeps its source; a blank insert drops it to a plain sheet). Affordance: a \"+\" row at the end of the page list in `PageSidebar` and **Insert page above / Insert page below / Duplicate page** rows in the Pages menu (`PageMenuRow` in `DesktopPages`), plus `Ctrl+D` for duplicate as a `ShellCommand` in `DesktopKeys`, unavailable — not a silent no-op — with no tab open. Tests in `desktop/src/test/java/com/mobixournal/desktop/DesktopPageInsertTest.kt`: insert below and above land at the right index, a duplicate keeps the content but changes the id, one `Ctrl+Z` restores the list in a single step, inserting before a PDF page leaves the reference valid, and a one-page document can still be duplicated. Docs: `docs/desktop-workstation.md` (the page list) and the README desktop section."
