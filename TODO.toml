[[task]]
id = "stem-page-calculations"
title = "Compute on the page: evaluable source, typed result, no invented numbers (F01)"
description = """
There is no way to evaluate anything on a page: `FunctionPlot.compile` is an evaluator for f(x) plotting, `MathBlockElement` stores a LaTeX source for display, and neither writes a result that a reader can re-check. A student still copies numbers by hand.

User story: write or select `2*(3+4)`, choose Calculate from the context menu, and get a small card showing the normalised input, the value and the precision; `1/0` shows a cause, never a number; the card can be frozen so it stops following its inputs.

Investigate `FunctionPlot`/`FunctionPlot.compile`, `MathBlockElement`, `Living.kt`, `LivingInk`, `MobixElementCodec`, the Android selection actions and the desktop inspector. Then decide the model: a new `calculation` element (not an `attrs` extension of `stroke`/`text`) with `source`, `sourceLanguage`, frame, input references, display options, `mode` (live/frozen) and a `cachedDisplay` that is explicitly derived and ignorable. Separate 'evaluable expression' from 'graphical formula' so the plotting parser is not silently promoted to a general language; never serialize `NaN`/`Infinity` as JSON numbers. The result must be re-computable by a third party from the source alone, and a cached value is never presented as authoritative without verification.

Break out child tasks, in order: C1 a bounded scalar evaluator (no globals, operation/time budget); C2 model + codec + golden `.mobix` fixture, unknown-safe; C3 renderer in `LivingInk` with PDF/SVG/`.xopp` visual fallback; C4 the Calculate action on Android and desktop plus undo; C5 reopen, export and independent-CLI interoperability.

Acceptance: `2*(3+4)=14`; `1/0` is diagnosed; the same expression behaves identically on both shells; a saved and reopened document re-evaluates to the same result; PDF shows source and value. Dependency: the minimum new-type gate (codec, fixture, old-reader fallback), `mobix-known-type-unknown-fields`."""
