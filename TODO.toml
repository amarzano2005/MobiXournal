[[task]]
id = "mobix-portable-assets"
title = "Prove which documents are genuinely self-contained"
description = """
The README calls a `.mobix` self-contained, but the codec admits external references when the bytes are unavailable (image `fn`/`ts`-style references exist in the model, PDF backgrounds may point at a URI, fonts are never bundled), so a file can open here and display nothing on another machine with no warning. There is no portability audit and no validator for asset naming and digests.

Walk every resource a document can reference: page images, PDF backgrounds, audio recordings, embedded font/metric dependencies, dataset and other future payloads, and external URI/SAF paths. Classify each as embedded-and-verified (hash matches), referenced-but-absent (must be an explicit warning with an option to embed when the bytes and the permission exist), or unrecoverable (must block the claim of portability while keeping the original reference). Never download anything implicitly, in the app or in a third-party reader.

Read `MobixAssets`, `MobixPayload`, `BundledPayloads`, `MobixPageCodec`, `MobixElementCodec`, `MobixDocument` and `docs/data-path.md`. Design the diagnostic surface (a per-document report a person can read) and the future 'Save a portable copy' action, which must still produce a valid `.mobix` - never a second container type. Break out child tasks: audit, warning model, embed action, validator rules, doc updates.

Owners: `docs/data-path.md`, `docs/mobix-format.md`, `docs/guide-formats-and-conversion.md`. DoD: a findings table and child tasks; no new archive format. Dependency: `mobix-spec-v1` (asset rules) and `mobix-archive-safety` (limits)."""
