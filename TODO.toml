[[task]]
id = "mobix-stored-assets-policy"
title = "Store already-compressed assets instead of deflating them again"
description = """
The container policy campaign (`docs/benchmarks.md`) measured on one run each that saving a 200-page notebook with 5.3 MB of incompressible media drops from 175 ms to 18 ms when `assets/` entries are STORED instead of DEFLATED (and the archive is 1 620 bytes smaller), while page JSON keeps DEFLATE (1.6x smaller). First re-measure in `mobix-core/src/test/java/com/mobixournal/format/mobix/MobixArchivePolicyBenchmarkTest.kt` with at least nine runs and report p50/p95.

If the CPU saving holds, update `MobixContainer.kt`, `MobixZipRewrite.kt` (`MobixZip.Writer`: add a streaming `putStored(name, payload: MobixPayload)` overload beside `putDeflated`), and `MobixIncrementalSaver.kt` to choose STORED for already-compressed asset suffixes (`png`, `jpg`, `jpeg`, `webp`, `pdf`, `ogg`, `wav`, `m4a`) - never by compressing twice to compare - while keeping DEFLATE for page/chunk/envelope JSON and `mimetype` STORED first. Readers and `MobixZip.Index.rawEntry` must accept both methods and keep copying unmodified entries raw. Update `scripts/make-mobix-fixtures.py` if needed, update the normative compression rule in `docs/mobix-schema-spec.md` (which currently mandates DEFLATE for every non-mimetype entry) and `docs/mobix-format.md`, record the measured numbers in `docs/benchmarks.md`, and verify with a golden STORED-asset fixture round-trip and `:mobix-core:test`."""
status = "active"
level = "task"
category = "refactor"
urgency = "high"
order = 110
created = 2026-11-10
tags = ["mobix", "performance"]
epic = "mobix-performance-hardening"
