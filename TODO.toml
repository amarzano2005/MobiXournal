id = "desktop-stem-slot-placement"
title = "Desktop: the STEM slots place a living element (scope)"
description = "Four slots - PLOT, AXES, TABLE, CIRCUIT - are on the strip and pan the page, because DesktopPen.activeTool() reduces them to HAND; they are the tools that CREATE a living element, while desktop-living-entity-editors only edits one that exists. The tablet asks first (a formula for a plot, rows/columns for a table, a component for a circuit) and the app's dialogs are Compose-for-Android, so nothing carries over unchanged: mobix-core has the geometry (PlotInk, PlotFrame, FunctionPlot, TableInk, CircuitInk, CircuitShapes, ParametricShapes) and the element types (PlotElement, TableElement, CircuitElement, ParametricShapeElement), but not the question the user answers when the tool is picked. Investigate and then add the atomic tasks: (1) how a press places an element on the desktop - drag a box (the tablet's gesture) or place at the click with a default size - and where the size/position lands in each element's own fields; (2) what the user fills in first, per family, and where that happens without a modal over the page (the window's glass: a header-tethered editor, an inspector row, or the same popup the tablet opens, re-drawn in Compose Desktop), reusing the apply functions the Android editors already call (render/ElementEdits.kt, applyPlotEdit) so both shells write the same element; (3) the order of families - plot first (the formula is one line and the geometry is already shared), then axes, table, circuit - and what each still lacks in mobix-core to be placed without the app module; (4) the tests each child owes (a JVM test of what the placement writes, an ImageComposeScene test that picking the tool and dragging writes exactly one element and one undo step); (5) the doc updates (docs/mobix-elements.md, docs/desktop-workstation.md, README). Produce tasks, not code; it is a child of desktop-every-tool-does-what-it-does-on-the-tablet and depends on desktop-living-entity-editors for the editor surface."
