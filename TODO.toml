title = "Keep a recoverable copy before a replace, and a way back"
description = "Add the backup the atomic publish needs: before a replace, the current target is copied beside it under a stated name (`<target>.bak` - `notes.mobix.bak` for a notebook, `notes.pmobix.bak` for a portable copy, one per document; never the collision-prone `<name>.mobix.bak` for a `.pmobix` target), and the copy is kept until the next successful publish replaces it. Define the retention rule in the owning doc rather than in code comments, remove the backup only on explicit user action, and add a restore path: an action that puts the backup back through the same atomic publish, with the same validation, so a bad restore cannot overwrite a good file with a truncated one. Android owns a second case - the SAF provider copy that cannot be replaced atomically - where the backup is the only recovery, so it is written there unconditionally. The target is whatever path the save names, including a `.pmobix` opened as a notebook. Tests: a failed publish leaves the backup in place and the target untouched; a successful one leaves the backup of the previous bytes; a restore reopens the backup's content; a second publish replaces rather than accumulates backups."
