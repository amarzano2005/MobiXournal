id = "desktop-export-pdf-document"
title = "Desktop: export the document as one PDF, paper and ink from the shared plan"
description = "Half of a page is already in the plan and half is not: PdfPagePlan covers the elements, while the paper - the sheet fill and its ruling - is still drawn by app/.../render/PdfBackgroundPainter.kt with its own arms, so a desktop export written today would print a ruled page blank. (1) Move the paper into the one rule book: add PdfPagePlan.paper(page: Page, t: PdfPageTransform): List<PdfOp> in mobix-core, built from the same pure BackgroundGrid and BackgroundRulings the screen and the SVG export read - the sheet fill as a PdfFill of the four page corners, each ruling line as a PdfPath with its own width and colour, the graph page's margin inset, the dotted page's small filled squares, the isometric mesh's segments - emitting the same primitives in the same order PdfBackgroundPainter emits today so the tablet's PDF does not change by a point. Then make PdfVectorPainter.paint take an op list as a public overload (paint(doc, cs, ops: List<PdfOp>)) and let PdfBackgroundPainter.draw delegate to it, with PdfExporter keeping its call order (paper, then the pixmap background, then the page). The existing PdfExporter, PdfFonts and TextPaginator suites are the gate that nothing moved; add a mobix-core test in PdfPagePlanTest that a ruled page's plan holds the fill plus one path per rule with the ruling's own spacing, and that a plain page's holds the fill and nothing else. (2) Add desktop/src/main/java/com/mobixournal/desktop/DesktopPdfExport.kt: object with write(document: DesktopDocument, target: File, backdrop: PageBackdrop): Int - one PDDocument, a PDPage per document page sized to the page's points, each page written in the tablet's order: the raster picture of a pdf/pixmap background first (PageBackdrop's ImageBitmap as a LosslessFactory XObject stretched to the page box, the same flatten PdfExporter.pixmapBackground makes), then DesktopPdfPainter over PdfPagePlan.paper, then over the page's ink; saved into a temp file beside the target and moved over it. A chunked board is refused with an English sentence (the sheet slicing a board needs is the tablet's, and this window has none) rather than exporting one sheet of it as if it were the whole document. (3) Verify in desktop/src/test/java/com/mobixournal/desktop/DesktopPdfExportTest.kt: a two-page document exports to a file that PDDocument.load reopens with two pages of the sheet's size; PDFTextStripper finds the words of both; a ruled page renders non-white at a rule's position through PDFRenderer while a plain page stays white there; a PDF-backed page carried by PageBackdrop renders its picture under the ink; and a document with no elements still produces a valid page. Docs in the same commit: docs/pdf.md (the desktop exporter, the raster backdrop as the one difference from the tablet, the board refusal, and that /Highlight, /Ink and /Text annotations are not written yet), docs/rendering.md, docs/desktop-workstation.md, README's Saving & Exporting section. No emulator pass."
