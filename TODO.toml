title = "Vectors and matrices as values, not pictures (F14)"
description = """
There is no structured matrix value anywhere: matrices can be drawn or written in LaTeX, and nothing can compute their determinant. The evaluator planned in `stem-page-calculations` already needs a `Matrix`/`Vector` case, so the algorithms and their error states must be designed rather than bolted on per button.

