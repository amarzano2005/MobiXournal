[[task]]
id = "desktop-audio-playback-and-transport"
title = "Desktop: play a recording back, with a transport"
description = "(1) Engine, desktop/src/main/java/com/mobixournal/desktop/DesktopAudioPlayer.kt: a WAV through javax.sound.sampled and an .ogg/Opus through the Concentus decoder from desktop-audio-opus-via-concentus. One clip at a time: play(ref) from the stroke's own startMs, pause holds the position (nothing sounds), resume continues from it, stop lets it go, seek(ms) clamps to the clip's length, playbackSpeed, and a ClipClock implementation feeding the shared Playhead - whose rules (a sounding position is the media stack's and reads back as the position asked for until the stack gets there, a held one is ours and moves only when we seek it) are already JVM-tested and must not be re-derived. A missing file, and an .m4a, each say one English sentence. Keep the engine, the state and the composable in separate files under SourceStructureTest's ceilings. (2) Transport: a floating glass pill over the page in the window's own material and tokens (one material class, all five states, English copy, docs/interface-contract.md), carrying play/pause, stop, the clip's name, a scrubber over clipDurationMs whose drag calls seek and repaints once per step rather than a frame per vsync (mode 2 of docs/audio-inking-sync.md is the model), and a speed selector. Space stays pan: give the transport its own key, read the table in docs/desktop-ui-layout.md (lines around 89 to 107 and 150 to 180) before choosing one and never reuse a taken key; Esc closes the pill and goes through the shell's existing escape handling. (3) Recorded decision: the dial does not scrub. Its setting stays tablet.dial=zoom|width (desktop-dial-width-and-ring) and the transport's scrubber is its own control, so the dial has one meaning at a time and this task adds no third value to that setting. (4) Tests: engine tests over a real WAV written by the recorder's own writer with a fake clock - play seeks to startMs, a pause keeps the position and resume continues, a seek past the end lands on the end, a second play replaces the first; a render test of the pill over a page and of its absence with nothing playing; a scene test that a scrub drag moves the playhead. Docs: docs/audio.md (playback on the window), docs/audio-inking-sync.md (the transport as mode 2), docs/desktop-workstation.md, the shortcut table in docs/desktop-ui-layout.md, README. Verify :desktop:test :mobix-core:test and regenerate the distributable."
