[[task]]
id = "read-the-pen-barrel-button-from-the-packet-stream"
title = "Read the pen's barrel button from the packet stream"
description = "The window cannot see the pen's side button at all today, which is why the ring has no summon: `PenPacket` (`desktop/ink/PenStream.kt`) carries `tip`, `near` and `eraser` and nothing about a button, and `TabletWintab.consume()` reads `packet.buttons and 0xFFFF` and asks only `BTN_TIP`. Wintab reports a side button as a further button number in that same low word (the first one is normally 2), and Wintab's high word holds change bits that must not be mistaken for a sequence. (1) Add `internal object WintabButtons` beside `WintabApi` in `desktop/ink/TabletWintab.kt`: `BTN_STYLUS = 2`, `fun tip(buttons: Int): Boolean` and `fun barrel(buttons: Int): Boolean`, each masking the low 16 bits and shifting out the button number, so the reading is one place instead of a bit test at the call site. (2) `PenPacket` gains `val barrel: Boolean = false` (defaulted so `FakePackets`, `PenPacketPan` and the synthesiser keep compiling) and `emit()` fills it from the packet. (3) **Measure it, do not assume it.** Run `MobiXournal.exe --probe-tablet` (`Main.kt`, writing `tablet-probe.csv`) with the Gaomon WH851 attached and press the barrel with the tip **off** the glass, then again with the tip **on** it; add the packet's `buttons=` value to each row so the press is visible per packet. PASS: while the button is held, exactly one bit of the low word that is not the tip's is set, it clears on release, and no packet claims a contact (tip or pressure > 0) while the tip is off the glass. FAIL: nothing distinguishes the press — then stop, write the reading down as a measurement, and leave the window with the keyboard summon only (task `draw-the-ring-and-summon-it-from-the-keyboard`); never invent a bit. (4) Record the measured number and the wording in `docs/desktop-tablet.md`'s measured list — the file is at its 300-line budget, so compress an equal number of lines out of the same file or `DocsGuardTest` fails. Verified: `TabletWintabTest` gains `theBarrelIsItsOwnButtonBit` (tip clear and barrel clear on 0, the tip's own number, the side button's, a high-word change bit alone, and both together, on `WintabButtons` with no JNA involved), and `:desktop:test` plus the guards are green. `rebuild = false`: this is the window's Windows reader, not the app's."
status = "active"
level = "task"
category = "feature"
urgency = "high"
order = 107
created = 2026-11-01
