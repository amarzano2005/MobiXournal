title = "Living parametric shape with interactive vertex handles"
description = "Commit the perfected shape as a ParametricShapeElement rather than a uniform-width stroke: the vertices are the authored geometry the editor drags, the bounds are recomputed from those vertices on read so a shape can never be picked where its handles are not, and showAngles and showSideLengths drive the readout badges (docs/mobix-elements.md). render/ElementBounds.kt must give the family a real box and hit-testability, the selection action bar gains Edit shape, and dragging a vertex deforms the shape live while updating side lengths and angles and snapping to 0, 30, 45 and 90 degrees against the page ruling. Export needs no change: render/XoppSynthesis.kt already compiles the family into ink for .xopp. Verify with JVM unit tests on the vertex maths and the synthesis, plus an emulator pass dragging a handle with a stylus."
