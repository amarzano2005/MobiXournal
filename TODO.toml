[[task]]
id = "desktop-dirty-state-close-confirmation-and-crash-safety"
title = "Desktop: dirty state, close confirmation and crash safety"
description = "The last of the editing scope, and the one that decides whether a window can lose work. (1) A tab is dirty when its editable document differs from what was last written or opened; implement it as a save point in the per-tab history (the snapshot count at the last successful save, plus a flag for edits made after an undo back to that point), not as a boolean somebody forgets to clear — the app has no dirty flag at all today because it saves on command only. (2) The tab shows it (the strip's title gains a dot, per docs/interface-contract.md: a token colour, all five states), and Ctrl+S / Ctrl+Shift+S are enabled accordingly. (3) Closing a dirty tab or the window asks first, with three answers — Save, Discard, Cancel — in English, and the window's close request goes through the same path (ExitRequest / onCloseRequest) so the X button cannot bypass it. (4) Crash safety: while a tab is dirty, its edited document is written as a snapshot beside the window's settings file (the app's TabStore does this for its tabs, in filesDir/tabs), and a start that finds one offers it as a recovered tab; the snapshot is deleted after a successful save. (5) Verification, headless: a test edits, saves, edits again and asserts the dirty flag at each step and that the save point survives an undo; a close request on a dirty tab reports what it would ask rather than closing; a snapshot written by one shell instance is offered by the next. No emulator. Docs: docs/desktop-workstation.md (the lifecycle), docs/data-path.md (tabs and what is cached between launches), docs/interface-contract.md if the dot is a new UI element."
