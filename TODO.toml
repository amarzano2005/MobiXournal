[[task]]
id = "keep-a-tabs-bundled-payload-through-the-session-snapshot"
title = "Keep a tab's bundled payload through the session snapshot"
description = "Found on the Pixel_Tablet AVD during verify-the-paged-mobix-open-and-canvas-on-the-emulator, and the only finding of that pass that loses user data. A document backed by a .mobix comes back from a restart without its bundled picture (the page draws bare, and logcat holds ImageBackgroundCache: cannot decode pixmap background), and the next save from that tab writes an archive with no assets/ entry - so the payload is gone from the user's own file. The cause is the session snapshot, not the save: tabs/TabStore.writeSnapshotAtomically writes every tab through Xopp.save as filesDir/tabs/<id>.xopp, and a gzip XML .xopp has nowhere to put a bundled asset, so Background.bundledAsset and Stroke.bundledAudio (the two references in the model) are dropped when the snapshot is written and TabStore.hydrate rebuilds the document without them. Nothing downstream can recover bytes whose reference is gone, which is why this is not supply-a-deferred-payload-on-a-save-that-has-no-source (finished: it carries the assets the *document still references* from the source archive, and after a restore the document references nothing). Fix it at the snapshot: give a tab whose document is a .mobix a snapshot in its own container - TabStore writing filesDir/tabs/<id>.mobix for it and reading it back through the paged reader (format/mobix/MobixContainer.kt, format/mobix/MobixPagedReader.kt) so what the snapshot holds is what the file would hold, keeping <id>.xopp for the XOPP tabs. The suffix has to be derivable per tab rather than fixed: TabIndex's record (or OpenTab.saveFormat/DocumentIdentity) is where to say which one it is, so a restore does not guess, and the sweep in TabStore.save must delete both suffixes for a tab that is gone. The other way - a .xopp snapshot plus a sidecar of the assets it references - is allowed only if docs/data-path.md says why. Verify: a JVM test in app/src/test/java/com/mobixournal/tabs/ writing a session with a MOBIX tab holding a bundled picture and a bundled recording, TabStore.save then a fresh TabStore.load/hydrate, asserting the restored document still names both entries and that the archive the snapshot is made of still carries their bytes, plus that a XOPP tab's snapshot stays a .xopp exactly as today; on the emulator, open the paged fixture (DeviceFixturesTest writes paged-200.mobix, page 2 carries the picture), am force-stop com.mobixournal.v2 and start it again, confirm the picture is still on page 2, save and read the saved archive with zipfile to confirm assets/ survived, logcat clean. docs/data-path.md (*The session is cached, not saved*) is the owning spoke and must say what a snapshot can and cannot carry."
