[[task]]
id = "stem-polar-shared-variable-compile"
title = "Compile a curve's parameter spelling once, for every consumer"
description = """
Only `PlotInk` (`mobix-core/src/main/java/com/mobixournal/render/PlotInk.kt`) knows a stored curve may spell its parameter `theta`, `θ` or `t`: private `PlotInk.compileFormula` renames them to the parser's `x` on word boundaries via `PARAMETER_VARIABLE`. Every other consumer compiles the raw source, so `2*cos(3*θ)` renders in `LivingInk` while `PlotCurve.isDrawable()` in `app/src/main/java/com/mobixournal/ui/AdvancedFunctionGraphDialog.kt` keeps Insert disabled and `MultiFunctionPlotter` drops or mis-compiles it.

Change: promote the renaming compiler to public `PlotInk.compileSource(source, parameters = emptyMap()): Formula?` and route `PlotCurve.isDrawable()`, `MultiFunctionPlotter.compileCurves`, `MultiFunctionPlotter.detectAllCriticalPoints` (also explicitly filtering out non-Cartesian curves there so critical-point reports stay empty for parametric/polar curves), and `PlotInk`'s own `cartesianInk`/`sample` paths through it.

Document in `docs/math-engine.md` that a curve parameter may be spelled `theta`, `θ`, or `t` (compiled as `x`) and that non-Cartesian curves omit critical-point analysis. Verify with new `mobix-core/src/test/java/com/mobixournal/render/PlotVariableSpellingTest.kt` (`2*cos(3*theta)`, `2*cos(3*θ)`, `2*cos(3*t)` and `2*cos(3*x)` agree at 0/1/2; `tan(x)`, `sqrt(t)` and `atan(θ)` keep function names; broken source returns null) plus an app assertion that `PlotCurve.isDrawable()` accepts a polar theta curve. Run `./gradlew :mobix-core:test --tests '*PlotVariableSpellingTest*' :app:testDebugUnitTest --tests '*ParametricPlotAuthoringTest*'`."""
