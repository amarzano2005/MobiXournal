[[task]]
id = "mobix-migration-backup-restore"
title = "Keep a recoverable copy before a replace, and a way back"
description = """
Wire `mobix-core/src/main/java/com/mobixournal/format/mobix/AtomicPublish.kt` (currently library-only) into `desktop/src/main/java/com/mobixournal/desktop/io/DesktopSaves.kt` and `mobix-core/src/main/java/com/mobixournal/portability/PortableCopy.kt`, and add pre-replace backup + validated restore across both shells. Before replacing an existing target on desktop (a `.mobix` save, or an explicit Export As overwriting a `.pmobix` — note in-place Save on an opened `.pmobix` stays refused and redirects to Save As `.mobix` per `docs/mobix-assets.md`), copy the prior bytes beside it as `<target>.bak` (e.g. `notes.mobix.bak`, replacing rather than accumulating on subsequent publishes) and keep it until the next successful publish or explicit user deletion.

On Android (`app/src/main/java/com/mobixournal/MainActivitySaves.kt` and `app/src/main/java/com/mobixournal/io/UriStaging.kt`), a single-file SAF `content://` `Uri` truncates in place without creating a sibling file, so write one pre-overwrite backup into app-private recovery storage (`filesDir/recovery/<sha256(uri)>.mobix.bak`) before `stageOut`. Add a restore action on both shells that validates via `MobixPublishValidation.validate` before republishing so a truncated backup cannot overwrite a valid notebook.

Docs & tests (in the same commit): update `docs/document-session.md` (splitting a new spoke linked from `docs/architecture.md` if approaching 300 lines) with the publish/backup/restore sequence and Android SAF non-atomic caveat, `docs/tools.md` with the backup file rule, and `app/src/test/java/com/mobixournal/guards/DocClaimsTest.kt` (add false `"a save never leaves a truncated notebook"` to `forbidden` alongside a positive check for opening-never-rewrites). Verify with `AtomicPublishTest`, `DesktopSavesTest`, `MainActivitySaves` / `UriStaging` unit tests, `DocsGuardTest`, and `DocClaimsTest`."""
