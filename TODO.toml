[[task]]
id = "stem-calibrated-measurements"
title = "Measure with declared scale, units and precision (F08)"
description = """
There are geometric readouts on shapes and `MeasurementText` exists for labels, but no measurement is an object: nothing stores the points it was taken between, the calibration it used or its uncertainty, so a number cannot be recomputed or trusted after a rescale.

User story: measure a distance on a drawing, declare `100 pt = 2 m`, and read the real length; measure on a photo or a PDF only after an explicit calibration, with the app never pretending that an uncalibrated PDF yields metres; copy the value into a calculation.

Audit `FigureGeometry`, `ParametricShapes.kt`, `MeasurementText`, `ElementBounds` and the PDF transforms. Design a `measurement` element referencing stable points/anchors and a per-page, per-image or per-figure calibration with provenance and validity, mode `DISTANCE`/`ANGLE`/`AREA`/`SLOPE`, precision, and units from `stem-physical-units`. Store the original points and the scale, never a rounded result alone. Uncertainty (±) and propagation are a later phase and must be stated as such.

Child tasks: M1 uncalibrated page measurements in pt; M2 explicit scales and units; M3 angles/areas and uncertainty; M4 marker/tap/copy UX on both shells; M5 export and fixtures. Acceptance: a measurement on a rotated figure is correct, no SI unit appears without calibration, and the value can flow into `stem-page-calculations`. Dependency: F02, the reference policy."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 270
created = 2026-11-10
tags = ["stem", "geometry", "units", "p2"]
rebuild = false
