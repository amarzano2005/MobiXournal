[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobix-cli"
version = "0.1.0"
description = "Inspection, validation and minimal writing of .mobix notebooks, standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "MobiXournal contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.scripts]
mobix-cli = "mobix_cli.cli:main"

[tool.setuptools]
packages = ["mobix_cli"]
